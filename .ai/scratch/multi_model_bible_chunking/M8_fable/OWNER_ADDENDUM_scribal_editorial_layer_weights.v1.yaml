---
# OWNER ADDENDUM (Lowell Wong, 2026-07-30) - binding for the M8_fable campaign.
# Merge into model_manifest.yaml / corrective contract; applies from Genesis onward,
# and expressly to the whole NT (no Masoretic layer there; modern paragraphing is
# never ancient structure). Symmetric: applies to challenges, defenses, boss rulings.
schema_version: m8_scribal_editorial_layer_weights.v1
status: owner_binding_addendum
scribal_and_editorial_layer_weights:
  principle: >
    Scribal and editorial layers corroborate the text's own compositional signals; they never
    originate a boundary. Weight varies by layer, corpus, and manuscript stability.
  tier_1_may_drive_a_boundary:
    - speech_or_messenger_formula
    - superscription_or_colophon
    - explicit_scene_participant_or_location_change
    - inclusio_refrain_or_acrostic_structure
    - direct_discourse_frame
    - syntactic_protasis_apodosis
    - list_genealogy_or_register_formula
  tier_2_strong_corroboration_cannot_drive_alone:
    - masoretic_disjunctive_accent_clause_level
    - petuchah_in_torah
  tier_3_weak_corroboration:
    - setumah
    - parashah_in_prophets_or_writings
    - parashah_where_witnesses_disagree
  tier_4_metadata_only_never_boundary_evidence:
    - chapter_divisions
    - verse_divisions
    - modern_section_headings
    - na28_ubs_paragraphing
    - wj_red_letter_cross_references_footnotes_strongs
  rules:
    marker_only_claim_is_insufficient_evidence: true
    marker_plus_tier_1_signal_counts: true
    absence_of_marker_is_not_counterevidence_against_a_boundary: true
    single_witness_marker_claim_requires_variance_disclosure: true
    petuchah_and_setumah_must_be_distinguished_not_conflated: true
    apply_symmetrically_to_challenges_defenses_and_boss_rulings: true
    nt_has_no_masoretic_layer_modern_paragraphing_is_never_ancient_structure: true