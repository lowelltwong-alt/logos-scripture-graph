repair_principles:
  - "Bind markers contextually, not with one universal previous-or-next rule."
  - "Use explicit anchor_kind: current_content, next_content_start, between_units, chapter_context, book_context, or unresolved."
  - "Record prior_osis_ref and next_osis_ref where applicable."
  - "Never append descriptive headings, section headings, or speaker labels to canonical Bible witness text."
  - "Do not emit inline word tags from heading or speaker labels as canonical Scripture WordTokens."
  - "Fail unresolved rather than guess marker ownership."
  - "Measure exact generated-data and chunk effects before committing canonical regeneration."
