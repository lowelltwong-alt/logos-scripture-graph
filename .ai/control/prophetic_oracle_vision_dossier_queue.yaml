object_type: prophetic_oracle_vision_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T365 as non-output-changing research prep after T364 wisdom/dialogue/poetry dossiers."
reason_for_inclusion: "Give future prophetic, oracle, vision, servant-song, temple-vision, restoration, graph, retrieval, review-packet, evaluator, and chunking agents a first-class dossier queue so oracle form, judgment/hope turns, symbolic actions, visions, and prophetic book frames remain visible without becoming fulfillment theology, eschatology, Israel/church, temple, reviewed gold, or chunk-boundary authority."
schema_version: prophetic_oracle_vision_dossier_queue.v1
queue_id: t365_prophetic_oracle_vision_dossier_queue
owner: Lowell Wong
authority:
  records_prophetic_oracle_vision_dossier_queue: true
  records_prophetic_boundary_risks: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_fulfillment_theology: false
  authorizes_eschatological_system: false
  authorizes_covenant_system: false
  authorizes_israel_church_relation: false
  authorizes_messianic_identification: false
  authorizes_temple_theology: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_intertext_truth: false
  authorizes_boundary_import: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  lanes: [prophetic_oracle, prophetic_oracle_vision]
  research_mode: non_output_changing
  relation_to_t358: "Companion oracle-form dossier queue for the prophetic_oracle_vision dimension of the Bible-wide research registry."
  relation_to_t360: "Complements apocalyptic/prophetic intertext dossiers by focusing on prophetic oracle and vision form rather than intertext truth; both remain evidence only."
  relation_to_t364: "Continues the research-only stack after wisdom/dialogue/poetry dossiers without authorizing any prophetic implementation."
preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to encode a disputed fulfillment system, eschatological timeline, covenant system, Israel/church relation, temple theology, servant-song identification, or prophetic chronology as a chunking default."
  preserved_review_options:
    - local_oracle_review
    - parent_oracle_cycle_review
    - vision_report_review
    - symbolic_action_review
    - judgment_hope_pair_review
    - servant_song_review
    - temple_vision_review
    - day_of_yahweh_review
    - prophetic_book_frame_review
  not_selected_by_queue:
    - fulfillment theology system
    - eschatological timeline
    - Israel/church relation
    - supersession or non-supersession system
    - covenant continuity or discontinuity system
    - millennial temple view
    - servant-song referent system
    - prophetic chronology harmonization
    - oracle-to-NT fulfillment boundary
    - day-of-Yahweh timeline
evidence_channels:
  - channel_id: oracle_formula
    use_when: "A passage uses thus-says, burden/oracle, word-of-Yahweh, woe, lawsuit, lament, or indictment formulae."
    non_authorization: "Oracle formulae are evidence only and do not authorize chunk boundaries, fulfillment claims, graph edges, retrieval truth, or output changes."
  - channel_id: prophetic_speech_frame
    use_when: "A prophetic book moves through speeches, addressees, summons, indictments, judgments, promises, or narrative frames."
    non_authorization: "Prophetic speech frames are evidence only and do not authorize route behavior, covenant systems, Israel/church relations, or chunk boundaries."
  - channel_id: vision_report
    use_when: "A passage reports a vision, heavenly scene, symbolic sequence, or interpreted image."
    non_authorization: "Vision reports are evidence only and do not authorize eschatological systems, symbolic identity claims, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: symbolic_action
    use_when: "A prophet performs a sign-act, embodied oracle, enacted parable, or object lesson."
    non_authorization: "Symbolic actions are evidence only and do not authorize theological fulfillment, graph truth, or automatic unit boundaries."
  - channel_id: judgment_hope_turn
    use_when: "A passage turns between judgment, lament, exile, restoration, comfort, new covenant, Spirit, temple, land, or Zion hope."
    non_authorization: "Judgment/hope turns are evidence only and do not authorize covenant system selection, Israel/church conclusions, retrieval truth, or chunk boundaries."
  - channel_id: servant_or_messianic_language
    use_when: "A passage includes servant, king, branch, son, anointed, pierced, shepherd, or messianic-sensitive language."
    non_authorization: "Servant and messianic-sensitive language is evidence only and does not authorize messianic identification, fulfillment theology, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: temple_zion_land_imagery
    use_when: "A passage uses temple, city, Zion, land, mountain, priesthood, sacrifice, river, or new-creation imagery."
    non_authorization: "Temple, Zion, and land imagery is evidence only and does not authorize temple theology, fulfillment systems, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: day_of_yahweh_review
    use_when: "A passage invokes the day of Yahweh/Lord, cosmic signs, judgment, restoration, or Spirit-outpouring timing."
    non_authorization: "Day-of-Yahweh language is evidence only and does not authorize an eschatological timeline, fulfillment timing, graph edges, retrieval truth, chunk boundaries, or output changes."
  - channel_id: source_metadata_formatting
    use_when: "Headings, paragraphing, poetry markers, cross-references, footnotes, punctuation, or formatting make a boundary seem obvious."
    non_authorization: "Source metadata and formatting are evidence only and do not authorize Scripture truth, intertext truth, graph edges, retrieval truth, reviewed gold, chunk boundaries, or output changes."
  - channel_id: canonical_intertext_echo
    use_when: "A passage is often connected to later Scripture or earlier prophetic/covenant texts."
    non_authorization: "Canonical echoes are evidence only and do not authorize intertext truth, fulfillment claims, graph edges, retrieval truth, or chunk boundaries."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - primary_lane
  - evidence_channels
  - boundary_questions
  - review_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
