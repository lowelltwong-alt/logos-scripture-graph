schema_version: chunking_human_decision_forecast.v1
forecast_id: chunking_ready_owner_decision_forecast
owner: Lowell Wong
authority:
  records_anticipated_decisions: true
  authorizes_chunk_output_change: false
  authorizes_reviewed_gold_promotion: false
  authorizes_route_behavior_change: false
  authorizes_evaluator_change: false
  authorizes_graph_edge_generation: false
  authorizes_retrieval_truth: false
  authorizes_textual_critical_policy: false
  authorizes_boundary_import: false
goal_blocked_explanation:
  thread_goal_status: blocked
  reason: "The thread goal required future owner decisions before output-changing chunking could faithfully continue. The repo itself is not blocked for non-output-changing prep; it is blocked only at owner-decision and implementation gates."
  current_unblock_status: t374_overlap_b_selected_additive_overlay_ready
  remaining_blocks:
    - evaluator_behavior_change
    - graph_retrieval_vector_output
    - child_span_selection
    - broader_epistle_generalization
    - whole_bible_output_pass
  unblock_strategy: "Front-load predictable owner decisions as dockets and stop conditions, then let agents continue non-output-changing harness, review-packet, audit, and readiness work until an explicit gate is reached."
decision_policy:
  owner_pattern_projection_policy: .ai/control/owner_decision_projection_policy.yaml
  projected_decisions_allowed_when:
    - prior_owner_decisions_are_materially_same_shape
    - projected_default_is_conservative_and_fail_closed
    - no_conflicting_owner_decisions_apply_to_the_target_text
    - decision_is_recorded_in_the_projection_policy_and_decision_register
    - no_output_or_authority_change_is_created
  owner_must_be_told_when:
    - prior_owner_decisions_conflict_for_the_text_under_review
    - decision_pattern_is_new
    - projection_confidence_is_not_high
    - projection_would_select_child_spans_speaker_boundaries_textual_policy_or_theological_system
  owner_decision_required_for:
    - reviewed_gold_promotion
    - chunk_output_change
    - route_behavior_change
    - evaluator_behavior_change
    - graph_edge_generation
    - retrieval_truth_or_default_profile
    - new_textual_critical_policy_selection
    - variant_sensitive_promotion_owner_confirmation
    - source_tradition_preference
    - canon_scope_change
    - boundary_import
    - denominational_system_as_chunk_authority
  if_owner_unavailable: stop_before_authority_change
  non_output_prep_allowed:
    - research_dossiers
    - review_packets
    - owner_review_dockets
    - non_authorizing_harnesses
    - no_context_audit_material
    - validator_hardening
    - same_baseline_eval_preparation
