object_type: chunking_human_decision_forecast
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T368 after the maintainer asked why the thread goal was blocked and how to front-load human decisions so chunking readiness does not stall unexpectedly."
reason_for_inclusion: "Name predictable owner decisions early, tie them to downstream gates, and prevent future agents from treating planning or review prep as implementation authority."
