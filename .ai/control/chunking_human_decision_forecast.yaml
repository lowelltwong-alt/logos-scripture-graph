    - decision_register_current
    - no_context_audit_surface_current
    - explicit_owner_implementation_authorization
    - owner_decision_option_presentation_policy_if_owner_gate
  not_ready_if:
    - packet_is_pending_human_review
    - owner_selection_is_pending
    - reviewed_gold_is_not_promoted
    - target_is_variant_sensitive_without_policy
    - route_or_evaluator_behavior_would_change_without_owner_authorization
    - graph_retrieval_or_vector_output_would_be_generated
stop_conditions:
  - unanticipated_theological_risk
  - source_metadata_would_become_authority
  - variant_sensitive_claim_without_policy
  - missing_reviewed_gold
  - evaluator_confound_discovered
  - non_target_output_diff
  - route_leakage_outside_selected_lane
  - graph_retrieval_vector_output_requested
  - boundary_material_import_needed
what_not_to_do:
  - do_not_treat_this_forecast_as_authorization
  - do_not_turn_owner_review_options_into_reviewed_gold
  - do_not_implement_chunks_from_pending_packets
  - do_not_use_systematic_theology_as_hidden_chunk_authority
  - do_not_use_liberal_critical_suspicion_as_hidden_default
  - do_not_use_source_metadata_as_graph_or_chunk_truth
  - do_not_select_textual_critical_policy_by implication
  - do_not_import_boundary_material_into_canonical_scripture
  - do_not_claim improvement_without_same_baseline_evaluation
  - do_not_merge_output_changing_work_without_owner_authorization
  - do_not_project_owner_decisions_when_prior_decisions_conflict_for_the_target_text
  - do_not_present_owner_gates_without_options_repercussions_risks_and_non_authorizations
