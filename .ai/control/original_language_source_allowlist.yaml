  manifest_name: source_manifest.yaml
  archive_subdir: raw
  only_enabled_sources: true
  require_license_url: true
  require_sha256: true
  require_version_or_commit: true
  strongs_overlay_destination: data/candidate/original_language_evidence
  canonical_source_view_destination: data/candidate/original_language_evidence/canonical_source_views
  downstream_consumes_canonical_source_view_not_raw_archive: true
  strongs_overlay_in_raw_allowed: false
  manuscript_bulk_download_allowed: false
  public_viewable_without_bulk_terms: catalog_only
