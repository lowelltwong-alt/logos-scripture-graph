object_type: orthodox_original_language_pressure_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-19 during T377 after the maintainer asked that key passages often used in non-orthodox argumentation be researched ahead of chunking with Greek/Hebrew and grammar overlays."
reason_for_inclusion: "Give future chunking, review-packet, graph, retrieval, and evaluation agents a first-class queue of original-language pressure passages so orthodox Scripture handling is protected without importing non-orthodox sources, selecting a denominational system, or treating lexical/grammar evidence as automatic chunk authority."
schema_version: orthodox_original_language_pressure_dossier_queue.v1
queue_id: t377_orthodox_original_language_pressure_dossier_queue
owner: Lowell Wong
authority:
  records_original_language_pressure_queue: true
  records_non_orthodox_pressure_cases: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_original_language_truth: false
  authorizes_translation_preference: false
  authorizes_textual_critical_decision: false
  authorizes_canon_scope_change: false
  authorizes_boundary_import: false
  authorizes_nonorthodox_source_authority: false
  authorizes_extra_canonical_source_authority: false
  authorizes_doctrinal_system: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  research_mode: non_output_changing
  lanes:
    - source_metadata_research
    - textual_variant_source_tradition
    - epistle_argument
    - gospel_discourse_wj
    - prophetic_oracle
    - narrative_pericope
    - bible_wide_orchestration
  relation_to_t367: "Applies the Orthodox Hermeneutic Firewall to original-language pressure passages without selecting one denomination's systematic theology as chunk authority."
  relation_to_t366: "Extends textual-variant/source-tradition watchfulness to translation-divergence and grammar-overlay pressure cases."
  relation_to_t371: "Parallel research memory only; does not replace the T371 owner reviewed-gold promotion gate."
preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian orthodox Christianity and canonical Scripture authority as the boundary while refusing LDS extra-canonical authority, Watch Tower/New World Translation authority, anti-Trinitarian defaults, anti-supernatural defaults, liberal-critical defaults, and one-denomination systematic theology as chunk authority."
  canonical_source_rule: "Canonical Scripture in the canonical 66 remains the governed Scripture source. External non-orthodox texts or translations may be named as pressure-source labels for future review, but they are not imported, quoted as authority, and not promoted into canonical outputs by this queue."
  source_language_rule: "Greek/Hebrew lemma, morphology, syntax, grammar, and ancient Jewish or early Christian context may be preserved as evidence for review. They do not by themselves authorize doctrine, graph edges, retrieval truth, chunk boundaries, reviewed gold, or output changes."
  preserved_review_options:
    - canonical_text_review
    - greek_grammar_overlay_review
    - hebrew_grammar_overlay_review
    - morphology_syntax_review
    - lexical_semantic_range_review
    - translation_divergence_review
    - non_orthodox_pressure_review
    - ancient_jewish_context_review
    - trinitarian_christological_boundary_review
    - owner_review_before_any_authority_change
  not_selected_by_queue:
    - Watch Tower/New World Translation authority
    - LDS extra-canonical authority
    - anti-Trinitarian reading
    - modalist reading
    - tritheist or polytheist reading
    - one-denomination systematic theology as chunk authority
    - automatic proof-text conclusion from one lemma or grammar label
    - automatic graph edge from original-language evidence
evidence_channels:
  - channel_id: greek_lemma_morphology_syntax
    use_when: "A Greek passage is often argued from article use, predicate nominatives, participles, case agreement, tense/aspect, or syntax."
    non_authorization: "Greek evidence is evidence only and does not authorize lexical truth, doctrine, graph edges, retrieval truth, chunk boundaries, reviewed gold, or output changes."
  - channel_id: hebrew_lemma_morphology_syntax
    use_when: "A Hebrew passage is often argued from plurality, construct phrases, divine names/titles, verb agreement, or lexical range."
    non_authorization: "Hebrew evidence is evidence only and does not authorize doctrine, graph edges, retrieval truth, chunk boundaries, reviewed gold, or output changes."
  - channel_id: translation_divergence_pressure
    use_when: "A translation rendering is known or suspected to diverge in a way that affects Trinity, Christology, pneumatology, canon, resurrection, baptism, or divine identity claims."
    non_authorization: "Translation divergence is evidence only and does not authorize a translation preference, source-tradition preference, graph edge, retrieval truth, chunk boundary, reviewed gold, or output change."
  - channel_id: non_orthodox_prooftext_pressure
    use_when: "A passage is frequently used by non-orthodox groups or anti-orthodox arguments."
    non_authorization: "Non-orthodox pressure labels are evidence only and do not authorize importing, privileging, or refuting from external sources as Scripture authority."
  - channel_id: extra_canonical_pressure
    use_when: "A passage is tied to LDS or other extra-canonical claims that could affect canon, authority, or doctrine."
    non_authorization: "Extra-canonical pressure is evidence only and does not authorize canon-scope change, boundary import, noncanonical authority, graph truth, retrieval truth, chunk boundaries, or output changes."
  - channel_id: divine_plurality_and_unity_language
    use_when: "A passage involves plurality, unity, divine council, the Angel/YHWH distinction, Lord language, or ancient Jewish context relevant to one being and personal distinctions."
    non_authorization: "Plurality/unity language is evidence only and does not authorize a Trinitarian proof text, divine-council system, tritheism, modalism, graph edge, retrieval truth, chunk boundary, reviewed gold, or output change."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - primary_lanes
  - pressure_sources
  - evidence_channels
  - original_language_focus
  - grammar_overlay_needed
  - boundary_questions
  - orthodox_boundary
  - theological_downstream_risks
  - assumptions_avoided
  - review_options_preserved
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
