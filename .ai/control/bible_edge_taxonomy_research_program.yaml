schema_version: 1
object_type: bible_edge_taxonomy_research_program
task_id: T450
status: planning_only
planning_only: true
non_authorizing: true
purpose: >
  Define the candidate edge-family map for a future Bible knowledge graph while
  preserving strict authority boundaries. This program helps agents research
  possible biblical, theological, linguistic, historical, literary, calendar,
  covenantal, sacrificial, apologetic, and polemic connections without creating
  graph truth or expanding the predicate registry.

current_predicate_registry_snapshot:
  registry_path: config/governance/predicate_registry.yaml
  note: "This snapshot is descriptive only. New predicate names below are future proposals, not registered predicates."
  registered_predicates:
    - editorial_cross_reference
    - quotesFrom
    - alludesTo
    - echoes
    - fulfills
    - typifies
    - parallelTo
    - thematicallyRelatedTo
    - groundedIn
    - renders
    - occursIn

authority_boundary:
  expands_predicate_registry: false
  generates_graph_edges: false
  creates_candidate_edge_rows: false
  creates_retrieval_truth: false
  creates_vector_truth: false
  runs_embeddings_or_builds_indexes: false
  imports_boundary_material: false
  changes_chunk_output: false
  promotes_reviewed_gold: false
  changes_route_or_evaluator_behavior: false
  selects_preferred_reading_or_source_tradition: false
  selects_canon_scope: false
  selects_theological_system: false
  authorizes_theology_authority: false
  authorizes_apologetic_or_polemic_conclusion: false
  requires_owner_gate_before:
    - predicate_registry_expansion
    - graph_edge_generation
    - candidate_edge_database_population
    - reviewed_semantic_edge_promotion
    - fulfillment_or_typology_assertion
    - prophecy_or_apocalyptic_claim
    - WJ_or_speaker_identity_claim
    - textual_variant_or_source_tradition_use
    - apologetic_or_polemic_argument_as_graph_claim

assertion_mode_policy:
  structural_deterministic:
    description: "Derived from governed source files, schemas, or deterministic parsers."
    allowed_examples:
      - canonical containment and order checks
      - token occurrence or translation rendering rows already generated by governed pipelines
      - exact editorial cross-reference rows with edition provenance
    required_fields:
      - subject_ref
      - object_ref
      - derivation_rule
      - source_policy_version
      - provenance
      - confidence
    cannot_authorize:
      - semantic truth
      - theology authority
      - retrieval truth
      - chunk boundaries
  reviewed_semantic:
    description: "Human or owner-reviewed semantic connection with exact evidence."
    required_fields:
      - subject_ref
      - object_ref
      - evidence_refs
      - reviewer
      - review_date
      - assertion_scope
      - confidence
      - limitations
    cannot_authorize:
      - denominational system selection
      - source-tradition preference
      - automatic reuse outside reviewed scope
  model_inferred_candidate:
    description: "Disposable model proposal for later review."
    required_fields:
      - subject_ref
      - object_ref
      - model_id
      - prompt_version
      - run_id
      - evidence_refs
      - confidence
      - unresolved_questions
    cannot_authorize:
      - graph truth
      - reviewed status
      - retrieval ranking
      - theology authority

global_evidence_floor:
  required_for_every_future_edge_or_candidate:
    - exact subject_ref and object_ref
    - OSIS or book/chapter/verse/span scope
    - assertion_mode
    - trust_zone
    - status
    - confidence
    - provenance
    - evidence_refs
    - source_policy_version
    - non_authority_status
  evidence_only_metadata:
    - source paragraph, poetry, footnote, cross-reference, and heading markers
    - Strong's numbers
    - lemma and morphology tags
    - WJ or red-letter formatting
    - capitalization, punctuation, verse numbers, and section headings
    - manuscript witness metadata
  forbidden_shortcuts:
    - Strong's numbers as lexical, theological, or source-text authority
    - WJ formatting as speaker authority
    - editorial cross-references as intertextual truth
    - oldest witness as automatic preferred reading
    - model agreement as reviewed graph truth
    - apologetic usefulness as authority

edge_family_lanes:
  - lane_id: structural_source_occurrence
    scope: "Canonical structure, containment, adjacency, token occurrence, and translation rendering."
    risk_level: low_to_medium
    candidate_predicate_names:
      existing:
        - renders
        - occursIn
      proposed_future:
        - containsSpan
        - adjacentTo
        - hasToken
        - canonicallyPrecedes
    evidence_requirements:
      - canonical sidecar or governed substrate path
      - deterministic derivation rule
      - source policy version
      - no semantic inference beyond occurrence or structure
    assertion_mode_policy: structural_deterministic
    escalation_triggers:
      - missing canonical ref
      - cross-canon profile ambiguity
      - textual variant changes endpoint identity
    non_authorizations:
      - no semantic graph conclusion
      - no doctrine claim
      - no retrieval truth

  - lane_id: editorial_metadata
    scope: "Edition-provided cross-references, headings, footnotes, paragraph markers, poetry markers, and formatting features."
    risk_level: medium
    candidate_predicate_names:
      existing:
        - editorial_cross_reference
      proposed_future:
        - hasFootnote
        - hasHeading
        - hasParagraphMarker
        - hasPoetryMarker
    evidence_requirements:
      - edition provenance
      - marker type and raw/canonical source path
      - explicit evidence-only label
    assertion_mode_policy: structural_deterministic
    escalation_triggers:
      - metadata used as boundary authority
      - metadata used as intertext truth
      - WJ marker used as speaker identity
    non_authorizations:
      - no intertextual truth
      - no chunk boundary authority
      - no speaker authority

  - lane_id: intertext_canonical
    scope: "Direct quotations, citations, allusions, echoes, canonical parallels, and repeated phrase or symbol patterns."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - quotesFrom
        - alludesTo
        - echoes
        - parallelTo
        - thematicallyRelatedTo
      proposed_future:
        - citesScripture
        - paraphrases
        - sharesPhraseWith
        - sharesSymbolWith
    evidence_requirements:
      - source and target context
      - phrase, formula, or symbol evidence
      - source-language and variant sensitivity check where relevant
      - dossier or review packet for non-explicit links
    assertion_mode_policy: reviewed_semantic
    escalation_triggers:
      - Daniel or Revelation
      - prophecy or apocalyptic symbol
      - dense epistle argument
      - low confidence or disputed allusion
    non_authorizations:
      - no automatic fulfillment
      - no eschatological system selection
      - no source-tradition preference

  - lane_id: prophecy_apocalyptic
    scope: "Prophecy, oracle, Day-of-Yahweh patterns, messianic links, apocalyptic visions, symbolic imagery, and fulfillment claims."
    risk_level: high
    candidate_predicate_names:
      existing:
        - fulfills
        - typifies
        - alludesTo
        - echoes
      proposed_future:
        - oracleEchoes
        - visionParallels
        - sharesApocalypticSymbolWith
        - hasFulfillmentCandidate
    evidence_requirements:
      - prophetic or apocalyptic dossier
      - canonical context
      - explicit fulfillment language where asserted
      - preserved hermeneutic options
      - reviewer notes for typology or fulfillment
    assertion_mode_policy: reviewed_semantic
    escalation_triggers:
      - Daniel
      - Revelation
      - Olivet discourse
      - temple, city, beast, antichrist, millennium, Israel/church, or covenant-system pressure
    non_authorizations:
      - no prophecy system selection
      - no automatic event identification
      - no apologetic conclusion as graph truth

  - lane_id: orthodox_creedal_theology
    scope: "Credal Christian guardrails, doctrinal motifs, Christology, Trinity, incarnation, resurrection, salvation, church, sacraments, and doctrinal pressure."
    risk_level: high
    candidate_predicate_names:
      existing:
        - thematicallyRelatedTo
        - groundedIn
      proposed_future:
        - supportsDoctrineCandidate
        - preservesOrthodoxOption
        - requiresTheologyReview
        - rejectsHeterodoxReadingCandidate
    evidence_requirements:
      - immediate and book context
      - canonical context
      - orthodox firewall docket or theological decision register reference
      - explicit limitation of denominational conclusions
    assertion_mode_policy: reviewed_semantic
    escalation_triggers:
      - Trinity or Christology
      - justification or law/gospel
      - covenant theology pressure
      - sacrament or ecclesiology pressure
      - resurrection or incarnation argument
    non_authorizations:
      - no liberal-critical default
      - no anti-supernatural default
      - no denominational systematic theology selection
      - no doctrine authority claim from model output

  - lane_id: covenant_biblical_theology
    scope: "Covenant institution, renewal, sign, oath, promise, mediator, blessing, curse, fulfillment, and new-covenant development."
    risk_level: high
    candidate_predicate_names:
      existing:
        - typifies
        - fulfills
        - groundedIn
        - thematicallyRelatedTo
      proposed_future:
        - establishesCovenant
        - renewsCovenant
        - hasCovenantSign
        - covenantPromiseDevelopsIn
    evidence_requirements:
      - exact covenant text and context
      - promise/sign/mediator/condition fields where present
      - canonical development notes
      - preserved theological options
    assertion_mode_policy: reviewed_semantic
    escalation_triggers:
      - Israel/church relation
      - law/gospel relation
      - Abrahamic, Mosaic, Davidic, and new-covenant synthesis
      - fulfillment or typology assertion
    non_authorizations:
      - no covenant-system selection
      - no replacement-theology or dispensational conclusion as graph truth

  - lane_id: sacrifice_temple_priesthood
    scope: "Offerings, sacrifices, purity, atonement, priesthood, tabernacle, temple, feasts, sanctuary objects, and ritual roles."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - typifies
        - fulfills
        - thematicallyRelatedTo
      proposed_future:
        - hasOfferingType
        - usesSanctuaryObject
        - priestlyRoleIn
        - ritualPurifies
        - atonementCandidateFor
    evidence_requirements:
      - ritual text
      - participant and object roles
      - offering category evidence
      - Hebrews or Gospel fulfillment review where applicable
    assertion_mode_policy: reviewed_semantic
    escalation_triggers:
      - Jesus as fulfillment of offering category
      - Hebrews typology
      - temple/apocalyptic connections
      - disputed ritual category
    non_authorizations:
      - no typology without review
      - no sacramental system selection

  - lane_id: literary_discourse_genre
    scope: "Genre, discourse, argument flow, speech frames, laments, praise turns, acrostics, refrains, wisdom sayings, genealogy, legal lists, and narrative scenes."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - parallelTo
        - groundedIn
      proposed_future:
        - containsLiteraryUnit
        - partOfLiteraryUnit
        - continuesArgument
        - speakerTurnAfter
        - refrainOf
        - acrosticMemberOf
        - hasGenreForm
        - dependsOnContext
    evidence_requirements:
      - text span or boundary claim reference
      - source markers as evidence only
      - discourse connector or literary-form evidence
      - review packet for speaker or argument claims
    assertion_mode_policy: model_inferred_candidate
    escalation_triggers:
      - Job or Song speaker identity
      - Psalm superscription as authority
      - Gospel or Revelation voice shift
      - dense epistle argument
    non_authorizations:
      - no boundary authority from genre labels
      - no speaker authority from WJ or headings

  - lane_id: chronology_calendar_geography
    scope: "Dates, feasts, Sabbath, new moon, jubilee, lunar calendar, regnal years, genealogical chronology, geography, routes, kingdoms, empires, and place events."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - occursIn
        - thematicallyRelatedTo
      proposed_future:
        - occursOnCalendarDateCandidate
        - associatedWithFeast
        - inRegnalYear
        - locatedAt
        - travelsFromTo
        - genealogicallyRelatedTo
    evidence_requirements:
      - exact text reference
      - calendar or chronology source policy
      - uncertainty and alternative chronology notes
      - map/place source provenance if used
    assertion_mode_policy: model_inferred_candidate
    escalation_triggers:
      - lunar/solar conversion
      - disputed regnal chronology
      - date used in prophecy or apologetic argument
      - genealogy harmonization pressure
    non_authorizations:
      - no harmonization by default
      - no chronology system as graph truth
      - no calendar conversion as canonical authority

  - lane_id: linguistic_original_language
    scope: "Hebrew, Aramaic, Greek lexemes, lemmas, morphology, syntax, phrase construction, semantic domains, Strong's overlays, and translation renderings."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - renders
        - occursIn
      proposed_future:
        - sharesLemmaWith
        - hasMorphology
        - hasPhraseConstruction
        - alignsToSourceToken
        - semanticDomainCandidate
    evidence_requirements:
      - source token id where authorized
      - lemma and morphology provenance
      - Strong's alignment basis and confidence if present
      - textual variant sensitivity check
    assertion_mode_policy: structural_deterministic
    escalation_triggers:
      - doctrinal claim from lemma
      - contested morphology or syntax
      - variant-dependent source token
      - translation faithfulness claim
    non_authorizations:
      - no isolated-word theology
      - no Strong's as source text
      - no translation preference

  - lane_id: manuscript_textual_witness
    scope: "Manuscript witnesses, variants, source traditions, punctuation/editorial layers, omissions, additions, spelling variants, and apparatus evidence."
    risk_level: high
    candidate_predicate_names:
      existing: []
      proposed_future:
        - attestedByWitness
        - hasVariantCase
        - supportsReadingCandidate
        - variantSensitiveAt
        - editorialLayerAt
    evidence_requirements:
      - witness id and provenance
      - variant unit and readings
      - confidence and uncertainty
      - source/license status
      - no preferred reading unless separately authorized
    assertion_mode_policy: model_inferred_candidate
    escalation_triggers:
      - preferred reading pressure
      - canon-scope pressure
      - doctrinally significant variant
      - manuscript family/source-tradition preference
    non_authorizations:
      - no preferred reading
      - no source-tradition authority
      - no canon change

  - lane_id: historical_cultural_reception
    scope: "Persons, offices, kingdoms, empires, rituals, customs, archaeological/historical background, reception history, and early Christian creedal or liturgical patterns."
    risk_level: medium_to_high
    candidate_predicate_names:
      existing:
        - thematicallyRelatedTo
        - occursIn
      proposed_future:
        - historicalBackgroundFor
        - culturalPracticeIn
        - receptionWitnessFor
        - earlyCreedalPatternCandidate
        - officeHeldBy
    evidence_requirements:
      - primary text reference
      - historical source provenance
      - background-only label
      - uncertainty and dating notes
    assertion_mode_policy: model_inferred_candidate
    escalation_triggers:
      - extra-biblical source used to control biblical meaning
      - early creed or resurrection-evidence claim
      - archaeological or historical controversy
    non_authorizations:
      - no background source authority over Scripture
      - no apologetic conclusion as graph truth

  - lane_id: apologetic_polemic
    scope: "Candidate links useful for defense of Christian claims, response to objections, polemics against false gods or false teaching, and internal consistency checks."
    risk_level: high
    candidate_predicate_names:
      existing:
        - groundedIn
        - thematicallyRelatedTo
      proposed_future:
        - answersObjectionCandidate
        - supportsApologeticArgumentCandidate
        - polemicAgainstCandidate
        - exposesFalseWorshipCandidate
    evidence_requirements:
      - biblical text evidence
      - claim statement and limits
      - preserved counterarguments or uncertainties
      - frontier or owner review for production use
    assertion_mode_policy: model_inferred_candidate
    escalation_triggers:
      - resurrection chronology or early creed claim
      - alleged contradiction resolution
      - anti-Jewish or anti-denominational polemic risk
      - historical apologetics claim
    non_authorizations:
      - no apologetic conclusion as authority
      - no hostile caricature of opposing positions
      - no liberal-critical default or covert theology injection

model_review_ladder:
  - step: candidate_research
    actor: cursor_or_other_worker_model
    output: scratch candidate notes only
    stop_before:
      - selecting production predicates
      - generating graph edges
      - resolving theology
  - step: codex_architecture_review
    actor: codex
    output: reviewed taxonomy, validator gaps, owner docket
    stop_before:
      - predicate registry change without owner gate
      - edge generation
  - step: frontier_review
    actor: claude_opus_or_other_frontier_model
    output: hard-case audit for theology, prophecy, apocalyptic, WJ, variants, apologetic use
    required_for_lanes:
      - prophecy_apocalyptic
      - orthodox_creedal_theology
      - covenant_biblical_theology
      - manuscript_textual_witness
      - apologetic_polemic
  - step: owner_gate
    actor: owner
    output: exact authorization for predicate registration, candidate rows, or reviewed graph edges
  - step: implementation
    actor: codex_or_worker
    output: separately scoped PR with validators and no cross-lane authority expansion

future_rust_validator_lane:
  recommendation: "Use Rust for deterministic, high-volume edge hygiene only after schemas settle."
  rust_allowed_for:
    - large JSONL edge-candidate scans
    - endpoint reference validation
    - duplicate edge key detection
    - predicate registry membership checks
    - evidence/provenance field presence
    - canonical ref coverage
    - no-authority leakage string checks
  rust_forbidden_for:
    - deciding theology
    - selecting predicates
    - judging fulfillment or typology
    - resolving textual variants
    - choosing source tradition
    - ranking apologetic force
    - deciding retrieval truth
  likely_future_tasks:
    - T451_edge_schema_and_predicate_proposal_packet
    - T452_rust_edge_candidate_hygiene_validator
    - T453_multi_model_edge_family_candidate_sprint

