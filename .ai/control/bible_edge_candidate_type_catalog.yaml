multi_model_use:
  allowed_worker_output: "Scratch notes and candidate additions to this catalog only."
  model_roles:
    cursor_or_fast_worker: "Find omissions, source surfaces, and candidate edge examples; do not select predicates."
    codex: "Integrate, validate, compare against repo governance, and prepare owner dockets."
    claude_frontier: "Audit hard theology, prophecy, apocalyptic, WJ, variants, apologetic, and original-language claims."
    gemini_or_other_model: "Independent breadth check for missing literary, historical, linguistic, calendar, and manuscript edge families."
  must_stop_before:
    - predicate_registry_expansion
    - graph_edge_generation
    - candidate_edge_row_population
    - reviewed_semantic_edge_promotion
    - theology_or_apologetic_conclusion
    - source_tradition_preference
    - retrieval_or_vector_work

