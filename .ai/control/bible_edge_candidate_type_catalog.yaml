schema_version: bible_edge_candidate_type_catalog.v1
object_type: bible_edge_candidate_type_catalog
task_id: T451
status: planning_only
planning_only: true
non_authorizing: true
trust_zone: canonical_control_plane
owner: Lowell Wong
relation_to_t450: >
  T450 defines broad edge-family lanes. T451 deepens those lanes into specific
  candidate edge-type vocabulary, evidence floors, escalation triggers, and
  review prompts. T451 still does not register predicates or create graph rows.

purpose: >
  Give future Cursor, Codex, Claude/frontier, Gemini, and other model passes a
  shared Bible-appropriate edge catalog to review, extend, and challenge before
  any graph database buildout. The catalog is intentionally useful for
  conservative, credal Christian, biblical-theological, linguistic, historical,
  apologetic, and polemic research while blocking covert liberal-critical,
  anti-supernatural, anti-canonical, heterodox, or one-denominational defaults.

authority_boundary:
  records_candidate_edge_type_catalog: true
  may_surface_for_model_review: true
  may_surface_for_owner_docket: true
  expands_predicate_registry: false
  registers_predicates: false
  generates_graph_edges: false
  creates_candidate_edge_rows: false
  creates_reviewed_semantic_edges: false
  creates_retrieval_truth: false
  creates_vector_truth: false
  runs_embeddings_or_builds_indexes: false
  imports_boundary_material: false
  changes_chunk_output: false
  promotes_reviewed_gold: false
  changes_route_or_evaluator_behavior: false
  selects_preferred_reading_or_source_tradition: false
  selects_canon_scope: false
  selects_theological_system: false
  authorizes_theology_authority: false
  authorizes_apologetic_or_polemic_conclusion: false

current_registered_predicates:
  registry_path: config/governance/predicate_registry.yaml
  note: "Read-only snapshot; T451 proposes no registry changes."
  predicates:
    - editorial_cross_reference
    - quotesFrom
    - alludesTo
    - echoes
    - fulfills
    - typifies
    - parallelTo
    - thematicallyRelatedTo
    - groundedIn
    - renders
    - occursIn

assertion_path_definitions:
  structural_deterministic:
    use_for: "Observed structure, occurrence, metadata, or source/file relationships reproducible from governed inputs."
    can_be_generated_later_only_if: "A later owner-gated task authorizes exact schema/path plus deterministic validators."
    cannot_decide:
      - semantic_truth
      - theology
      - fulfillment
      - typology
      - speaker_identity
      - source_tradition_preference
      - retrieval_truth
  reviewed_semantic:
    use_for: "Human-reviewed meaning-bearing links with exact scope, evidence, reviewer, limitations, and registry support."
    required_before_use:
      - owner_gate
      - registered_predicate
      - exact_evidence_refs
      - scope_limitations
      - confidence_and_uncertainty
      - validator_coverage
    cannot_decide:
      - denomination_as_default
      - source_tradition_preference_unless_explicitly_authorized
      - automatic_reuse_outside_reviewed_scope
  model_inferred_candidate:
    use_for: "Disposable model proposals or disagreement/delta work queues."
    required_before_use:
      - model_id
      - prompt_version
      - run_id
      - evidence_refs
      - confidence
      - unresolved_questions
      - non_authority_status
    cannot_decide:
      - graph_truth
      - reviewed_status
      - retrieval_ranking
      - theology_authority
      - apologetic_conclusion

global_evidence_floor:
  required_for_any_future_edge_or_candidate:
    - edge_type_id
    - subject_ref
    - object_ref
    - assertion_path
    - trust_zone
    - status
    - confidence
    - provenance
    - evidence_refs
    - source_policy_version
    - non_authority_status
    - uncertainty_or_limitation_note
  evidence_only_inputs:
    - Strong's numbers
    - lemma and morphology tags
    - WJ/red-letter formatting
    - editorial cross-references
    - headings and paragraph markers
    - footnotes and alternate reading notes
    - manuscript date or witness metadata
    - divine-title capitalization
    - modern punctuation and verse/chapter numbers
    - model agreement
  universal_never_auto_create:
    - graph_edge_generation
    - predicate_registry_expansion
    - theology_authority
    - retrieval_truth
    - vector_truth
    - chunk_boundary
    - reviewed_gold
    - source_tradition_preference
    - canon_scope_change
    - apologetic_conclusion_as_truth

frontier_escalation_required_for:
  families:
    - prophecy_apocalyptic_typology
    - orthodox_creedal_doctrinal
    - linguistic_original_language
    - textual_criticism_manuscript
    - apologetic_polemic
  triggers:
    - Daniel_or_Revelation
    - Olivet_discourse
    - WJ_or_speaker_boundary
    - Christology_or_Trinity_pressure
    - law_gospel_or_covenant_system_pressure
    - textual_variant_or_source_tradition_pressure
    - original_language_claim_controls_meaning
    - alleged_contradiction_or_apologetic_resolution
    - anti_Jewish_or_caricature_prone_polemic
    - low_confidence_model_disagreement

candidate_edge_families:
  - family_id: structural_source_occurrence
    risk_level: low_to_medium
    description: "Structure and occurrence facts that can be checked deterministically."
  - family_id: editorial_metadata
    risk_level: medium
    description: "Edition metadata and formatting evidence, never intertext or speaker authority."
  - family_id: textual_intertextual
    risk_level: medium_to_high
    description: "Quotation, allusion, echo, parallel, and OT-in-NT relation candidates."
  - family_id: covenant_law_sacrifice_calendar
    risk_level: medium_to_high
    description: "Covenant, legal, ritual, sacrifice, feast, Sabbath, lunar calendar, and worship evidence."
  - family_id: prophecy_apocalyptic_typology
    risk_level: high
    description: "Oracle, fulfillment, typology, messianic, Day-of-Yahweh, Daniel/Revelation, and vision evidence."
  - family_id: orthodox_creedal_doctrinal
    risk_level: high
    description: "Credal Christian, Christological, Trinitarian, soteriological, ecclesial, sacramental, and doctrinal-risk edges."
  - family_id: historical_geographic
    risk_level: medium_to_high
    description: "History, geography, empires, offices, routes, dates, source locations, and discovery metadata."
  - family_id: literary_discourse_genre
    risk_level: medium_to_high
    description: "Narrative scenes, discourse flow, poetry, laments, acrostics, speaker turns, epistle arguments, and genre forms."
  - family_id: linguistic_original_language
    risk_level: medium_to_high
    description: "Hebrew, Aramaic, Greek, lemma, morphology, syntax, phrase, LXX/NT, and translation-divergence evidence."
  - family_id: textual_criticism_manuscript
    risk_level: high
    description: "Variants, source traditions, witnesses, attestation, editorial layers, spelling, omissions, and manuscript support."
  - family_id: apologetic_polemic
    risk_level: high
    description: "Defense, objection-response, false-worship/false-teaching polemic, reliability, and translation-polemics pressure."
  - family_id: pastoral_doctrinal
    risk_level: medium_to_high
    description: "Pastoral themes and doctrine-facing risk labels that aid review without becoming doctrine authority."

candidate_edge_types:
  - edge_type_id: canonical_containment_observed
    family_id: structural_source_occurrence
    label: "Canonical containment observed"
    candidate_status: candidate_type_only
    default_assertion_path: structural_deterministic
    intended_future_predicate: containsSpan
    description: "Book, chapter, verse, span, chunk, or source-token containment derived from governed identifiers."
    evidence_channels: [canonical_scope_config, generated_sidecar, deterministic_parser]
    evidence_floor: [subject_ref, object_ref, derivation_rule, source_policy_version, provenance]
    escalation_triggers: [canon_profile_ambiguity, textual_variant_changes_ref_identity]
    never_auto_create: [semantic_truth, theology_authority, retrieval_truth, graph_edge_generation]

  - edge_type_id: canonical_order_or_adjacency_observed
    family_id: structural_source_occurrence
    label: "Canonical order or adjacency observed"
    candidate_status: candidate_type_only
    default_assertion_path: structural_deterministic
    intended_future_predicate: canonicallyPrecedes
    description: "Canonical order, adjacency, previous/next span, or book sequence evidence."
    evidence_channels: [canonical_66_book_order, osis_ref_order]
    evidence_floor: [subject_ref, object_ref, canon_profile, derivation_rule]
    escalation_triggers: [cross_canon_scope, versification_or_variant_pressure]
    never_auto_create: [chronology_harmonization, theology_authority, retrieval_truth, chunk_boundary]

  - edge_type_id: source_word_occurrence
    family_id: structural_source_occurrence
    label: "Source word occurrence"
    candidate_status: candidate_type_only
    default_assertion_path: structural_deterministic
    intended_future_predicate: occursIn
    description: "Token or word occurrence in a passage or source witness."
    evidence_channels: [word_token_sidecar, original_language_token_source]
    evidence_floor: [token_id, source_id, osis_ref, source_policy_version]
    escalation_triggers: [word_used_for_doctrine, variant_dependent_token]
    never_auto_create: [lexical_truth, theology_authority, semantic_domain_truth, translation_preference]

  - edge_type_id: translation_rendering_alignment
    family_id: structural_source_occurrence
    label: "Translation rendering alignment"
    candidate_status: candidate_type_only
    default_assertion_path: structural_deterministic
    intended_future_predicate: renders
    description: "Translation witness rendering of an authorized source-language token or span."
    evidence_channels: [alignment_record, source_language_witness, translation_witness]
    evidence_floor: [source_token_or_span, translation_span, alignment_basis, confidence, provenance]
    escalation_triggers: [translation_faithfulness_claim, contested_source_reading]
    never_auto_create: [translation_preference, source_tradition_preference, theology_authority]

  - edge_type_id: editorial_cross_reference_observed
    family_id: editorial_metadata
    label: "Editorial cross-reference observed"
    candidate_status: candidate_type_only
    default_assertion_path: structural_deterministic
    intended_future_predicate: editorial_cross_reference
    description: "Edition-provided cross-reference preserved as editorial metadata."
    evidence_channels: [editorial_cross_reference_sidecar, raw_usfm_x_marker]
    evidence_floor: [edition_id, subject_ref, object_ref, marker_ref, provenance]
    escalation_triggers: [used_as_intertext_truth, used_as_fulfillment_claim]
    never_auto_create: [quotesFrom, alludesTo, fulfills, typifies, graph_truth]

  - edge_type_id: source_heading_or_section_marker_observed
