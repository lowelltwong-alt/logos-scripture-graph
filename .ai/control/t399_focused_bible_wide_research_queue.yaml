scoring_model:
  score_range: 0_to_100
  criteria:
    - criterion_id: theological_downstream_risk
      weight: 25
      meaning: "Higher when boundary choices could imply doctrine, hermeneutic, speaker, covenant, eschatology, or apologetic positions."
    - criterion_id: dossier_and_packet_readiness
      weight: 20
      meaning: "Higher when existing packets/dossiers make review-only strengthening efficient without output authority."
    - criterion_id: owner_decision_foreseeability
      weight: 15
      meaning: "Higher when likely owner decisions can be cleanly front-loaded and options can be stated without hidden theology."
    - criterion_id: contextual_and_original_language_need
      weight: 15
      meaning: "Higher when phrase/clause/context review or divine-name/capitalization/Strong's-style metadata is likely to affect faithful review."
    - criterion_id: variant_source_tradition_pressure
      weight: 10
      meaning: "Higher when variant/source-tradition handling must be surfaced before promotion; high score can still remain blocked from strengthening."
    - criterion_id: lane_leverage
      weight: 10
      meaning: "Higher when a focused packet teaches a reusable lane pattern without authorizing global generalization."
    - criterion_id: route_isolation_feasibility
      weight: 5
      meaning: "Higher when later harnesses could prove exact target/non-target isolation after owner promotion."
safe_status_values:
