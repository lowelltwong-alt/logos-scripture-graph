object_type: apocalyptic_prophetic_intertext_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T360 after the maintainer asked to prepare Bible-wide chunking research, especially Revelation and related interpretive issues, before new chunking algorithms resume."
reason_for_inclusion: "Give future Revelation, Daniel, prophetic, Gospel discourse, graph, retrieval, and chunking agents a deterministic queue of intertext-sensitive research dossiers while preserving multiple orthodox hermeneutics and blocking output-changing authority."
schema_version: apocalyptic_prophetic_intertext_dossier_queue.v1
queue_id: t360_apocalyptic_prophetic_intertext_dossier_queue
owner: Lowell Wong
authority:
  records_intertext_dossier_queue: true
  records_hermeneutic_risks: true
  may_surface_for_review: true
  authorizes_scripture_truth: false
  authorizes_lexical_truth: false
  authorizes_intertext_truth: false
  authorizes_speaker_attribution: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_boundary_import: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  research_mode: non_output_changing
  relation_to_t358: "Companion dossier queue for the apocalyptic_symbol_intertext and prophetic_oracle_vision dimensions in the Bible-wide research registry."
  relation_to_t359: "Uses source metadata as evidence only; does not turn cross-references, Strong's-style numbers, WJ markers, headings, footnotes, or capitalization into authority."
  relation_to_t356_t357: "Does not select a John 3 option and does not supersede pending owner review or reviewed-gold gates."
observed_source_metadata_limits:
  canonical_cross_reference_records: 340
  revelation_origin_cross_reference_records: 5
  daniel_origin_cross_reference_records: 0
  ezekiel_origin_cross_reference_records: 0
  zechariah_origin_cross_reference_records: 0
  isaiah_origin_cross_reference_records: 0
  warning: "Editorial cross-reference metadata is sparse and edition-scoped; absence of a source cross-reference is not absence of a canonical intertext, and presence of a source cross-reference is not intertext authority."
hermeneutic_preservation_policy:
  preserved_orthodox_options:
    - futurist
    - preterist
    - historicist
    - idealist
    - premillennial
    - amillennial
    - postmillennial
    - already_not_yet
    - typological
    - covenant_continuity_and_discontinuity_views
  not_selected_by_queue:
    - Revelation chronology
    - millennium view
    - tribulation timing
    - Babylon identity
    - beast identity
    - recapitulation sequence
    - Israel/church relation
    - temple fulfillment system
    - Daniel seventy-weeks system
  orthodox_boundary: "Preserve Nicene/Chalcedonian core while refusing to encode a contested orthodox eschatological or prophetic system as a chunking default."
evidence_channels:
  - channel_id: explicit_canonical_quotation
    use_when: "A NT passage explicitly quotes or cites an OT passage."
    non_authorization: "Explicit quotation is evidence only and does not by itself authorize chunk boundaries, graph edges, retrieval truth, or a fulfillment system."
  - channel_id: editorial_cross_reference_metadata
    use_when: "The eng-web source provides editorial cross-reference metadata."
    non_authorization: "Editorial cross-reference metadata is evidence only and does not authorize intertext truth, graph edges, or chunk boundaries."
  - channel_id: repeated_phrase_or_title
    use_when: "Passages share phrases or titles such as Son of Man, Alpha and Omega, shepherd, kingdom, coming, or holy mountain."
    non_authorization: "Shared phrases are evidence only and do not authorize lexical truth, identity claims, graph edges, or chunk boundaries."
  - channel_id: shared_symbol_or_vision_structure
    use_when: "Passages share symbolic structures such as beasts, horns, thrones, seals, trumpets, bowls, cosmic signs, temple, city, or river/tree imagery."
    non_authorization: "Symbolic similarity is evidence only and does not authorize hermeneutic identity, chronology, graph edges, or chunk boundaries."
  - channel_id: wj_or_voice_metadata
    use_when: "WJ/red-letter or voice metadata appears near apocalyptic, Gospel discourse, or Revelation voice shifts."
    non_authorization: "WJ/voice metadata is evidence only and does not authorize Jesus speaker attribution, Revelation voice identity, graph edges, reviewed gold, or chunk boundaries."
  - channel_id: divine_title_capitalization
    use_when: "Capitalization or titles such as Lord, God, Lamb, Word, Alpha and Omega, First and Last, or Son appear relevant."
    non_authorization: "Divine-title capitalization is evidence only and does not authorize divine identity, Trinitarian relation, graph edges, retrieval truth, or chunk boundaries."
required_future_dossier_fields:
  - dossier_id
  - exact_passage_scope
  - source_passages
  - candidate_intertexts
  - evidence_channels
  - source_metadata_observed
  - hermeneutic_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
dossier_queue:
  - dossier_id: REV_DAN_SON_OF_MAN
    title: Revelation and Daniel Son of Man imagery
    status: research_packet_pending
    priority: 10
    exact_passage_scope: [Rev.1.13, Rev.14.14, Dan.7.13-Dan.7.14]
    source_passages: [Rev.1.13, Rev.14.14]
    candidate_intertexts: [Dan.7.13-Dan.7.14, Matt.24.30, Mark.13.26, Luke.21.27]
    evidence_channels: [editorial_cross_reference_metadata, repeated_phrase_or_title, shared_symbol_or_vision_structure, divine_title_capitalization]
    source_metadata_observed:
      editorial_crossrefs: [Rev.1.13_to_Dan.7.13, Rev.14.14_to_Dan.7.13]
      wj_or_voice_metadata: []
      capitalization_watchpoints: [Son_of_Man, Ancient_of_Days, clouds]
    hermeneutic_options_preserved: [futurist, preterist, historicist, idealist, premillennial, amillennial, postmillennial, already_not_yet]
    theological_downstream_risks:
      - "Chunking could imply whether Daniel 7 is fulfilled, recapitulated, future, enthronement-focused, or multi-layered."
      - "Graphing could imply a settled identity relation between symbols before review."
    assumptions_avoided:
      - "No Daniel/Revelation chronology is selected."
      - "No Son of Man title graph edge is created."
      - "No Revelation voice or Christological identity inference is made from metadata alone."
    reviewed_gold_dependency: "Requires exact human-reviewed dossier and later owner authorization before any chunk, graph, retrieval, or route behavior."
    validator_or_test_plan: "Future packet must test that any Daniel/Revelation behavior is route-isolated and cannot create graph, retrieval, chunk, or output authority without owner approval."
    non_target_identity_plan: "Future implementation must prove non-target Revelation, Daniel, Gospel discourse, and prophetic passages remain byte-identical and route-unaffected."
    non_authorizations: [daniel_revelation_chronology, son_of_man_graph_edge, title_as_identity_authority, chunk_boundary, reviewed_gold, output_change]
