    validations:
      - python scripts/validate_promotion_packet.py --packet .ai/scratch/submissions/SUB-003/promotion_packet.yaml
      - python scripts/validate_promotion_packet.py --packet .ai/scratch/submissions/SUB-004/promotion_packet.yaml
      - python scripts/validate_promotion_packet.py --packet .ai/scratch/submissions/SUB-005/promotion_packet.yaml
      - python scripts/validate_promotion_packet.py --packet .ai/scratch/submissions/SUB-006/promotion_packet.yaml
