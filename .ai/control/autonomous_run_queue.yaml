    validations:
      - python scripts/scratch_prep_sprint.py --list
      - python scripts/scratch_prep_sprint.py --validate-only
      - python scripts/validate_t417_batch2_review_packet_drafts.py
    commit_message: "scratch: 8h marathon batches 5-10 (all remaining ready candidates)."
  - unit_id: U-11
    status: complete
    title: Promotion packets SUB-003 through SUB-006 (batch4-batch10 prep artifacts)
    deliverables:
      - .ai/scratch/submissions/SUB-003/promotion_packet.yaml
      - .ai/scratch/submissions/SUB-004/promotion_packet.yaml
      - .ai/scratch/submissions/SUB-005/promotion_packet.yaml
