codex_daily_gate:
  canonical_prompt: .ai/prompts/codex_daily_prep_review_prompt.md
  review_ledger: .ai/control/agent_review_ledger.jsonl
  prompt_template: |
    Review branch codex/scratch-prep-marathon-8h since last daily review.
    Verdict: APPROVE_PREP | HOLD_WITH_FINDINGS
    Check: task scope, draft non-authorizations, escalation handling, no output/gold/hold leakage.
    Recommend owner docket if drafts are ready. Do not authorize gold or output.
    Append one line to .ai/control/agent_review_ledger.jsonl.
claude_weekly_gate:
  canonical_prompt: .ai/prompts/claude_weekly_architecture_chunking_audit_prompt.md
  review_ledger: .ai/control/agent_review_ledger.jsonl
  frequency: weekly_recommended
  prompt_template: |
    Review Cursor prep and Codex daily verdicts since last weekly audit.
    Verdict: APPROVE_WEEKLY | HOLD_WITH_FINDINGS | ESCALATE_OWNER
    Audit architecture P0-P2, chunking-error patterns, and open T411 escalations.
    Write .ai/audits/reports/weekly/<DATE>-T420-weekly-architecture-chunking-audit.md
    Append one line to .ai/control/agent_review_ledger.jsonl.
merge_policy:
  requires_codex_daily_review: true
  requires_claude_weekly_review_before_main_merge: advisory_v1
  requires_owner_review_before_gold_or_output: true
cursor_cloud_agent:
  recommended_model: composer-2.5-fast
  branch: codex/scratch-prep-marathon-8h
  resume_strategy: "Run python scripts/scratch_prep_sprint.py --list; continue U-11 promotion packets if batches complete."
validator: scripts/validate_autonomous_run_queue.py
