      - T402-LC-008
      - T402-LC-009
      - T402-LC-010
      - T402-LC-011
      - T402-LC-012
      - T402-LC-013
      - T402-LC-014
      - T402-LC-015
      - T402-LC-016
    deliverables:
      - .ai/scratch/prep_sprint/scratch_prep_sprint_queue.yaml
      - scripts/scratch_prep_sprint.py
      - .ai/context/agent_work/T417/claim_traceability_batch5.jsonl
      - .ai/context/agent_work/T417/claim_traceability_batch6.jsonl
      - .ai/context/agent_work/T417/claim_traceability_batch7.jsonl
      - .ai/context/agent_work/T417/claim_traceability_batch8.jsonl
      - .ai/context/agent_work/T417/claim_traceability_batch9.jsonl
