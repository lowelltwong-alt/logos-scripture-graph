terminology_policy:
  allowed_terms:
    unit: "A source text unit under review, usually verse-level in current canonical records."
    parent: "The main approved chunk span if later reviewed and owner-promoted."
    child: "A separately reviewed subspan inside a parent; no child span is assumed or authorized by this queue."
    overlay: "An additive chunk view that does not replace baseline chunks."
    lane: "A chunking problem family such as genealogy/list, narrative scene, epistle opening, poetry, or apocalyptic."
    route: "The exact implementation path authorized to affect an exact target after reviewed gold and harness proof."
    depth: "Numeric hierarchy level if larger structures are needed later."
    section_overlay: "A later possible larger additive structure; not authorized here."
    book_structure_overlay: "A later possible book-level structure; not authorized here."
  avoided_terms:
    - grandparent
    - great_grandparent
  rationale: "Use numeric depth or explicit overlay types later so hierarchy terms do not imply theological rank."
low_complexity_rule: "Low complexity means review eligibility only. It does not mean AI may chunk automatically."
low_complexity_criteria:
  must_have:
    - boundary_appears_text_local_and_structurally_obvious
    - parent_only_span_probably_enough
    - no_known_textual_variant_controls_the_boundary
    - source_metadata_evidence_only
    - no_speaker_attribution_ambiguity_controls_the_boundary
    - no_theological_interpretation_required_to_decide_span
    - no_denominational_systematic_theology_needed
    - no_graph_retrieval_or_vector_truth_implied
    - no_child_spans_necessary_now
  examples_worth_reviewing_first:
    - epistle_greetings_closings_and_thanksgivings
    - narrative_scene_units_with_clear_transition
    - genealogies_and_name_lists
    - legal_or_instructional_lists_where_text_groups_items
    - short_whole_psalms_where_parent_only_is_enough
  likely_not_low_complexity:
    - Revelation_or_Daniel_visions
    - Olivet_discourse
    - John_3_speaker_boundary_cases
    - Romans_9_11
    - Hebrews_7_10
    - 1Corinthians_8_10
    - variant_sensitive_passages
    - trinitarian_or_christological_pressure_passages
    - passages_where_cross_references_or_original_language_claims_affect_boundary
status_values:
  - ready_for_review_packet
  - needs_context_research
  - needs_original_language_review
  - variant_sensitive_hold
  - theological_risk_hold
  - not_low_complexity
  - owner_decision_required
  - do_not_chunk_now
common_non_authorizations: &common_non_authorizations
  - exact_target_selection
