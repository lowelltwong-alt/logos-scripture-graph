schema_version: wj_speaker_discourse_policy.v1
policy_id: canonical_66_wj_speaker_discourse_policy
owner: Lowell Wong
authority:
  records_policy: true
  selects_review_target: true
  may_surface_for_review: true
  authorizes_jesus_speaker_attribution: false
  authorizes_speaker_boundary: false
  authorizes_discourse_boundary: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_output_change: false
source_inputs:
  - path: .ai/control/wj_marker_inventory.yaml
    used_for: "Observed WJ/red-letter marker coverage and known WJ review-case status."
  - path: eval/chunking_gold/review_packets/john3_wj_speaker_boundary_review.md
    used_for: "Existing pending John 3 speaker-boundary packet and first exact target selection."
  - path: eval/chunking_gold/review_packets/matt5_7_wj_discourse_review.md
    used_for: "Existing pending long-discourse contrast case."
  - path: eval/chunking_gold/review_packets/john7_53_8_11_textual_variant_review.md
    used_for: "Variant-sensitive WJ caution case."
  - path: eval/chunking_gold/review_packets/review_packet_index.json
    used_for: "Current WJ and speaker-boundary packet state."
policy_rules:
  - rule_id: WJ-SPK-001
    title: WJ marker evidence is never speaker authority by itself
    rule: "A WJ/red-letter token run may be cited as edition/source evidence, but cannot by itself decide whether Jesus, a narrator, a quotation, or another speaker controls a word, verse, discourse, or boundary."
    non_authorizations: [speaker_attribution, speaker_boundary, discourse_boundary, chunk_boundary]
  - rule_id: WJ-SPK-002
    title: Speaker and discourse decisions require reviewed scope
    rule: "Any speaker-boundary or discourse-boundary decision must name an exact passage span, competing boundary alternatives, evidence considered, and owner-reviewed conclusion before it can become reviewed gold or behavior."
    non_authorizations: [implicit_scope, unreviewed_speaker_gold, route_behavior]
  - rule_id: WJ-SPK-003
    title: Split WJ coverage must remain visible
    rule: "When WJ token runs are split inside a review passage, preserve the split evidence rather than collapsing it into a single uninterrupted Jesus-speech or discourse span."
    non_authorizations: [smoothed_speaker_span, smoothed_discourse_span]
  - rule_id: WJ-SPK-004
    title: Formatting and punctuation are evidence only
    rule: "Paragraph markers, section headings, quotation marks, punctuation, line markers, and WJ starts/stops may inform review but cannot automatically authorize speaker or chunk boundaries."
    non_authorizations: [formatting_as_authority, punctuation_as_authority]
  - rule_id: WJ-SPK-005
    title: Variant and Revelation WJ cases need their own gates
    rule: "Major textual-variant WJ cases and Revelation voice-shift WJ cases require their own variant/Revelation review gates before any WJ evidence can affect chunk behavior."
    non_authorizations: [variant_policy_bypass, revelation_voice_identity]
selected_first_review_target:
  target_id: john3_wj_speaker_boundary
  passage: John.3.1-John.3.36
  selection_status: selected_for_next_owner_review
  selected_in_task: T355
  review_packet: eval/chunking_gold/review_packets/john3_wj_speaker_boundary_review.md
  selection_rationale:
    - "An existing pending review packet already frames the WJ speaker-boundary risk."
    - "The target is smaller than John 13-17 and easier to review before algorithm work."
    - "WJ evidence in John 3 is split across observed token runs, so it tests the policy rule that red-letter evidence must not be smoothed into one speaker span."
    - "Current chunk behavior overlaps John 3 with adjacent Gospel material, making it a practical future review target without authorizing output change now."
  owner_review_needed:
    - "Whether John.3.1-John.3.36 should be a reviewed parent unit."
    - "Whether any child speaker/discourse boundaries should be approved."
    - "Whether John.3.10-John.3.21 is Jesus speech, narrator/commentary, or should remain unresolved for chunking."
    - "Whether WJ evidence remains diagnostic only or may be cited inside reviewed boundary rationale."
  implementation_allowed: false
  output_change_authorized: false
  reviewed_gold_promoted: false
candidate_target_queue:
  - target_id: matt5_7_sermon_on_mount_wj_discourse
    passage: Matt.5.1-Matt.7.29
