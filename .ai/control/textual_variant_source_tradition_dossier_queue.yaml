    primary_lane: textual_variant_source_tradition
    evidence_channels: [textual_variant_marker, source_tradition_difference, doctrinal_sensitivity, source_metadata_formatting]
    boundary_questions:
      - "How should the longer-ending question be reviewed before any Gospel ending, resurrection-appearance, baptism, signs, or commission boundary is trusted?"
      - "What evidence belongs in canonical review without changing the canonical 66 scope or importing boundary text?"
    review_options_preserved: [variant_policy_first_review, canonical_text_only_review, source_tradition_comparison_review, doctrinal_sensitivity_review, owner_textual_decision_review]
    theological_downstream_risks:
      - "Boundaries can bias resurrection appearances, baptism, signs, apostolic commission, and textual-critical authority."
      - "A chunk boundary can make the longer ending seem automatically accepted or rejected."
    assumptions_avoided:
      - "No longer-ending inclusion or exclusion policy is selected."
      - "No baptism, signs, or commission doctrine is inferred from chunk grouping."
      - "No source-tradition preference is selected."
    reviewed_gold_dependency: "Requires future review packet, owner review, exact selected spans, reviewed gold or equivalent governed evidence, non-target identity proof, graph and retrieval denial checks, route denial checks, and validators/tests before output changes."
    non_authorizations: [textual_critical_decision, canon_scope_change, source_tradition_preference, chunk_boundary, reviewed_gold, output_change, route_behavior, graph_edge, retrieval_truth, boundary_import]
    validator_or_test_plan: "Future packet must preserve longer-ending alternatives and deny automatic inclusion/exclusion authority."
    non_target_identity_plan: "Before implementation, compare all non-target Mark and monolith fallback outputs for unchanged identity."
