object_type: textual_variant_source_tradition_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T366 as non-output-changing research prep after T365 prophetic/oracle/vision dossiers."
reason_for_inclusion: "Give future textual-variant, source-tradition, canon-sensitive, graph, retrieval, review-packet, evaluator, and chunking agents a first-class dossier queue so variant notes, source-tradition differences, noncanonical references, and canon-scope edges remain visible without becoming textual-critical decisions, canon authority, boundary import, reviewed gold, graph truth, retrieval truth, or chunk-boundary authority."
schema_version: textual_variant_source_tradition_dossier_queue.v1
queue_id: t366_textual_variant_source_tradition_dossier_queue
owner: Lowell Wong
authority:
  records_textual_variant_source_tradition_dossier_queue: true
  records_textual_and_canon_boundary_risks: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_textual_critical_decision: false
  authorizes_canon_scope_change: false
  authorizes_boundary_import: false
  authorizes_source_tradition_preference: false
  authorizes_noncanonical_source_authority: false
  authorizes_doctrinal_system: false
  authorizes_speaker_attribution: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_intertext_truth: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  lanes: [textual_variant_source_tradition]
  research_mode: non_output_changing
  relation_to_t327: "Preserves the canonical 66 decision and boundary-material routing; does not import or promote excluded material."
  relation_to_t358: "Companion dossier queue for the textual_variant_source_tradition lane in the Bible-wide research triage."
  relation_to_t359: "Uses source metadata as evidence only; footnotes, alternate readings, headings, cross-references, and empty variant witnesses never become authority."
preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to encode a textual-critical decision, canon-scope change, source-tradition preference, noncanonical-source authority, or doctrinal proof-texting decision as a chunking default."
  preserved_review_options:
    - variant_policy_first_review
    - canonical_text_only_review
    - source_tradition_comparison_review
    - footnote_evidence_review
    - empty_witness_review
    - noncanonical_reference_review
    - boundary_material_route_review
    - doctrinal_sensitivity_review
    - owner_textual_decision_review
  not_selected_by_queue:
    - textual-critical preferred reading
    - canon-scope expansion or contraction
    - MT, LXX, Byzantine, Alexandrian, or TR source-tradition preference
    - longer-ending inclusion policy
    - pericope adulterae inclusion policy
    - Comma Johanneum doctrinal proof-text policy
    - Deuteronomy 32 divine-council reading
    - Jeremiah MT/LXX order preference
    - Jude noncanonical-source authority
    - Daniel or Esther additions import
evidence_channels:
  - channel_id: textual_variant_marker
    use_when: "A passage has variant notes, alternate readings, missing-verse witnesses, or edition-level textual uncertainty."
    non_authorization: "Textual variant markers are evidence only and do not authorize textual-critical decisions, canon changes, graph edges, retrieval truth, chunk boundaries, or output changes."
  - channel_id: source_tradition_difference
    use_when: "A passage is known or suspected to vary across source traditions, manuscripts, or ancient versions."
    non_authorization: "Source-tradition differences are evidence only and do not authorize a preferred source tradition, doctrinal conclusion, graph edge, retrieval truth, or chunk boundary."
  - channel_id: empty_witness_or_omission
    use_when: "The canonical witness has empty or omission-like records, omitted verses, or edition notes requiring review."
    non_authorization: "Empty witnesses and omissions are evidence only and do not authorize adding text, removing text, output changes, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: noncanonical_reference
    use_when: "A canonical passage references, quotes, alludes to, or is often compared with noncanonical or boundary material."
    non_authorization: "Noncanonical references are evidence only and do not authorize boundary import, noncanonical source authority, graph truth, retrieval truth, or chunk boundaries."
  - channel_id: canon_scope_edge
    use_when: "A source artifact, edition, or tradition raises a canon-scope edge such as additions, front matter, deuterocanonical material, or excluded texts."
    non_authorization: "Canon-scope edges are evidence only and do not authorize changing canonical 66 scope, importing boundary texts, graph edges, retrieval truth, or output changes."
  - channel_id: doctrinal_sensitivity
    use_when: "A variant or source-tradition question is tied to Trinitarian, Christological, pneumatological, baptismal, resurrection, eschatological, or canon-theology debates."
    non_authorization: "Doctrinal sensitivity is evidence only and does not authorize doctrinal systems, proof-texting, graph truth, retrieval truth, chunk boundaries, or output changes."
  - channel_id: source_metadata_formatting
    use_when: "Footnotes, alternate-reading markers, headings, paragraphing, cross-references, punctuation, or formatting make a textual decision seem obvious."
    non_authorization: "Source metadata and formatting are evidence only and do not authorize Scripture truth, textual-critical truth, intertext truth, graph edges, retrieval truth, reviewed gold, chunk boundaries, or output changes."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - primary_lane
  - evidence_channels
  - boundary_questions
  - review_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
