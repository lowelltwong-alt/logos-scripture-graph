---
object_type: test_runtime_preflight
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-22 during T386 after the full pytest suite exceeded the default 5-minute tool timeout and then completed with a longer timeout. Updated 2026-06-23 during T396 after the full suite exceeded 600000 ms and 900000 ms tool timeouts and required split-suite validation plus a longer retry window. Updated 2026-06-29 after validate_all exceeded a 240000 ms tool timeout and then passed with a 900000 ms ceiling."
reason_for_inclusion: "Give future agents deterministic runtime guidance before running long validation or pytest commands, so slow gates are run with enough timeout or split intentionally instead of failing from tool timeout."
---
schema_version: test_runtime_preflight.v1
preflight_id: repo_test_runtime_preflight
owner: Lowell Wong
authority:
  records_runtime_observations: true
  authorizes_skipping_tests: false
  authorizes_ignoring_failures: false
  authorizes_output_change: false
  authorizes_validation_bypass: false
applies_when:
  - before_running_repo_wide_validation
  - before_running_pytest
  - after_a_command_times_out
  - when_choosing_between_focused_tests_and_full_suite
runtime_profiles:
  - command_id: pytest_full_suite
    command: "python -m pytest -q"
    observed_on: "2026-06-22"
    observed_context: "T386 branch after adding Bible-wide coverage inventory tests; updated during T396 after full-suite runs exceeded 600000 ms and 900000 ms tool timeouts with no pytest result."
    observed_result: "First run timed out at the 5-minute tool timeout; rerun with 600000 ms completed in about 7 minutes 15 seconds and reported 1 failing stale-readiness-map assertion before the test was fixed. During T396, 600000 ms and 900000 ms full-suite runs timed out, so agents should run focused/split tests and retry the full suite with at least 1800000 ms before claiming completion."
    recommended_timeout_ms: 1800000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_full_suite_with_timeout_at_least_600000_ms
      - if_full_suite_times_out_again_split_by_test_file_or_domain_then_rerun_full_suite
    do_not:
      - treat_timeout_as_test_pass
      - mark_goal_complete_from_focused_tests_only
      - hide_timeout_from_handoff
  - command_id: validate_all
    command: "python scripts/validate_all.py"
    observed_on: "2026-06-29"
    observed_context: "Current branch after T396/T397/T398/T399 were present in the control plane; validate_all now runs many nested governance, readiness, dossier, source-catalog, corpus, and canonical QA gates."
    observed_result: "A run with a 240000 ms tool ceiling timed out without returning a verdict. The immediate rerun with a 900000 ms ceiling passed all validation gates in 477.5 seconds. Agents must start validate_all with at least 900000 ms so this known slow gate is not run twice."
    recommended_timeout_ms: 900000
    recommended_strategy:
      - run_after_focused_validators_when_possible
      - run_validate_all_with_timeout_at_least_900000_ms
      - capture_failures_before_running_full_pytest
    do_not:
      - shorten_timeout_below_900000_ms_on_full_canonical_data
      - treat_timeout_as_green
      - hide_timeout_from_handoff
  - command_id: pytest_full_suite_local_desktop_t398
    command: "python -m pytest -q"
    observed_on: "2026-06-23"
    observed_context: "T398 branch in Codex desktop with generated canonical data present and nested validation tests in the local test list."
    observed_result: "Full pytest timed out after a requested 900000 ms without an assertion failure, and a 25-file split batch also timed out after spawning nested pytest/validate_all helper processes. Focused changed tests passed, python scripts/validate_all.py passed separately, pytest tests --ignore=tests/test_control_plane.py passed with 587 tests in about 5 minutes 10 seconds, and pytest tests/test_control_plane.py passed alone with 4 tests in about 1 minute 57 seconds. Treat the original full-suite timeout as a runtime/tool timeout, not as a green or red assertion result."
    recommended_timeout_ms: 1200000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_python_scripts_validate_all_separately_before_full_pytest
      - when_running_local_desktop_pytest_split_by_small_domain_or_single_test_file
      - do_not_batch_tests_test_control_plane_py_validate_all_suite_with_many_other_files
      - inspect_and_stop_only_confirmed_same_worktree_orphan_python_processes_after_timeout
      - record_any_timeout_and_split_strategy_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_timeout_as_test_failure_without_assertion_output
      - hide_timeout_from_handoff
      - stop_unidentified_or_unrelated_parallel_agent_processes
  - command_id: pytest_full_suite_local_desktop_t397
    command: "python -m pytest -q"
    observed_on: "2026-06-24"
    observed_context: "T397 branch in Codex desktop after generated canonical data was locally regenerated and T397 route-isolation harness validators/tests were wired into the full suite."
    observed_result: "Full pytest completed with 608 passed in 830.68 seconds (about 13 minutes 51 seconds) when run with a 900000 ms timeout. This is close enough to 15 minutes that future local desktop agents should prefer 1200000 ms when canonical data and nested validation tests are present."
    recommended_timeout_ms: 1200000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_python_scripts_validate_all_separately_before_full_pytest
      - regenerate_ignored_canonical_data_if_data_dependent_tests_need_it
      - run_full_pytest_with_timeout_at_least_1200000_ms_on_local_desktop
      - record_actual_runtime_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_timeout_as_test_failure_without_assertion_output
      - hide_timeout_from_handoff
      - stop_unidentified_or_unrelated_parallel_agent_processes
update_policy:
  status: required
  update_required_when:
    - a_validation_or_test_command_times_out
    - a_validation_or_test_command_reliably_exceeds_default_timeout
    - a_split_strategy_is_needed_to_make_failures_actionable
    - a_new_slow_gate_is_added_to_validate_all_or_pytest
  required_fields_for_new_profile:
    - command_id
    - command
    - observed_on
    - observed_context
    - observed_result
    - recommended_timeout_ms
    - recommended_strategy
    - do_not
  handoff_requirement: "Record slow commands, chosen timeout, split strategy, and whether timeout was tool/runtime or actual test failure."
non_authorizations:
  - skip_test_due_to_runtime
  - ignore_timeout
  - treat_timeout_as_green
  - validation_bypass
  - output_change
validator: scripts/validate_test_runtime_preflight.py
