---
object_type: test_runtime_preflight
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-22 during T386 after the full pytest suite exceeded the default 5-minute tool timeout and then completed with a longer timeout. Updated 2026-06-23 during T396 after the full suite exceeded 600000 ms and 900000 ms tool timeouts and required split-suite validation plus a longer retry window. Updated 2026-06-29 after validate_all exceeded a 240000 ms tool timeout and then passed with a 900000 ms ceiling. Updated 2026-07-05 during T456 after sandboxed Windows validation hit access-denied temp/Cargo failures that passed when rerun in the correct environment. Updated 2026-07-07 during T468 after a bad whole-repo-copy pytest fixture and guarded pytest split exhausted local temp disk."
reason_for_inclusion: "Give future agents deterministic runtime guidance before running long validation or pytest commands, so slow gates are run with enough timeout, split intentionally, or routed to writable temp/Cargo locations instead of failing from tool timeout or sandbox environment noise."
---
schema_version: test_runtime_preflight.v1
preflight_id: repo_test_runtime_preflight
owner: Lowell Wong
authority:
  records_runtime_observations: true
  authorizes_skipping_tests: false
  authorizes_ignoring_failures: false
  authorizes_output_change: false
  authorizes_validation_bypass: false
applies_when:
  - before_running_repo_wide_validation
  - before_running_pytest
  - before_running_rust_backed_validators
  - after_a_command_times_out
  - after_a_command_fails_from_sandbox_or_temp_access
  - when_choosing_between_focused_tests_and_full_suite
runtime_profiles:
  - command_id: pytest_full_suite
    command: "python -m pytest -q"
    observed_on: "2026-06-22"
    observed_context: "T386 branch after adding Bible-wide coverage inventory tests; updated during T396 after full-suite runs exceeded 600000 ms and 900000 ms tool timeouts with no pytest result."
    observed_result: "First run timed out at the 5-minute tool timeout; rerun with 600000 ms completed in about 7 minutes 15 seconds and reported 1 failing stale-readiness-map assertion before the test was fixed. During T396, 600000 ms and 900000 ms full-suite runs timed out, so agents should run focused/split tests and retry the full suite with at least 1800000 ms before claiming completion."
    recommended_timeout_ms: 1800000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_full_suite_with_timeout_at_least_600000_ms
      - if_full_suite_times_out_again_split_by_test_file_or_domain_then_rerun_full_suite
    do_not:
      - treat_timeout_as_test_pass
      - mark_goal_complete_from_focused_tests_only
      - hide_timeout_from_handoff
  - command_id: validate_all
    command: "python scripts/validate_all.py"
    observed_on: "2026-06-29"
    observed_context: "Current branch after T396/T397/T398/T399 were present in the control plane; validate_all now runs many nested governance, readiness, dossier, source-catalog, corpus, and canonical QA gates."
    observed_result: "A run with a 240000 ms tool ceiling timed out without returning a verdict. The immediate rerun with a 900000 ms ceiling passed all validation gates in 477.5 seconds. Agents must start validate_all with at least 900000 ms so this known slow gate is not run twice."
    recommended_timeout_ms: 900000
    recommended_strategy:
      - run_after_focused_validators_when_possible
      - run_validate_all_with_timeout_at_least_900000_ms
      - capture_failures_before_running_full_pytest
    do_not:
      - shorten_timeout_below_900000_ms_on_full_canonical_data
      - treat_timeout_as_green
      - hide_timeout_from_handoff
  - command_id: pytest_full_suite_local_desktop_t398
    command: "python -m pytest -q"
    observed_on: "2026-06-23"
    observed_context: "T398 branch in Codex desktop with generated canonical data present and nested validation tests in the local test list."
    observed_result: "Full pytest timed out after a requested 900000 ms without an assertion failure, and a 25-file split batch also timed out after spawning nested pytest/validate_all helper processes. Focused changed tests passed, python scripts/validate_all.py passed separately, pytest tests --ignore=tests/test_control_plane.py passed with 587 tests in about 5 minutes 10 seconds, and pytest tests/test_control_plane.py passed alone with 4 tests in about 1 minute 57 seconds. Treat the original full-suite timeout as a runtime/tool timeout, not as a green or red assertion result."
    recommended_timeout_ms: 1200000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_python_scripts_validate_all_separately_before_full_pytest
      - when_running_local_desktop_pytest_split_by_small_domain_or_single_test_file
      - do_not_batch_tests_test_control_plane_py_validate_all_suite_with_many_other_files
      - inspect_and_stop_only_confirmed_same_worktree_orphan_python_processes_after_timeout
      - record_any_timeout_and_split_strategy_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_timeout_as_test_failure_without_assertion_output
      - hide_timeout_from_handoff
      - stop_unidentified_or_unrelated_parallel_agent_processes
  - command_id: pytest_full_suite_local_desktop_t397
    command: "python -m pytest -q"
    observed_on: "2026-06-24"
    observed_context: "T397 branch in Codex desktop after generated canonical data was locally regenerated and T397 route-isolation harness validators/tests were wired into the full suite."
    observed_result: "Full pytest completed with 608 passed in 830.68 seconds (about 13 minutes 51 seconds) when run with a 900000 ms timeout. This is close enough to 15 minutes that future local desktop agents should prefer 1200000 ms when canonical data and nested validation tests are present."
    recommended_timeout_ms: 1200000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_python_scripts_validate_all_separately_before_full_pytest
      - regenerate_ignored_canonical_data_if_data_dependent_tests_need_it
      - run_full_pytest_with_timeout_at_least_1200000_ms_on_local_desktop
      - record_actual_runtime_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_timeout_as_test_failure_without_assertion_output
      - hide_timeout_from_handoff
      - stop_unidentified_or_unrelated_parallel_agent_processes
  - command_id: pytest_full_suite_local_desktop_t411
    command: "python -m pytest -q"
    observed_on: "2026-06-30"
    observed_context: "T411 Cursor readiness branch after validate_all passed and focused T411/T410/live-safety tests passed, with generated canonical data present and many nested validation tests in the local test list."
    observed_result: "Full pytest timed out after a requested 1800000 ms without assertion output or a pytest verdict. A follow-up `python -m pytest tests --ignore=tests/test_control_plane.py -q` timed out after 1200000 ms, and `python -m pytest tests/test_control_plane.py -q` timed out after 300000 ms because the nested `test_validate_all_suite` was still running `validate_all.py`. Direct `python scripts/validate_all.py` passed separately in 349.4 seconds. `python scripts/run_pytest_guarded.py --timeout-seconds 180 --collect-timeout-seconds 120 --max-segment-size 20 tests` collected 666 tests and isolated only `tests/test_control_plane.py::test_validate_all_suite` as timeout-prone; `python scripts/run_pytest_guarded.py --timeout-seconds 180 --collect-timeout-seconds 120 --max-segment-size 20 -- tests -k \"not test_validate_all_suite\"` then passed the remaining 665 collected tests. Treat this as a runtime/tool timeout, not a green or red assertion result."
    recommended_timeout_ms: 2400000
    recommended_strategy:
      - run_focused_changed_tests_first
      - run_python_scripts_validate_all_separately_before_full_pytest
      - if_full_pytest_times_out_at_1800000_ms_split_by_domain_or_single_file
      - run_direct_validate_all_then_guarded_pytest_excluding_test_validate_all_suite_if_control_plane_nested_validate_all_times_out
      - run_pytest_tests_ignore_test_control_plane_py_then_test_control_plane_py_alone_when_not_under_process_contention
      - record_timeout_and_split_strategy_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_timeout_as_test_failure_without_assertion_output
      - hide_timeout_from_handoff
      - stop_unidentified_or_unrelated_parallel_agent_processes
  - command_id: pytest_guarded_local_desktop_t468
    command: "python scripts/run_pytest_guarded.py --timeout-seconds 180 --collect-timeout-seconds 120 --max-segment-size 20 -- tests -k \"not test_validate_all_suite\""
    observed_on: "2026-07-07"
    observed_context: "T468 branch after adding W2-2 mirror freshness tests. An initial focused fixture copied the whole Scripture repo into pytest temp, including generated canonical data and Rust target artifacts, and filled local temp disk. After the fixture was fixed to use a tiny synthetic repo, direct validate_all passed, but a guarded broad pytest split failed from Errno 28 no space left on device because the temp root had already been exhausted."
    observed_result: "Treat Errno 28 from pytest tmp_path/cache or guarded-pytest state writes as local temp/disk exhaustion unless assertion output proves a code failure. Clear only verified pytest temp roots under the OS temp directory, avoid whole-repo copy fixtures, prefer synthetic minimal fixtures for validator tests, then rerun focused changed tests plus validate_all before relying on CI for the fresh full-suite run."
    recommended_timeout_ms: 1800000
    recommended_strategy:
      - run_focused_changed_tests_first
      - avoid_copying_the_entire_scripture_repo_into_tmp_path
      - use_synthetic_minimal_fixtures_for_validator_mutants
      - clear_verified_pytest_temp_roots_after_err_no_28_disk_full
      - run_python_scripts_validate_all_separately_before_guarded_pytest
      - rerun_guarded_pytest_only_after_temp_space_is_recovered
      - record_temp_disk_exhaustion_in_handoff
    do_not:
      - treat_timeout_as_test_pass
      - treat_err_no_28_as_code_failure_without_reproduction_after_cleanup
      - hide_timeout_from_handoff
      - delete_unknown_temp_or_target_dirs_without_path_verification
      - commit_temp_outputs
environment_routing:
  status: active
  observed_on: "2026-07-05"
  observed_context: "T451/T456 Codex desktop Windows worktrees while running sandboxed validators, pytest, and Rust-backed checks after the T424 Rust validation layer landed."
  observed_result: "Sandboxed runs can fail from WinError 5 access denied around pytest temp/cache paths, Python TemporaryDirectory outputs under AppData Local Temp, or Cargo target/build locks. The same gate may pass when rerun with a repo-local writable temp route or unsandboxed approval, so agents must classify this as environment noise unless assertion output or validator diagnostics prove a code failure."
  required_when:
    - running_pytest_under_codex_sandbox
    - running_validate_all_when_nested_tests_create_temp_outputs
    - running_cargo_or_rust_backed_validators
    - after_winerror_5_or_access_denied_from_temp_or_target_paths
  recommended_environment:
    - "Set pytest --basetemp or TMP/TEMP to a repo-local writable scratch directory when sandboxed."
    - "Set CARGO_TARGET_DIR to a repo-local or task-local ignored writable directory before Rust validators or cargo test."
    - "Keep generated temp, pytest cache, Cargo target, and observation build outputs ignored and out of commits."
    - "If sandbox still denies temp/Cargo writes, rerun the same gate unsandboxed with approval and record sandbox_access_denied as environment noise, not as green."
  failure_classification:
    - "WinError 5, permission denied, temp directory denial, Cargo lock denial, or target directory denial is sandbox_access_denied until reproduced outside the sandbox."
    - "Assertion failures, schema diagnostics, explicit validator messages, and deterministic nonzero exits after writable routing are code_or_data_failures."
    - "Timeouts without a verdict remain runtime/tool timeouts and must not be treated as green."
  do_not:
    - treat_sandbox_access_denied_as_green
    - treat_sandbox_access_denied_as_code_failure_without_reproduction
    - commit_temp_outputs
    - commit_cargo_target_outputs
    - delete_unknown_temp_or_target_dirs_without_path_verification
  dad_lesson: ".digital-asset/lessons/t456_runtime_environment_preflight.yaml"
update_policy:
  status: required
  update_required_when:
    - a_validation_or_test_command_times_out
    - a_validation_or_test_command_reliably_exceeds_default_timeout
    - a_split_strategy_is_needed_to_make_failures_actionable
    - a_new_slow_gate_is_added_to_validate_all_or_pytest
    - sandbox_temp_or_cargo_access_denied_noise_is_observed
    - repo_local_temp_or_cargo_target_routing_is_required
  required_fields_for_new_profile:
    - command_id
    - command
    - observed_on
    - observed_context
    - observed_result
    - recommended_timeout_ms
    - recommended_strategy
    - do_not
  handoff_requirement: "Record slow commands, chosen timeout, split strategy, and whether timeout was tool/runtime or actual test failure."
non_authorizations:
  - skip_test_due_to_runtime
  - ignore_timeout
  - treat_timeout_as_green
  - treat_sandbox_access_denied_as_green
  - commit_temp_outputs
  - commit_cargo_target_outputs
  - validation_bypass
  - output_change
validator: scripts/validate_test_runtime_preflight.py
