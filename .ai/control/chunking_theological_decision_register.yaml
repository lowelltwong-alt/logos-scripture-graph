  - decision_id: CD-009
    title: Psalm candidate skill remains unpromoted
    classification: non_authorizing_review
    task_ids: [T340, T340B, T340C, T340D]
    owner_decision_ref: .ai/control/t340_psalm_candidate_promotion_decision.yaml
    pr_refs: [PR-50, PR-52, PR-53, PR-54]
    affected_scope:
      books: [Ps]
      passages: [Ps.89.1-Ps.89.52]
      routes: [psalm_whole_then_stanza_candidate]
      surfaces: [registry/chunking, pipelines/chunking/skills/candidate/psalm-whole-then-stanza-v1]
    decision: "Retain the Psalm 89 route-isolated behavior but do not promote the Psalm candidate skill to approved, active, or preferred."
    downstream_risk: "A single reviewed output-changing case could be overread as enough evidence for broad Psalm default behavior."
    theological_assumptions_avoided:
      - "One Psalm case does not authorize a broad Psalm hermeneutic."
      - "Skill lifecycle status remains separate from reviewed target behavior."
    reviewed_gold_dependency: "Additional reviewed Psalm evidence is required before reconsidering lifecycle promotion."
    non_authorizations:
      - approved_skill_registry_entry
      - active_skill_route
      - preferred_skill_default
      - broad_psalm_optimization
