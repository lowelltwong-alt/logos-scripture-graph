      - "No single DSS witness proves global preservation, prophecy claims, or a preferred reading."
      - "No date, discovery event, catalog count, coverage summary, or material claim becomes apologetic authority."
      - "No non-biblical DSS/Qumran, commentary, patristic citation, creed wording, theologian writing, or doctrine lineage is imported into Scripture Graph."
      - "No graph, retrieval, vector, chunking, reviewed-gold, route behavior, canon-scope, source-tradition, or textual-critical decision changes are authorized."
    reviewed_gold_dependency: "None. T396 is source-catalog metadata-row population only. Future DSS expansion, NT papyri/codices rows, variants, copy-abundance method profiles, source-language graphing, Boundary Literature reception joins, Doctrine Genealogy lineage, graph/retrieval/vector work, chunk-output work, or apologetic reports require separate scoped tasks, validators/tests, source review, and owner authorization where authority could change."
