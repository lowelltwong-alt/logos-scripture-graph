  - decision_id: CD-012
    title: Chunking theological decision register is mandatory and non-authorizing
    classification: non_authorizing_review
    task_ids: [T349]
    owner_decision_ref: .ai/control/chunking_theological_decision_register.yaml
    pr_refs: []
    affected_scope:
      books: [canonical_66]
      passages: [future_chunking_decisions]
      routes: [all_chunking_routes]
      surfaces: [.ai/control/chunking_theological_decision_register.yaml, scripts/validate_chunking_theological_decision_register.py]
    decision: "Future chunking, evaluator, gold, route, default-behavior, generated chunk, or relevant roadmap changes must update this register when the changed-path gate applies."
    downstream_risk: "A future agent could make a seemingly technical chunking change without recording its theological or governance implications."
    theological_assumptions_avoided:
      - "Technical chunking changes are not presumed theologically neutral."
      - "The register records decisions without granting implementation authority."
    reviewed_gold_dependency: "Output-changing work still requires executable reviewed gold and explicit owner authorization for the exact target."
    non_authorizations:
      - chunk_output_change
      - reviewed_gold_promotion
      - skill_lifecycle_promotion
      - boundary_import
    validators:
