  - decision_id: CD-011
    title: Vector and graph-edge outputs are never truth
    classification: theological_risk
    task_ids: [T348]
    owner_decision_ref: docs/architecture/SCRIPTURE_VECTORIZATION_AND_EDGE_DURABILITY_CONTRACT.md
    pr_refs: [PR-55]
    affected_scope:
      books: [canonical_66]
      passages: [future_vector_indexes, future_graph_edges]
      routes: [future_retrieval_profiles, future_graph_edge_generation]
      surfaces: [config/retrieval, schemas/*edge*, scripts/validate_vectorization_plan.py]
    decision: "Vectors and graph edges are retrieval or relationship artifacts, never Scripture truth; source text, stable IDs, span maps, provenance, and reviewed decisions remain authoritative."
    downstream_risk: "Model-inferred similarity or edge generation could be mistaken for doctrine, canon, or theological assertion."
    theological_assumptions_avoided:
      - "Embedding neighborhoods do not become doctrine."
      - "Model-inferred edges do not become reviewed semantic claims."
      - "Retrieval profiles do not tune canonical Scripture from non-Bible corpora."
    reviewed_gold_dependency: "Embedding/index/edge work remains blocked behind MASTER_CONTEXT substrate gaps plus future owner decision."
    non_authorizations:
      - embedding_runs
      - vector_index_builds
      - graph_edge_generation
      - default_retrieval_profile_promotion
      - boundary_material_in_default_scripture_retrieval
