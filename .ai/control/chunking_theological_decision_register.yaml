    decision: "English capitalization of divine names, titles, pronouns, and identity terms may be preserved and surfaced as source/edition evidence, but it does not by itself authorize divine identity, Trinitarian relation, Christological claim, pneumatological claim, speaker attribution, lexical truth, graph edges, chunk boundaries, retrieval truth, or output changes."
    downstream_risk: "Capitalization conventions such as God/god, LORD/Lord/lord, Spirit/spirit, Father/father, Son/son, Word/word, Christ/christ, Holy Spirit/holy spirit, or divine pronoun capitalization could silently encode theological conclusions if treated as graph or chunk authority."
    theological_assumptions_avoided:
      - "No divine identity edge is inferred from capitalization alone."
      - "No Trinitarian person relation is inferred from capitalization alone."
      - "No Christology is inferred from Word/word or Son/son capitalization alone."
      - "No pneumatology is inferred from Spirit/spirit or Holy Spirit/holy spirit capitalization alone."
      - "No Father/father or LORD/Lord/lord relationship is inferred without reviewed evidence and owner decision."
      - "No edition-specific divine-pronoun convention becomes canonical Scripture truth."
    reviewed_gold_dependency: "Any graph, retrieval, or chunking use requires an inventory of observed source/canonical forms, source provenance, reviewed policy or packets, executable tests, and a later owner decision for exact scope."
    non_authorizations:
      - capitalization_driven_divine_identity
      - capitalization_driven_trinitarian_relation
      - capitalization_driven_christology
      - capitalization_driven_pneumatology
      - capitalization_driven_speaker_attribution
      - capitalization_driven_graph_edge
      - capitalization_driven_chunk_boundary
      - capitalization_driven_retrieval_truth
      - translation_convention_as_theological_truth
