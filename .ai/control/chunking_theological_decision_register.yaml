---
object_type: chunking_theological_decision_register
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-17 by owner request after T348 merged, to make chunking decisions with possible theological downstream effects first-class and deterministic."
reason_for_inclusion: "Give future maintainers a machine-readable ledger of chunking, evaluator, gold, route, and default-behavior decisions before additional Bible chunking algorithm work resumes."
---
schema_version: chunking_theological_decision_register.v1
register_id: scripture_chunking_theological_decision_register
owner: Lowell Wong
default_orthodoxy_boundary: nicene_chalcedonian_core
register_authority:
  records_decisions: true
  authorizes_chunk_output_change: false
  authorizes_reviewed_gold_promotion: false
  authorizes_skill_lifecycle_promotion: false
  authorizes_boundary_import: false
update_policy:
  full_backfill_required_before_new_algorithm_work: true
  changed_path_gate_enabled: true
  register_update_required_when_paths_change:
    - pipelines/chunking/
    - config/chunking/
    - registry/chunking/
    - eval/chunking_gold/
    - data/derived/chunks/
    - docs/roadmap/
  validator: scripts/validate_chunking_theological_decision_register.py
allowed_classifications:
  - text_neutral
  - theological_risk
  - interpretive_boundary
  - canon_scope
  - non_authorizing_review
decisions:
  - decision_id: CD-001
    title: Chunking policy and role separation are derived, not source truth
    classification: text_neutral
    task_ids: [T001, T302, T303, T304, T305]
    owner_decision_ref: ROADMAP_STATE.yaml#T001
    pr_refs: []
    affected_scope:
      books: [canonical_66]
      passages: []
      routes: [monolith_baseline]
      surfaces: [docs/chunking, config/chunking, scripts/validate_all.py]
    decision: "Chunks are derived retrieval artifacts; source text, stable IDs, provenance, and reviewed decisions outrank generated chunk boundaries."
    downstream_risk: "Generated boundaries could be mistaken for theological or canonical truth."
    theological_assumptions_avoided:
      - "No chunk boundary is treated as doctrine."
      - "No generated chunk label becomes canonical interpretation."
    reviewed_gold_dependency: none
    non_authorizations:
      - raw_or_canonical_text_mutation
      - doctrine_claim_from_chunk_boundary
      - output_improvement_claim_without_same_baseline
    validators:
      - scripts/validate_all.py
      - scripts/validate_control_plane.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-002
    title: Raw USFM markers are evidence, not automatic boundary authority
    classification: interpretive_boundary
    task_ids: [T201, T316c]
    owner_decision_ref: config/ingest/usfm_marker_coverage.yaml
    pr_refs: []
    affected_scope:
      books: [canonical_66]
      passages: []
      routes: [marker_sensitive_routes]
      surfaces: [config/ingest/usfm_marker_coverage.yaml, docs/patches/web_usfm_patch_2a]
    decision: "USFM headings, paragraphs, poetry lines, superscriptions, Selah, cross-references, footnotes, and words-of-Jesus markers may inform review but do not automatically authorize speaker, boundary, doctrine, or intertextual claims."
    downstream_risk: "Edition or translation formatting could be elevated into theological structure."
    theological_assumptions_avoided:
      - "Words-of-Jesus markers do not by themselves resolve speaker scope."
      - "Selah and headings do not by themselves authorize Psalm splits."
      - "Editorial cross-references do not become theological graph edges."
    reviewed_gold_dependency: "Executable reviewed gold is required before output-changing marker-sensitive behavior."
    non_authorizations:
      - automatic_wj_speaker_boundary
      - automatic_selah_split
      - automatic_heading_split
      - editorial_crossref_as_theological_edge
    validators:
      - scripts/validate_raw_coverage.py
      - scripts/scan_raw_sources.py --check
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-003
    title: Form-routed chunking skills must stay isolated
    classification: interpretive_boundary
    task_ids: [T310, T311, T315]
    owner_decision_ref: docs/architecture/ADR-0011*
    pr_refs: []
    affected_scope:
      books: [canonical_66]
      passages: []
      routes: [form_router, skill_registry, route_ledger]
      surfaces: [pipelines/chunking, config/chunking, registry/chunking]
    decision: "Chunking may evolve through form-routed, lifecycle-governed skills, but route facts stay isolated and candidate skills do not become default behavior without human approval."
    downstream_risk: "A local form heuristic could leak globally and encode an unintended theological reading across unrelated books."
    theological_assumptions_avoided:
      - "Psalm rules do not become prophecy, Gospel, epistle, or Revelation rules."
      - "Revelation/apocalypse rules do not become global chronology or symbolism rules."
      - "Evaluator movement does not itself authorize behavior."
    reviewed_gold_dependency: "Candidate-to-active and active-to-preferred transitions require reviewed gold plus human review."
    non_authorizations:
      - automatic_skill_promotion
      - global_heuristic_leakage
      - evaluator_only_improvement_claim
    validators:
      - scripts/validate_chunking_gold.py
      - scripts/validate_all.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-004
    title: Canonical 66-book scope controls Scripture chunking
    classification: canon_scope
    task_ids: [T327A, T327A1, T327A2, T327B, T327B1, T327C, T327D, T327E, T327F]
    owner_decision_ref: config/canon/canonical_66_books.yaml
    pr_refs: [PR-26, PR-27, PR-28, PR-29, PR-30, PR-31, PR-32]
    affected_scope:
      books: [canonical_66]
      passages: [all_canonical_passages]
      routes: [canonical_ingest, canonical_chunking, canonical_eval]
      surfaces: [config/canon, pipelines/ingest, scripts/validate_canonical_66_scope.py, data/canonical, data/derived/chunks]
    decision: "Canonical Scripture outputs, chunking, evaluator surfaces, and default retrieval must be limited to the owner-approved 66-book canon."
    downstream_risk: "Noncanonical, deuterocanonical, front-matter, or glossary material could contaminate canonical Scripture outputs and downstream theology."
    theological_assumptions_avoided:
      - "Boundary or apocryphal texts do not become equal Scripture authority."
      - "Raw archive breadth does not define canonical output scope."
      - "Front matter and glossary records do not become Scripture chunks."
    reviewed_gold_dependency: "Canonical-66 corpus QA and validator gates must pass before chunking baselines are trusted."
    non_authorizations:
      - boundary_import
      - non_66_default_scripture_retrieval
      - canonical_claim_from_front_matter
      - t327g
    validators:
      - scripts/validate_canonical_66_scope.py
      - scripts/qa_canonical_corpus.py
      - scripts/validate_all.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-005
    title: Post-T327 baseline reset is corpus correction, not theological improvement
    classification: text_neutral
    task_ids: [T331, T332, T336, T336B]
    owner_decision_ref: docs/roadmap/T336_OPTIMIZED_WHOLE_BIBLE_CHUNKING_ROADMAP.md
    pr_refs: [PR-35, PR-36, PR-43, PR-44]
    affected_scope:
      books: [canonical_66]
      passages: [all_canonical_passages]
      routes: [canonical_chunk_baseline, roadmap_sequence]
      surfaces: [docs/roadmap, ROADMAP_STATE.yaml, eval/chunking_gold]
    decision: "The post-T327 chunking roadmap prioritizes a governed canonical Bible chunker; baseline reset and roadmap sequencing do not themselves claim theological or quality improvement."
    downstream_risk: "A cleanup or roadmap note could be overread as authorization for output-changing chunking behavior."
    theological_assumptions_avoided:
      - "Bible-first priority does not authorize noncanonical tuning."
      - "Planning order does not approve a route or boundary."
    reviewed_gold_dependency: "Every output-changing lane still needs executable reviewed gold and same-baseline evaluation."
    non_authorizations:
      - chunk_regeneration
      - evaluator_formula_change
      - leaderboard_update
      - master_chunker_global_objective
    validators:
      - scripts/validate_chunking_theological_decision_register.py
      - scripts/validate_all.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-006
    title: Psalm 78 parent-child structural split is reviewed gold
    classification: interpretive_boundary
    task_ids: [T310, T315, T317, T319]
    owner_decision_ref: eval/chunking_gold/per_form/psalms_manifest.json
    pr_refs: []
    affected_scope:
      books: [Ps]
      passages: [Ps.78.1-Ps.78.72]
      routes: [psalm_poetry]
      surfaces: [eval/chunking_gold/per_form/psalms_manifest.json]
    decision: "Psalm 78 preserves the whole psalm as parent literary unit while recognizing reviewed child chunks Ps.78.1-69, Ps.78.70-71, and Ps.78.72."
    downstream_risk: "The child split could be misread as bad fragmentation or as a global long-Psalm rule."
    theological_assumptions_avoided:
      - "A reviewed structural split does not deny whole-psalm unity."
      - "Psalm 78 does not authorize global poetry or stanza behavior."
    reviewed_gold_dependency: "Psalm gold manifest must keep the parent and exact child spans together."
    non_authorizations:
      - global_long_psalm_rule
      - psalm_78_as_broad_psalm_optimizer
      - evaluator_penalty_for_reviewed_structural_split
    validators:
      - scripts/validate_chunking_gold.py
      - tests/test_chunker_gold.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-007
    title: Psalm candidate skill guardrail is behavior-preserving until exact owner authorization
    classification: non_authorizing_review
    task_ids: [T333, T334, T335, T337]
    owner_decision_ref: docs/roadmap/T337_SELECT_ONE_PSALM_BEHAVIOR_CHANGE.md
    pr_refs: [PR-39, PR-40, PR-41, PR-45]
    affected_scope:
      books: [Ps]
      passages: [Ps.23, Ps.78, Ps.89, Ps.105, Ps.106, Ps.119, Ps.136]
      routes: [psalm_whole_then_stanza_candidate]
      surfaces: [pipelines/chunking/skills/candidate/psalm-whole-then-stanza-v1, eval/chunking_gold/per_form/psalms_manifest.json]
    decision: "The Psalm candidate skill may fail closed against reviewed Psalm evidence, but pending packets and guardrails do not authorize output changes."
    downstream_risk: "Candidate metadata could be overread as broad Psalm optimization."
    theological_assumptions_avoided:
      - "Pending Psalm packets remain pending."
      - "Reviewed current behavior is not a new behavior authorization."
    reviewed_gold_dependency: "Output-changing Psalm work requires exact owner-reviewed gold."
    non_authorizations:
      - psalm_136_change
      - broad_psalm_optimization
      - global_poetry_rule
    validators:
      - tests/test_psalm_candidate_skill.py
      - scripts/validate_chunking_gold.py
    lifecycle_status: active
    supersedes: []
    deprecated_by: null
  - decision_id: CD-008
    title: Psalm 89 Option C is the only authorized Psalm output change
    classification: interpretive_boundary
    task_ids: [T337A, T337B, T338, T339]
    owner_decision_ref: docs/roadmap/T337B_PS89_OWNER_DECISION_OPTION_C.md
    pr_refs: [PR-46, PR-47, PR-48, PR-49]
    affected_scope:
      books: [Ps]
      passages: [Ps.89.1-Ps.89.52]
      routes: [psalm_whole_then_stanza_candidate]
      surfaces: [pipelines/chunking/skills/candidate/psalm-whole-then-stanza-v1, eval/chunking_gold/per_form/psalms_manifest.json]
    decision: "Owner-approved Psalm 89 Option C keeps Ps.89.49-Ps.89.52 as one final child with Ps.89.52 labeled as Book III doxology scope note; no orphan Ps.89.52 split."
    downstream_risk: "The decision could imply a doxology, Selah, lament, or long-Psalm rule outside Psalm 89."
    theological_assumptions_avoided:
      - "Book III doxology recognition does not become a global doxology split rule."
      - "Psalm 89 structure does not become broad Psalm theology."
    reviewed_gold_dependency: "Exact Psalm 89 owner decision and same-baseline evidence from T338/T339."
    non_authorizations:
      - global_doxology_rule
      - global_selah_rule
      - psalm_136_change
      - whole_bible_improvement_claim
    validators:
