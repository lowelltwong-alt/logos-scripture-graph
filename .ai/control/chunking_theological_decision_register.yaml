    title: Revelation hard-book atlas is non-authorizing review only
    classification: non_authorizing_review
    task_ids: [T341]
    owner_decision_ref: docs/roadmap/T341_REVELATION_HARD_BOOK_ATLAS.md
    pr_refs: [PR-51]
    affected_scope:
      books: [Rev]
      passages: [Rev.1.1-Rev.22.21]
      routes: [monolith_fallback, future_revelation_review]
      surfaces: [docs/roadmap/T341_REVELATION_HARD_BOOK_ATLAS.md, docs/roadmap/T341_REVELATION_OBSERVED_BEHAVIOR_AUDIT.md]
    decision: "Revelation structure candidates and observed chunk behavior are planning evidence only; no Revelation route, reviewed gold, output change, or apocalypse rule is authorized."
    downstream_risk: "Revelation labels could encode chronology, recapitulation, Babylon identity, millennium interpretation, symbolic identity, or boundary-apocalyptic authority."
    theological_assumptions_avoided:
