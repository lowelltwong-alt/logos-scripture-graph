    downstream_risk: "A famous early biblical scroll can be overused as apologetic proof, preferred-reading authority, source-tradition priority, graph/retrieval/vector truth, or permission to import text and images. Future tasks must keep witness metadata separated from Scripture text, preserve candidate and blocked claims, and add later witnesses only with scoped official row-level source review."
