  must_stop_for_owner_decision_before:
    - exact_epistle_target_selection_for_promotion_or_implementation
    - reviewed_gold_promotion
    - child_span_selection_or_child_span_reviewed_gold
    - chunk_output_change
    - route_behavior_change
    - evaluator_behavior_or_formula_change
    - graph_edge_generation
    - retrieval_truth_or_vector_output
    - boundary_import
    - whole_bible_output_pass
    - preferred_reading_or_source_tradition_preference
    - canon_scope_change
    - denominational_systematic_theology_as_chunk_authority
required_policy_fields:
  contextual_reading_policy:
    path: .ai/control/contextual_reading_policy.yaml
    required_layers:
      - immediate_discourse_context
      - paragraph_section_context
      - chapter_book_context
      - canonical_context
      - original_language_context_if_used
      - historical_cultural_context_if_relevant
      - source_metadata_context_if_cited
  source_metadata_evidence_only:
    path: .ai/control/source_metadata_research_atlas.yaml
    rule: "Internal cross-references, Strong's-style numbers, headings, footnotes, WJ/red-letter markers, capitalization, and formatting are evidence only and do not authorize truth, graph, retrieval, reviewed gold, boundaries, or output."
  original_language_phrase_context:
    path: .ai/control/original_language_phrase_context_policy.yaml
    required_when: "Any Greek/Hebrew word, lemma, Strong's-style tag, morphology, grammar label, phrase, rarity, article, plural-form, or LXX/NT quotation observation is used."
  orthodox_hermeneutic_firewall:
    path: .ai/control/orthodox_hermeneutic_firewall_docket.yaml
    requirement: "Preserve Nicene/Chalcedonian orthodox Christianity and canonical Scripture authority while refusing anti-supernatural, anti-canonical, heterodox, liberal-critical, or one-denomination systematic defaults."
  textual_critical_case_policy:
    path: .ai/control/textual_critical_case_policy.yaml
    requirement: "If any target option is variant-sensitive, later promotion requires exact variants, dependency/non-dependency, owner confirmation, decision-register update, and validators/tests."
target_options_to_research_before_owner_selection:
  - option_id: T384-A
    passage: Eph.1.3-Eph.1.14
    label: ephesians_blessing_in_christ
    why_serious: "Compact, high-value doxological argument with election, adoption, redemption, union-with-Christ, and Trinitarian phrasing pressure."
    repercussions:
      - "Good next candidate if the owner wants a compact epistle parent target."
      - "High risk of smuggling one election/predestination system if boundaries or labels outrun the text."
      - "Requires original-language phrase/context review because the passage is a long Greek sentence and has dense repeated 'in Christ' language."
    required_research:
      - contextual_reading
      - original_language_phrase_context_if_used
      - orthodox_firewall
      - source_metadata_evidence_only
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
  - option_id: T384-B
    passage: Rom.9.1-Rom.11.36
    label: romans_israel_election_mercy_argument
    why_serious: "Large canonical argument touching Israel, election, mercy, hardening, Gentiles, covenant promises, and doxology."
    repercussions:
      - "Very high theological value and very high downstream risk."
      - "Likely too broad for the next exact implementation target unless split only after reviewed owner options."
      - "Requires extra care not to encode replacement theology, dispensational systems, covenant systems, or one school of election as chunk authority."
    required_research:
      - contextual_reading
      - canonical_context
      - original_language_phrase_context_if_used
      - orthodox_firewall
      - textual_variant_or_source_tradition_scan
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
  - option_id: T384-C
    passage: Heb.7.1-Heb.10.39
    label: hebrews_priesthood_covenant_sacrifice_argument
    why_serious: "Major argument on priesthood, covenant, sacrifice, law, promise, and perseverance with deep Old Testament intertext dependence."
    repercussions:
      - "Strong candidate for later epistle/canonical-context review."
      - "Large enough that a parent-only target may be too coarse without careful research."
      - "High risk of importing covenant-system or sacramental assumptions if labels become authority."
    required_research:
      - contextual_reading
      - canonical_context
      - original_language_phrase_context_if_used
      - orthodox_firewall
      - source_metadata_evidence_only
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
  - option_id: T384-D
    passage: Gal.2.15-Gal.3.29
    label: galatians_justification_law_promise_argument
    why_serious: "Central epistle argument on justification, faith, law, promise, Abraham, curse, and union with Christ."
    repercussions:
      - "Compact enough to research before a later owner target decision."
      - "High risk of forcing one Protestant/Catholic/New-Perspective/systematic frame into chunk labels."
      - "Requires careful canonical and phrase/context review so law/gospel labels remain evidence, not authority."
    required_research:
      - contextual_reading
      - canonical_context
      - original_language_phrase_context_if_used
      - orthodox_firewall
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
  - option_id: T384-E
    passage: Jas.2.14-Jas.2.26
    label: james_faith_works_argument
    why_serious: "Compact pressure passage for faith, works, justification language, Abraham/Rahab examples, and canonical relation to Paul."
    repercussions:
      - "Useful compact review target if the owner wants a smaller high-risk case."
      - "Can be mishandled by harmonizing away James or by setting James against Paul without canonical care."
      - "Requires contextual and canonical review before any parent or child boundary is proposed."
    required_research:
      - contextual_reading
      - canonical_context
      - orthodox_firewall
      - source_metadata_evidence_only
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
  - option_id: T384-F
    passage: 1Cor.11.17-1Cor.14.40
    label: first_corinthians_gathering_table_gifts_order_argument
    why_serious: "Adjacent 1 Corinthians material touching Lord's Supper, body, gifts, love, prophecy, tongues, order, and worship practice."
    repercussions:
      - "Natural continuation after the 1Cor.8-10 pilot, but risks overfitting to one book or one church-practice system."
      - "High risk of sacramental, charismatic/cessationist, ecclesial, and gender/order assumptions entering chunk labels."
      - "Should remain research-only until a later exact owner target decision."
    required_research:
      - contextual_reading
      - source_metadata_evidence_only
      - original_language_phrase_context_if_used
      - orthodox_firewall
      - all_good_options_and_repercussions
    exact_target_selected: false
    promotion_authorized: false
