source_review:
  official_anchors:
    - source_id: israel_museum_great_isaiah_scroll
      source_url: "https://dss.collections.imj.org.il/isaiah"
      source_family: dss_biblical_witness_catalogs
      use_in_t396: "Coverage and date-display anchor for the Great Isaiah Scroll exemplar; no image, transcription, translation, or source text imported."
    - source_id: israel_museum_great_isaiah_collection_record
      source_url: "https://www.imj.org.il/en/collections/198208-0"
      source_family: holding_institution_catalogs
      use_in_t396: "Holding-institution collection-record anchor for title, identifier, material/accession, and repository review; rendered page needs later direct catalog review."
    - source_id: iaa_dss_discovery_publication
      source_url: "https://www.deadseascrolls.org.il/learn-about-the-scrolls/discovery-and-publication"
      source_family: dss_biblical_witness_catalogs
      use_in_t396: "Discovery/publication context anchor only; not a witness-text, authority, or apologetic-proof source."
  candidate_claim_policy: "Rows with indexed or summary-level support remain candidate or review-pending until direct source extraction and scholarly cross-check are complete."
  blocked_claim_policy: "Normalized date interval, exact shelfmark/accession treatment, script classification, rights reuse, and broader DSS row expansion remain blocked until later review."
premortem:
  p0_failure_modes:
    - "Witness rows become Scripture authority or preferred-reading authority."
    - "Rows are created from memory rather than official row-level URLs."
    - "Bible text, source text, transcription, translation, image text, commentary, or creed wording is imported."
    - "DSS discovery or date metadata is treated as apologetic proof."
    - "Candidate facts are silently promoted to confirmed facts."
    - "Non-biblical DSS/Qumran material leaks into Scripture Graph."
    - "T393 current-focus semantics are broken by manuscript metadata work."
    - "Parallel-agent work is overwritten or mixed into this branch."
  fixes_applied:
    - "Use one Great Isaiah Scroll exemplar only."
    - "Require source_url, method, confidence, provenance_note, review_status, rights_access_status, source_family, and non_authorizing_scope_label on every row."
    - "Reject text-bearing keys and require all text-storage flags to remain false."
    - "Keep dates and coverage as source-display metadata with blocked normalization review."
    - "Add a review-queue row for direct page extraction, scholarly cross-check, rights/access, and normalization blockers."
    - "Leave current_focus unchanged and add no chunk, graph, retrieval, vector, or reviewed-gold output."
red_team_result:
  attack_summary: "The strongest attack is that a single famous scroll could be made to carry too much theological or apologetic weight."
  fix_summary: "T396 names the row scope as metadata only, keeps confidence/review status explicit, forbids text/preferred readings, and records that no single witness proves global preservation or authorizes an apologetic conclusion."
