next_goal_prompt:
  goal_id: T400_NT_PAPYRI_CODICES_SOURCE_ROW_EXEMPLARS
  prompt: "Work in logos-scripture-graph from live origin/main after T396 is merged. T397, T398, and T399 already exist on main; use T400 for this manuscript-reliability task. Start with a premortem and red-team pass, then fix P0/P1 risks before editing. Populate a tiny metadata-only NT papyri/codices exemplar set from official INTF/NTVMR/Liste, CSNTM, and holding-institution anchors already routed through T391/T395. Prefer one or two exemplars only. Do not import source text, manuscript transcription, Bible text, images, preferred readings, source-tradition preferences, graph/retrieval/vector output, Boundary Literature material, Doctrine Genealogy material, or apologetic conclusions as authority. Every row must carry source_url, method, confidence, provenance_note, review_status, rights_access_status, source_family, non_authorizing_scope_label, and candidate/blocked status where appropriate. Add validation/tests and update TOCs/status/decision/lesson/data-map surfaces."
