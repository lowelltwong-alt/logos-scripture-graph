harnesses:
  - harness_id: T397-HARN-001
    title: Non-target byte identity comparison
    status: implemented_non_output_changing
    script: scripts/chunking/route_isolation_harness.py
    test: tests/test_route_isolation_harness.py
    purpose: "Compare baseline and candidate chunk JSONL surfaces and require all non-target records to remain byte-identical."
    must_fail_if:
      - non_target_record_bytes_change
      - non_target_record_added_or_removed
      - duplicate_chunk_key_seen
      - missing_osis_span_fields
  - harness_id: T397-HARN-002
    title: Exact parent target change allowance only
    status: implemented_non_output_changing
    script: scripts/chunking/route_isolation_harness.py
    test: tests/test_route_isolation_harness.py
    purpose: "Allow only the exact Eph.1.3-Eph.1.14 span shape in future candidate-output simulations when child spans are not authorized."
    must_fail_if:
      - changed_span_is_not_Eph_1_3_Eph_1_14
      - adjacent_verse_spillover_detected
      - replacement_changes_existing_non_target_chunk
  - harness_id: T397-HARN-003
    title: Child-span denial check
    status: implemented_non_output_changing
    script: scripts/chunking/route_isolation_harness.py
    test: tests/test_route_isolation_harness.py
    purpose: "Fail candidate simulations that add subspans or child-span payloads while T394 says child spans are not necessary now and are not authorized."
    must_fail_if:
      - child_subspan_added_without_owner_authorization
      - selected_children_not_empty
      - child_chunks_payload_not_empty
  - harness_id: T397-HARN-004
    title: Spillover and adjacent-boundary denial check
    status: implemented_non_output_changing
    script: scripts/chunking/route_isolation_harness.py
    test: tests/test_route_isolation_harness.py
    purpose: "Fail future candidate simulations that extend the authorized target into Eph.1.1-Eph.1.2, Eph.1.15+, or any other adjacent span."
    must_fail_if:
      - target_start_moves_before_Eph_1_3
      - target_end_moves_after_Eph_1_14
      - target_span_crosses_book_or_unsupported_reference
  - harness_id: T397-HARN-005
    title: Future same-baseline report input
    status: prepared_non_output_changing
    script: scripts/chunking/route_isolation_harness.py
    test: tests/test_route_isolation_harness.py
    purpose: "Emit deterministic baseline/candidate counts, sha256s, changed keys, changed spans, and non-target identity status for future same-baseline evaluation evidence."
    must_fail_if:
      - report_omits_baseline_sha256
      - report_omits_candidate_sha256
      - report_omits_changed_spans
      - report_claims_non_target_identity_without_byte_comparison
