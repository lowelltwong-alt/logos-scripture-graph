decision_rationale:
  summary: >
    Hold promotion. T337B/T338/T339 provide strong evidence for the exact
    route-isolated Psalm 89 Option C behavior and non-target identity, but they
    do not yet justify promoting the Psalm candidate skill as an approved or
    active Psalm skill. The skill has one output-changing reviewed-gold case,
    and promotion could be overread as broad Psalm optimization.
  sufficient_for:
    - retaining Psalm 89 Option C behind the literal Psalm candidate route
    - keeping reviewed Psalm guardrails fail-closed
    - using T338/T339 evidence in future promotion review
  insufficient_for:
    - lifecycle promotion to approved or active
    - broad Psalm optimization
    - global marker-driven boundary behavior
