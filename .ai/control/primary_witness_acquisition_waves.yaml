waves:
  - wave_id: W0
    title: "Catalog and rights scaffold"
    cursor_action: "Create metadata-only rows and rights review files; no downloads."
    priority: highest
    target_sources:
      - all_sources_in_this_plan
    expected_size: "< 50 MB"
    success_gate: "Every source has source_id, URL, witness family, biblical scope, image_access, text_access, license, storage decision, confidence, and review_status."
  - wave_id: W1
    title: "Text/transcription first where already open or already in repo"
    cursor_action: "Prepare text acquisition manifests for open machine-readable texts and mark already-present repo sources."
    priority: high
    expected_size: "100 MB to 1 GB new local data"
    target_sources:
      - sblgnt
      - oshb_wlc
      - tanach_us_uxlc
      - ugnt
      - cntr_sr
      - codex_sinaiticus_xml_noncommercial
      - clementine_vulgate_public_domain
      - swete_lxx_public_domain_ocr
    success_gate: "Machine text is either already present, manifest-ready, or blocked with a license reason."
  - wave_id: W2
    title: "Open/public-domain image sets with cleanest storage path"
    cursor_action: "After W0 rights review, download only approved original image sets or archive files, not every derivative."
    priority: high
    expected_size: "30 GB minimum free space; 50 GB comfortable"
    target_sources:
      - leningrad_codex_color_images
      - codex_sassoon_1053_color_images
      - bl_or_4445_torah
      - swete_septuagint_ia
      - biblia_sacra_vulgatae_1592
      - codex_amiatinus_after_rights_review
      - aleppo_codex_after_noncommercial_owner_review
      - codex_cairensis_after_rights_review
    success_gate: "Each downloaded file has checksum, manifest row, source URL, license, and no image is treated as preferred text."
  - wave_id: W3
    title: "Public-view-only major witnesses"
    cursor_action: "Catalog URLs and metadata only; do not store images unless permission is obtained."
    priority: high
    expected_size: "0 GB local images now"
    target_sources:
      - great_isaiah_scroll_official
      - leon_levy_dss_biblical_witnesses
      - codex_vaticanus_digivatlib
      - codex_alexandrinus_british_library
      - p52_manchester
      - p45_csntm
      - p46_csntm
      - p66_bodmer_csntm
      - p75_vatican_csntm
    success_gate: "Every public-view source has official URL, rights note, no-local-storage decision, and optional permission-contact next action."
  - wave_id: W4
    title: "Advanced linguistic/restricted datasets"
    cursor_action: "Catalog only until license and repo-use profile are approved."
    priority: medium
    expected_size: "Unknown; keep out of raw until reviewed."
    target_sources:
      - bhsa_text_fabric_cc_by_nc
      - catss_lxx_restricted
      - peshitta_leiden
      - samaritan_pentateuch_manuscripts
      - coptic_and_syriac_early_versions
    success_gate: "Each source has a license decision and routing decision before any local storage."
