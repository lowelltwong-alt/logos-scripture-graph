object_type: primary_witness_acquisition_waves
schema_version: primary_witness_acquisition_waves.v1
task_id: T469
status: planning_only_no_downloads
trust_zone: candidate
created_at: "2026-07-08"
owner: Lowell Wong
purpose: "Give Cursor an executable wave plan for bringing primary and early Bible witnesses into the knowledge base as metadata/text/image candidates where rights allow."
authority:
  records_acquisition_plan: true
  records_storage_estimates: true
  authorizes_source_metadata_rows: false
  authorizes_raw_downloads: false
  authorizes_image_storage: false
  authorizes_transcription_storage: false
  authorizes_source_text_import: false
  authorizes_textual_critical_decision: false
  authorizes_preferred_reading: false
  authorizes_source_tradition_preference: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_theology_authority: false
rules:
  - "Metadata first: record source URL, rights, source family, scope, confidence, and review status before any download."
  - "Download only if image/text rights permit local storage and the manifest records the exact license or rights statement."
  - "Public-view-only images are cataloged by URL and not stored locally."
  - "Manuscript age, fame, or apologetic usefulness cannot select a preferred reading or source tradition."
  - "Official holding-institution or project pages outrank mirrors, but mirrors may be used only when rights are clearer and provenance is preserved."
  - "Keep Scripture Graph limited to biblical witness metadata and source-language evidence; boundary/reception material routes elsewhere."
target_layout_for_future_execution:
  metadata_root: data/candidate/source_catalog/primary_bible_witnesses/
  raw_root_if_later_authorized: data/raw/primary_witnesses/
  recommended_files:
    - data/candidate/source_catalog/primary_bible_witnesses/source_catalog_rows.jsonl
    - data/candidate/source_catalog/primary_bible_witnesses/image_rights_review.yaml
    - data/candidate/source_catalog/primary_bible_witnesses/text_acquisition_review.yaml
    - data/candidate/source_catalog/primary_bible_witnesses/acquisition_manifest.yaml
    - data/candidate/source_catalog/primary_bible_witnesses/storage_ledger.yaml
storage_estimates:
  wave_0_metadata_only:
    expected_local_size: "< 50 MB"
    note: "Source rows, rights reviews, manifests, and review queues only."
  wave_1_text_and_transcriptions:
    expected_new_local_size: "100 MB to 1 GB"
    note: "Most machine text/transcription sources are small; allow headroom for XML, OCR, manifests, and checksums."
  wave_2_public_domain_or_open_image_originals:
    expected_new_local_size_without_aleppo_or_cairensis: "~10.9 GB originals, ~22.9 GB with Internet Archive derivatives"
    expected_new_local_size_with_aleppo_and_cairensis_after_rights_review: "~14.3 GB originals, ~27.6 GB with Internet Archive derivatives"
    recommended_free_space: "30 GB minimum; 50 GB comfortable"
  wave_3_public_view_or_permission_needed_images:
    expected_new_local_size_now: "0 GB local image storage; catalog URLs only"
    if_permissions_later: "Budget 100 GB to 250 GB for high-resolution codex/papyrus image expansion."
