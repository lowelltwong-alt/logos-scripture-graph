  strict_frontier_triad_delta_agreement_accepted_after_hard_exceptions: 50
  first_governed_review_batch_recommendation: 19
  first_governed_review_batch_basis: "Use the T465 owner candidate docket's 19 M4_codex_gpt55 plus M6_fable5 aligned rows as the first small review-packet lane."
  promotion_authority: none
approved_decisions:
  - decision_id: T468-D1
    title: "Default unit size"
    selected_route: faithful_route
    rule: "Default to the larger coherent biblical unit rather than fragmenting merely for retrieval convenience."
    preserve:
      - scenes
      - speeches
      - poems
      - lists
      - arguments
      - oracles
    split_only_when:
      - speaker_change
      - scene_change
      - oracle_or_vision_shift
      - stanza_acrostic_or_refrain
      - list_sub_unit
      - argument_movement
      - doxology_or_benediction
      - variant_gate
    downstream_instruction: "If retrieval wants smaller material, later child spans may refine the approved parent without replacing the faithful parent unit."
  - decision_id: T468-D2
    title: "Lists, genealogies, ritual procedures, and allotments"
    selected_route: faithful_route
    rule: "Keep the whole functional list, register, procedure, allotment, or census unit together unless the text itself marks internal sub-units."
    split_only_when:
      - tribe
      - day
      - clan
      - offering
      - location
      - speaker
      - function
    downstream_instruction: "Avoid chapter-only or verse-count splitting of lists when the Bible's own list structure gives the unit."
  - decision_id: T468-D3
    title: "Poetry, Psalms, laments, and songs"
    selected_route: faithful_route
    rule: "Preserve the poem, psalm, lament, song, or clear stanza movement as the parent unit."
    split_only_when:
      - acrostic_stanza
      - refrain
      - speaker_turn
      - doxology
      - oracle_shift
      - lament_to_praise_movement
    downstream_instruction: "Do not split poetry merely for retrieval; use later child spans for long retrieval pressure after the parent is approved."
  - decision_id: T468-D4
    title: "Prophecy, oracle, and vision material"
    selected_route: faithful_route
    rule: "Chunk by oracle, vision, symbolic-scene, audience shift, or fulfillment unit rather than by artificial chapter or model-convenience boundaries."
    split_signals:
      - speech_formula
      - audience_shift
      - imagery_or_vision_scene
      - judgment_restoration_movement
      - fulfillment_unit
    escalation_required_for:
      - Daniel
      - Revelation
      - major_vision_cycles
      - unclear_oracle_seams
    downstream_instruction: "Frontier review is required where symbolic vision cycles, apocalyptic structure, or unclear seams create interpretive pressure."
  - decision_id: T468-D5
    title: "Gospels, Jesus' words, and speaker-sensitive discourse"
    selected_route: faithful_route
    rule: "Preserve scene and discourse units. Speaker changes matter, but WJ/red-letter metadata is evidence only and does not by itself authorize a parent boundary."
    preserve_when_same_unit:
      - controversy_scene
      - parable_set
      - miracle_narrative
      - prayer
      - teaching_discourse
    downstream_instruction: "Use later child spans for sayings, parables, sub-arguments, and speaker turns after the parent scene/discourse has been reviewed."
  - decision_id: T468-D6
    title: "Epistle argument movement"
    selected_route: faithful_route
    rule: "Chunk epistles by argument movement and epistolary function rather than by uniform verse counts."
    units:
      - greeting
      - thanksgiving_or_prayer
      - thesis
      - argument_step
      - scripture_proof
      - exhortation
      - travel_note
      - doxology
      - benediction
    escalation_required_for:
      - Romans
      - Corinthians
      - Hebrews
      - dense_epistle_arguments
    downstream_instruction: "Dense argument units require Codex/frontier review before owner promotion."
  - decision_id: T468-D7
    title: "Variant and source-tradition hot zones"
    selected_route: faithful_route
    rule: "Defer output and require a transparent variant/source-tradition packet before any chunking promotion in disputed textual zones."
    never_silently_normalize:
      - Mark_16_longer_ending
      - John_7_53_8_11
      - Romans_16_doxology
      - Deut_32_8_9
      - Jeremiah_MT_LXX_structure
      - Daniel_and_Esther_additions_routing
      - First_John_5_6_8
    downstream_instruction: "No later task may treat oldest witness, majority agreement, model agreement, or Strong's/original-language metadata as automatic authority."
