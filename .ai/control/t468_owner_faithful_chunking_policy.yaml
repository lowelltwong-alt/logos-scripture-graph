mode: owner_policy_non_authorizing
summary: "Use Bible-internal literary, discourse, canonical, and textual signals as the first governing principle for future chunking review packets. Agreement between models is evidence; it is never output authority."
first_principle:
  id: let_the_bible_interpret_the_bible
  label: "Let the Bible interpret the Bible"
  rule: "When a chunking decision is unclear, prefer the Bible's own literary form, discourse movement, speaker/scenario context, canonical cross-textual signals, and textual-transmission evidence over retrieval convenience or model preference."
  guardrail: "This principle is a chunking-policy guardrail only. It does not authorize theology claims, preferred readings, source-tradition preference, canon changes, reviewed gold, or output."
candidate_acceptance:
  evidence_status: owner_candidate_evidence_only
  easy_majority_rows_total: 144
  easy_majority_rows_accepted_after_hard_exceptions: 143
