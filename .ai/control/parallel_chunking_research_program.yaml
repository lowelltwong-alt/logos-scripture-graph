cursor_advance_gate:
  required_before_batch_start:
    - one_task_one_branch_one_worktree_claim_recorded
    - git_status_clean_or_only_current_task_allowed_paths_dirty
    - no_merge_rebase_cherry_pick_or_bisect_state
    - no_untracked_artifacts_from_another_task_id_present
    - shared_control_file_edit_claim_absent_or_owned_by_current_codex_integrator
    - preflight_result_recorded_in_audit_log
  required_before_next_book:
    - required_files_read_or_explicitly_listed_as_not_read
    - per_book_ledger_complete
    - cursor_notes_to_codex_present
    - audit_log_present
    - source_size_manifest_present
    - confidence_register_present
    - handoff_present
    - no_authority_or_output_created
    - escalation_packets_present_for_hard_or_low_confidence_issues
  must_stop_before:
    - cursor_target_selection
    - reviewed_gold_promotion
    - chunk_output_change
    - theology_decision
    - source_metadata_as_boundary_authority
    - variant_or_speaker_or_apocalyptic_or_doxology_resolution_without_escalation
  must_stop_when:
    - untracked_artifacts_from_another_task_id_present
    - dirty_files_outside_current_task_allowed_paths
    - shared_control_file_claim_conflict
    - merge_rebase_cherry_pick_or_bisect_state_detected
parallel_execution_safety:
  branch_worktree_rule: "One task must run in one branch and one worktree; do not continue a batch on a branch/worktree containing another task's uncommitted artifacts."
  clean_status_preflight:
    required: true
    command: git status --short --branch
    must_record_in: ".ai/context/agent_work/<TASK_ID>/audit_log.jsonl"
    pass_condition: "Clean status, or only current-task allowed paths are dirty and explicitly listed before work continues."
  merge_state_preflight:
    required: true
    forbidden_states:
      - merge
      - rebase
      - cherry_pick
      - bisect
    pass_condition: "No .git MERGE_HEAD, REBASE_HEAD, CHERRY_PICK_HEAD, BISECT_LOG, rebase-merge, or rebase-apply state is present."
  task_artifact_isolation:
    cursor_allowed_write_roots:
      - ".ai/context/agent_work/<TASK_ID>/"
      - ".ai/handoffs/<TASK_ID>/"
    cursor_must_not_write_shared_control_plane: true
    stop_if_other_task_artifacts_present: true
  shared_control_file_serialization:
    integrator_role: Codex
    rule: "Shared control-plane and roadmap files are serialized through a single Codex integrator branch, never parallel Cursor batches."
    shared_files:
      - .ai/control/PROJECT_STATUS.md
      - .ai/control/current_focus.yaml
      - .ai/control/handoff_ledger.jsonl
      - .ai/control/chunking_phase_completion_plan.yaml
      - .ai/control/bible_chunking_readiness_map.yaml
      - ROADMAP_STATE.yaml
      - AI_FRONT_DOOR.md
      - AI_TABLE_OF_CONTENTS.md
      - docs/roadmap/AI_ROADMAP_TABLE_OF_CONTENTS.md
    merge_order_required: true
  file_claim_rule:
    cursor_batches_claim_task_roots_only: true
    codex_integrator_claims_shared_files_explicitly: true
    claim_record_location: ".ai/context/agent_work/<TASK_ID>/audit_log.jsonl"
  stop_conditions:
    - untracked_artifacts_from_another_task_id_present
    - dirty_files_outside_current_task_allowed_paths
    - shared_control_file_claim_conflict
    - merge_rebase_cherry_pick_or_bisect_state_detected
