program_model:
  rust_role: "Deterministic whole-Bible raw USFM observation substrate producer before Cursor performs long-running review-prep work."
  cursor_role: "Long-running workhorse for ledger-first read-only research, review-packet prep notes, and escalation packets; Cursor does not reread the whole raw Bible unless an exact span exception is logged."
  codex_role: "Governance reviewer, prompt-pack enricher, validator/test author, exact gate implementer after owner approval, and next-pack author."
  frontier_role: "Claude Opus/frontier reviewer for hard theological, literary, and architecture risk before any hard case can move toward gold or output."
  owner_role: "Approves exact target, exact parent span, reviewed-gold promotion, and output-changing implementation scope."
  specialist_reviewer_roles:
    greek_reviewer: "Read-only, recommend-only reviewer for Greek word/phrase, discourse, greeting, thanksgiving, doxology, and identity-pressure questions."
    hebrew_reviewer: "Read-only, recommend-only reviewer for Hebrew/Aramaic word/phrase, narrative, prophecy, poetry, and typology-pressure questions."
    biblical_literature_reviewer: "Read-only, recommend-only reviewer for genre, discourse, stanza, scene, oracle, and argument-boundary questions."
    explorer_subagent: "Bounded read-only Codex-side audit worker for specific repo questions; cannot authorize output or make shared control-plane changes."
    worker_subagent: "Implementation worker only for later disjoint task-id/branch/worktree slices with explicit write ownership and live-safety preflight."
  specialist_guardrails:
    - language_and_literature_reviewers_are_read_only_recommend_only
    - explorer_subagents_are_read_only_and_bounded_to_specific_questions
    - worker_subagents_require_disjoint_write_sets_task_ids_branches_and_worktrees
    - no_subagent_can_choose_targets_promote_gold_create_output_or_authorize_theology
pre_cursor_observation_substrate:
  task_id: T412
  status: validated_required_before_t411_cursor_run
  producer: Rust
  validator: scripts/validate_rust_observation_substrate.py
  cursor_pack_builder: scripts/build_cursor_observation_pack.py
  output_root: build/observation_substrate/current
  default_cursor_input: compressed_observation_ledgers
  cursor_raw_whole_bible_reread_allowed: false
  generated_validation_passed: true
  cursor_pack_check_passed: true
  cursor_raw_exception_allowed_only_for:
    - exact_owner_or_codex_supplied_span_exception
    - escalation_packet_exception
  validate_all_mode: contract_only_no_full_scan
  non_authorizing: true
phase_ladder:
  - step_id: research
    order: 1
    actor: Cursor
    output_authorized: false
    summary: "Read repo sources, sidecars, prior decisions, raw/canonical evidence, marker coverage, Strong's metadata, and book hints."
  - step_id: review_packet_prep
    order: 2
    actor: Cursor
    output_authorized: false
    summary: "Prepare non-authorizing packet notes with source sizes, hashes, confidence, audit logs, and limitations."
  - step_id: codex_review
    order: 3
    actor: Codex
    output_authorized: false
    summary: "Check evidence, governance, theology smuggling, confidence, and owner-gate readiness."
  - step_id: frontier_escalation
    order: 4
    actor: Claude_Opus_or_frontier
    output_authorized: false
    summary: "Review hard prophecy, apocalyptic, dense epistle, WJ/speaker, variant, doxology, and doctrinal-pressure cases."
  - step_id: owner_gate
    order: 5
    actor: Owner
    output_authorized: false
    summary: "Approve exact target, parent span, and whether it may become reviewed gold."
  - step_id: reviewed_gold_promotion
    order: 6
    actor: Codex
    output_authorized: false
    summary: "Promote only the exact owner-approved parent span into reviewed gold with validator coverage."
  - step_id: route_isolated_harness
    order: 7
    actor: Codex
    output_authorized: false
    summary: "Prove only the exact target can change and non-target chunks remain byte-identical."
  - step_id: output_changing_pr
    order: 8
    actor: Codex
    output_authorized: true_after_separate_owner_gate
    summary: "Implement an additive parent overlay only; no child spans, replacement, or whole-Bible algorithm mutation."
  - step_id: post_pilot_review
    order: 9
    actor: Codex_with_optional_frontier_review
    output_authorized: false
    summary: "Record output hashes, risks, lessons, child-span necessity, and whether the pattern can be reused."
phase_one_definition:
  target: "One governed, parent-only, additive low-risk chunk overlay per canonical book where safe, with explicit deferrals where not safe."
  completion_rule: "Every canonical 66 book must be statused as implemented, pending, or deferred with evidence and next-phase routing."
  not_phase_one: "Phase 1 does not solve every hard chunk, child span, original-language clause, context-packet, graph/retrieval/vector, or whole-Bible algorithm refresh."
  implementation_shape: parent_only_additive_overlay
  default_child_span_policy: not_authorized_without_later_exact_owner_gate
