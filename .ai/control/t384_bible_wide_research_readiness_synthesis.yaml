what_must_remain_blocked:
  - blocker_id: BLOCK-001
    title: Whole-Bible Output Pass
    reason: "A global output-changing run would bypass lane-specific reviewed gold, non-target identity checks, and theological risk controls."
    blocked_until:
      - multiple_lane_promotions_or_rejections_with_evidence
      - route_ledger_stability
      - per_lane_gold_coverage
      - cross_lane_non_target_identity_checks
      - owner_authorization_for_whole_bible_output
  - blocker_id: BLOCK-002
    title: Graph, Retrieval, Vector, Or Edge Truth
    reason: "Derived graph/retrieval/vector surfaces can look authoritative and must not be created from research metadata or chunk options."
    blocked_until:
      - separate_owner_authority
      - evidence_refs_and_trust_zone_policy
      - validation_for_non_truth_bearing_outputs
  - blocker_id: BLOCK-003
    title: Child Spans
    reason: "Child spans may be useful but can smuggle argument hierarchy or theology unless exact reviewed evidence and owner promotion exist."
    blocked_until:
      - exact_target_review
      - child_necessity_review
      - owner_child_span_promotion
  - blocker_id: BLOCK-004
    title: Preferred Readings, Source Tradition, Canon Scope, Or Boundary Import
    reason: "These would become textual-critical or canon-scope authority, not research."
    blocked_until:
      - case_specific_owner_confirmation
      - exact_variant_or_boundary_dependency_record
      - decision_register_update
human_decisions_required:
  - decision_id: HDM-001
    title: Select first post-research epistle review-packet strengthening target
    timing: before_any_T384_option_promotion_or_implementation
    owner_question: "Which exact epistle argument target should be strengthened first, if any?"
    faithful_options:
      - option_id: T384-A
        passage: Eph.1.3-Eph.1.14
        upside: "Compact, high-value, strong first comparison candidate."
        downside_risk: "Can smuggle election, adoption, sealing, or Trinitarian-economy systems if labels outrun the text."
        recommendation: recommended_first_owner_option_not_selected
      - option_id: T384-B
        passage: Rom.9.1-Rom.11.36
        upside: "Major canonical argument with high theological value."
        downside_risk: "Very broad and highly system-sensitive; likely slower and higher risk."
        recommendation: defer_until_after_smaller_epistle_target
      - option_id: T384-C
        passage: Heb.7.1-Heb.10.39
        upside: "Important priesthood/covenant/sacrifice argument with OT intertexts."
        downside_risk: "Large span and high covenant/typology risk."
        recommendation: research_continues_before_implementation
      - option_id: T384-D
        passage: Gal.2.15-Gal.3.29
        upside: "Compact law/promise/justification target."
        downside_risk: "Law/gospel and justification systems can leak into boundaries."
        recommendation: good_alternate_owner_option
      - option_id: T384-E
        passage: Jas.2.14-Jas.2.26
        upside: "Small pressure passage for faith/works and canonical harmonization."
        downside_risk: "Can force James/Paul harmonization or opposition."
        recommendation: good_small_pressure_option
      - option_id: T384-F
        passage: 1Cor.11.17-1Cor.14.40
        upside: "Natural continuation after 1Cor.8-10."
        downside_risk: "Risks overfitting to one book and encoding sacramental/charismatic/ecclesial systems."
        recommendation: defer_until_after_first_epistle_research_target
    non_authorizations: [selection_by_this_synthesis, reviewed_gold, child_spans, output_change]
  - decision_id: HDM-002
    title: Decide whether John 3 parent-only review should be strengthened next
    timing: before_any_gospel_wj_promotion_or_output
    owner_question: "Should John.3.1-John.3.36 be strengthened as a parent-only Gospel/WJ packet before more epistle work?"
    faithful_options: [hold_until_after_epistle_target, strengthen_parent_only_review, require_child_or_speaker_boundary_options_first]
    non_authorizations: [Jesus_narrator_boundary, speaker_attribution, reviewed_gold, output_change]
  - decision_id: HDM-003
    title: Decide when Revelation leaves research-only posture
    timing: before_any_Revelation_gold_or_implementation
    owner_question: "Is any Revelation target strong enough to move beyond research/prep, or should REV-T344-E continue?"
    faithful_options: [continue_research_only, strengthen_rev12_14_packet, select_different_Revelation_packet, defer_Revelation_until_other_lanes_mature]
    non_authorizations: [chronology_system, millennium_system, symbol_identity, reviewed_gold, output_change]
  - decision_id: HDM-004
    title: Select first non-epistle genre review target after epistle/Gospel readiness
    timing: before_narrative_wisdom_or_prophetic_gold
    owner_question: "Which seeded non-epistle lane should get the next exact review packet?"
    faithful_options: [narrative_legal_covenant, wisdom_dialogue_poetry, prophetic_oracle_vision, psalms_poetry_hold_or_more_evidence]
    non_authorizations: [typology_system, covenant_system, fulfillment_system, wisdom_theology_system, output_change]
  - decision_id: HDM-005
    title: Confirm case-specific textual-variant dependency before variant-sensitive promotion
    timing: before_any_variant_sensitive_gold_or_boundary
    owner_question: "For the exact target, are named variants boundary-dependent, reviewed-gold-dependent, or non-dependent?"
    faithful_options: [variant_non_dependent_for_exact_claim, variant_dependent_hold, variant_requires_more_research, reject_variant_sensitive_target]
    non_authorizations: [preferred_reading, source_tradition_preference, canon_scope_change, boundary_import]
  - decision_id: HDM-006
    title: Confirm source metadata or original-language evidence remains evidence-only
    timing: before_any_packet_uses_metadata_or_original_language_as_boundary_evidence
    owner_question: "Does the packet use metadata or Greek/Hebrew observations as evidence only, or is a stronger owner decision required?"
    faithful_options: [evidence_only_no_authority, require_original_language_dossier, require_textual_variant_case_policy, stop_before_use]
    non_authorizations: [isolated_word_truth, capitalization_truth, cross_reference_graph_truth, metadata_driven_boundary]
  - decision_id: HDM-007
    title: Authorize any future route/evaluator/output implementation
    timing: after_exact_target_reviewed_gold_or_equivalent_governed_evidence
    owner_question: "Does the owner authorize an exact route-isolated output-changing implementation, and with what output semantics?"
    faithful_options: [hold, dry_run_only, additive_parent_overlay_only, exact_replacement_with_spill_plan, route_behavior_without_output_rejected]
    non_authorizations: [whole_bible_output, broader_generalization, graph_retrieval_vector_truth, evaluator_formula_change_without_owner]
