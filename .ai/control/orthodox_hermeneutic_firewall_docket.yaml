  canonical_coherence_allowed: "The system must not require anti-canonical fragmentation as a hidden default."
  orthodox_plurality_allowed: "Multiple orthodox Protestant, catholic, and patristic-compatible readings may remain possible where they remain within Nicene/Chalcedonian Christianity and canonical Scripture authority."
anti_smuggling_rules:
  - rule_id: FIREWALL-ORTH-001
    rule: "Do not let anti-supernatural assumptions become default explanations for Scripture structure, genre, prophecy, miracle, resurrection, inspiration, or canon."
  - rule_id: FIREWALL-ORTH-002
    rule: "Do not let anti-canonical or canon-diminishing assumptions become hidden defaults in chunk, graph, retrieval, review-packet, or evaluator behavior."
  - rule_id: FIREWALL-ORTH-003
    rule: "Do not let heterodox Christology, Trinity, Scripture, salvation, or resurrection assumptions become hidden defaults."
  - rule_id: FIREWALL-ORTH-004
    rule: "Do not let liberal-critical suspicion, source-fragmentation, or de-supernaturalizing theories control boundaries unless they are explicitly recorded as non-authorizing historical/contextual evidence."
  - rule_id: FIREWALL-ORTH-005
    rule: "Do not hardcode one denominational systematic theology as chunk authority where several orthodox readings remain possible."
