object_type: bible_wide_chunking_research_registry
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T358 after the maintainer asked to begin whole-Bible chunking research before more chunk implementation work."
reason_for_inclusion: "Give future chunking agents a canonical 66-book research queue with tags, use-when triggers, metadata watchpoints, and non-authorizing theological-risk prompts before choosing later review packets or algorithms."
schema_version: bible_wide_chunking_research_registry.v1
registry_id: t358_bible_wide_chunking_research_registry
owner: Lowell Wong
authority:
  records_research_queue: true
  records_book_level_watchpoints: true
  authorizes_chunk_output_change: false
  authorizes_new_algorithm_work: false
  authorizes_reviewed_gold_promotion: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_speaker_attribution: false
  authorizes_boundary_import: false
scope:
  corpus_scope: canonical_66
  book_count: 66
  research_mode: non_output_changing
  relationship_to_t356: "Parallel research-only queue; does not select a John 3 option and does not supersede the pending T357 owner-selection/gold gate."
global_non_authorizations:
  - raw_or_canonical_mutation
  - generated_chunk_regeneration
  - chunk_output_change
  - reviewed_gold_promotion
  - graph_edge_generation
  - retrieval_truth
  - embedding_or_vector_work
  - source_metadata_authority
  - speaker_attribution
  - boundary_import
  - revelation_implementation
  - epistle_implementation
  - wj_implementation
  - t345
research_dimensions:
  - dimension_id: genre_form_boundary
    tags: [genre, form, chunk_boundary]
    use_when: "A book or passage needs form-aware candidate boundaries without making output changes."
    non_authorization: "Genre labels are review evidence only, not automatic chunk-boundary authority."
  - dimension_id: discourse_argument_flow
    tags: [argument, discourse, epistle]
    use_when: "A passage develops a theological argument across sentences, paragraphs, or chapters."
    companion_dossier_queue: .ai/control/epistle_argument_theological_issue_dossier_queue.yaml
    non_authorization: "Argument outlines are review evidence only and require reviewed gold before route behavior authority changes."
  - dimension_id: narrative_scene_pericope
    tags: [narrative, scene, pericope]
    use_when: "A narrative book needs scene, speaker, or episode boundary review."
    companion_dossier_queue: .ai/control/narrative_legal_covenant_dossier_queue.yaml
    non_authorization: "Scene labels are review evidence only and do not authorize regenerated chunks."
  - dimension_id: legal_covenant_formulae
    tags: [law, covenant, formula]
    use_when: "Torah or covenant material mixes narrative, law, speeches, blessings, or curses."
    companion_dossier_queue: .ai/control/narrative_legal_covenant_dossier_queue.yaml
    non_authorization: "Law-code headings or covenant formulas are review evidence only, not chunk-boundary authority."
  - dimension_id: poetry_parallelism_stanza
    tags: [poetry, parallelism, stanza, refrain]
    use_when: "Poetry may be structured by parallelism, refrain, acrostic, lament, or praise."
    companion_dossier_queue: .ai/control/wisdom_dialogue_poetry_dossier_queue.yaml
    non_authorization: "Poetic structure is review evidence only, not reviewed gold or chunk-boundary authority unless explicitly promoted."
  - dimension_id: prophetic_oracle_vision
    tags: [prophecy, oracle, vision, judgment, hope]
    use_when: "Prophetic books combine oracle units, historical framing, visions, and future hope."
    companion_dossier_queue: .ai/control/apocalyptic_prophetic_intertext_dossier_queue.yaml
    non_authorization: "Prophetic fulfillment or eschatology systems are review evidence only and are not selected by chunk-boundary authority."
  - dimension_id: apocalyptic_symbol_intertext
    tags: [apocalyptic, revelation, daniel, intertext]
    use_when: "Symbolic visions or cross-book echoes could bias interpretation."
    companion_dossier_queue: .ai/control/apocalyptic_prophetic_intertext_dossier_queue.yaml
    non_authorization: "Cross-references and intertexts are review evidence only, not graph truth or hermeneutic authority."
  - dimension_id: gospel_discourse_speaker_wj
    tags: [gospel, wj, red_letter, speaker_boundary]
    use_when: "Jesus speech, narrator comment, or discourse boundary may be disputed."
    companion_dossier_queue: .ai/control/gospel_wj_discourse_dossier_queue.yaml
    non_authorization: "WJ/red-letter formatting is review evidence only and does not decide Jesus speaker attribution or chunk-boundary authority."
  - dimension_id: source_metadata_features
    tags: [metadata, cross_reference, strongs, headings, footnotes]
    use_when: "Source formatting, cross-references, Strong's-style numbers, headings, or notes appear relevant."
    companion_atlas: .ai/control/source_metadata_research_atlas.yaml
    non_authorization: "Source metadata is evidence only and never automatic Scripture, lexical, intertext, or chunk authority."
  - dimension_id: divine_name_title_capitalization
    tags: [capitalization, divine_name, spirit, word]
    use_when: "God/god, LORD/Lord/lord, Spirit/spirit, Father/father, Word/word, or pronoun capitalization may matter."
    non_authorization: "Translation capitalization is review evidence only and does not by itself authorize divine identity, Trinitarian relation, graph edges, or chunk-boundary authority."
required_future_research_packet_fields:
  - exact_passage_scope
  - genre_or_lane
  - source_metadata_observed
  - cross_reference_or_intertext_observed
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validators_or_tests_needed
book_research_queue:
  - book_id: Gen
    canonical_order: 1
    testament: OT
    primary_lane: narrative_pericope
    secondary_lanes: [legal_covenant, genealogy, source_metadata_features]
    research_status: seeded_needs_research
    use_when: "Research patriarchal narrative, creation/fall, covenant, genealogy, and blessing units before broader narrative chunking."
    representative_boundary_questions: ["How should creation accounts, genealogies, covenant scenes, and Joseph cycle episodes be distinguished without imposing a theology of origins or promise fulfillment?"]
    theological_downstream_risks: ["Chunking can overstate covenant continuity/discontinuity or isolate promises from narrative context."]
    metadata_watchpoints: [section_headings, genealogies, divine_names, cross_references]
    future_review_packet_candidates: [Gen.1-Gen.2, Gen.12-Gen.17, Gen.37-Gen.50]
    output_change_authorized: false
    implementation_authorized: false
    reviewed_gold_promoted: false
