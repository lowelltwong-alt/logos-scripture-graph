    serious_faithful_options: [after_multiple_lane_pilots, after_all_lane_packets, never_global_objective_use_route_specific_chunkers]
    recommendation: after_multiple_lane_pilots
    non_authorizations: [whole_bible_output_pass, global_algorithm_generalization, master_chunker_global_objective, output_change]
