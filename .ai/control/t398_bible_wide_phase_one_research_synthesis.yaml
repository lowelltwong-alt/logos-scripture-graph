    serious_faithful_options: [include_with_blocked_status, prepare_case_dockets_first, hold_all_variant_sensitive_candidates]
    recommendation: include_with_blocked_status
    non_authorizations: [preferred_reading_selection, source_tradition_preference, canon_scope_change, boundary_import, reviewed_gold_promotion, output_change]
  - prompt_id: T398-HDP-009
