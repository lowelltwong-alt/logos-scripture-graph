phase_one_human_decision_prompt_queue:
  - prompt_id: T398-HDP-001
    title: Select Goal 2 focused research scope and ordering
    evidence_basis: [T384, T386, T389, T398]
    owner_question: "Should Goal 2 focus one lane deeply first, or build a scored queue across all lanes before any more packet strengthening?"
    serious_faithful_options:
      - option_id: T398-HDP-001-A
        label: One lane deeply first
        upside: "Fastest path to a strong next packet and clear stop conditions."
        downside_risk: "Can overfit to one lane and leave other high-risk books under-researched."
      - option_id: T398-HDP-001-B
        label: Scored queue across lanes
        upside: "Best whole-Bible visibility before choosing the next packet."
        downside_risk: "Slower before any one target becomes promotable."
      - option_id: T398-HDP-001-C
        label: Parallel non-output lanes
        upside: "Allows research to continue while T397 harness prep proceeds."
        downside_risk: "Requires strict task isolation so research does not become authority."
    recommendation: T398-HDP-001-B
    non_authorizations: [target_selection, reviewed_gold_promotion, output_change]
  - prompt_id: T398-HDP-002
    title: Decide first Torah/narrative/legal focused research candidates
    evidence_basis: [Gen_high_risk_count, Deut_high_risk_count, narrative_legal_covenant_dossier_queue]
    owner_question: "Which narrative/legal/covenant passages should receive the first focused research packet queue?"
    serious_faithful_options: [Gen.1-Gen.3, Gen.12-Gen.17, Exod.19-Exod.24, Deut.6-Deut.8, Deut.32]
    recommendation: "Prepare options only; do not select until Goal 2 evidence ranks them."
    non_authorizations: [covenant_system_selection, typology_system_selection, law_gospel_system_selection, child_spans, output_change]
  - prompt_id: T398-HDP-003
    title: Decide first prophetic/source-tradition focused research candidates
    evidence_basis: [Jer_blocked_count, Dan_blocked_count, prophetic_oracle_vision_dossier_queue, textual_variant_source_tradition_dossier_queue]
    owner_question: "Should source-tradition-heavy prophetic books be researched before oracle/vision packets, or held until textual-source controls are stronger?"
    serious_faithful_options: [Jer_MT_LXX_hold_first, Dan_source_boundary_hold_first, Isa_servant_song_packet_options, Ezek_temple_vision_packet_options, Zech_night_vision_packet_options]
    recommendation: "Keep Jeremiah/Daniel blocked for source-tradition decisions; prepare Isaiah/Ezekiel/Zechariah focused options in parallel."
    non_authorizations: [preferred_reading_selection, source_tradition_preference, fulfillment_system_selection, israel_church_relation, output_change]
  - prompt_id: T398-HDP-004
    title: Decide Gospel/WJ focused research order
    evidence_basis: [gospel_discourse_wj_rollup, john3_wj_owner_review_docket, wj_speaker_discourse_policy]
    owner_question: "Should John 3, Sermon on the Mount, Farewell Discourse, or another Gospel discourse be strengthened first after the current epistle lane?"
    serious_faithful_options: [John.3.1-John.3.36, Matt.5.1-Matt.7.29, John.13.1-John.17.26, Luke.1.1-Luke.4.13_hold_for_ordered_narrative]
    recommendation: "Prepare options; do not select speaker or Jesus/narrator boundaries without a later owner gate."
    non_authorizations: [speaker_attribution_authority, Jesus_narrator_boundary, red_letter_as_truth, child_spans, output_change]
  - prompt_id: T398-HDP-005
    title: Create Acts-specific narrative/speech transition research lane
    evidence_basis: [acts_narrative_speech_transition_rollup]
    owner_question: "Should Acts be treated as a distinct focused lane because nearly every passage needs narrative/speech transition review?"
    serious_faithful_options: [Acts_distinct_lane, Acts_under_gospel_narrative, Acts_under_epistle_speech, hold_Acts_until_more_context_packets]
    recommendation: Acts_distinct_lane
    non_authorizations: [apostolic_speech_as_epistle_route, WJ_policy_import, graph_edge_generation, output_change]
  - prompt_id: T398-HDP-006
    title: Decide wisdom/dialogue/poetry focused research order
    evidence_basis: [Job_high_risk_count, wisdom_dialogue_poetry_dossier_queue, psalm_pilot_lessons]
    owner_question: "Should Job speaker/dialogue, Song speaker options, Psalm 119, or Lamentations acrostic structure be researched first?"
    serious_faithful_options: [Job_dialogue_cycle, Song_speaker_boundary, Ps.119_long_poetry, Lam_acrostic, hold_until_after_epistle_and_gospel]
    recommendation: Job_dialogue_cycle
    non_authorizations: [speaker_attribution_authority, wisdom_theology_system, allegorical_or_literal_song_system_selection, child_spans, output_change]
  - prompt_id: T398-HDP-007
    title: Keep source metadata and original-language evidence as evidence-only in focused packets
    evidence_basis: [source_metadata_research_atlas, original_language_phrase_context_policy, orthodox_original_language_pressure_dossier_queue]
    owner_question: "For Goal 2, should focused packets require metadata/original-language evidence sections for every candidate or only flagged candidates?"
    serious_faithful_options: [required_for_all_candidates, required_for_flagged_candidates, required_before_promotion_only]
    recommendation: required_for_flagged_candidates
    non_authorizations: [isolated_word_truth, capitalization_truth, strong_number_truth, cross_reference_graph_truth, output_change]
