interpretive_preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to select a confessional system, soteriology system, covenant system, sacramental position, or church-polity implication from chunk boundaries."
  preserved_orthodox_options:
    - reformed_or_augustinian_election_readings
    - arminian_or_wesleyan_election_readings
    - corporate_election_readings
    - individual_election_readings
    - covenant_continuity_readings
    - covenant_discontinuity_readings
    - classic_law_gospel_readings
    - new_perspective_sensitive_readings
    - perseverance_of_saints_readings
    - apostasy_warning_readings
    - high_sacramental_readings
    - memorial_or_conscience_readings
    - faith_works_harmony_readings
    - justification_distinction_readings
    - union_with_christ_readings
  not_selected_by_queue:
    - Calvinist or Arminian soteriology
    - covenant theology or dispensational theology
    - paedobaptist or credobaptist implications
    - sacramental presence or memorial-only conclusions
    - perseverance or apostasy-warning system
    - New Perspective or classic Protestant reading
    - Israel/church relation
    - law/gospel system
    - justification/sanctification relation beyond the text-local question
evidence_channels:
  - channel_id: argument_connector_flow
    use_when: "Therefore, for, so then, now, but, since, because, or similar discourse connectors affect how a passage is scoped."
    non_authorization: "Connector flow is evidence only and does not authorize argument boundaries, doctrine, route behavior, or output changes."
  - channel_id: quotation_or_catena_structure
    use_when: "An epistle chains OT quotations or allusions into an argument."
    non_authorization: "Quotation structure is evidence only and does not authorize covenant, fulfillment, graph-edge, or chunk-boundary claims."
  - channel_id: paragraph_or_section_metadata
    use_when: "Paragraphing, headings, or section markers appear to support a review span."
    non_authorization: "Paragraph and section metadata are evidence only and do not authorize chunk boundaries, pericope labels, or reviewed gold."
  - channel_id: original_language_sentence_or_clause_metadata
    use_when: "A long Greek sentence, clause chain, or original-language observation could influence the review packet."
    non_authorization: "Original-language observations are evidence only and do not authorize lexical truth, doctrine, chunk boundaries, or output changes without reviewed evidence."
  - channel_id: editorial_cross_reference_metadata
    use_when: "Internal cross-references suggest quotation, typology, intertext, or doctrinal linkage."
    non_authorization: "Editorial cross-references are evidence only and do not authorize intertext truth, fulfillment claims, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: lexical_or_strongs_metadata
    use_when: "Strong's-style numbers, repeated terms, rare words, or lexical clusters appear relevant."
    non_authorization: "Lexical metadata are evidence only and do not authorize word-study conclusions, theological identity, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: discourse_participant_or_pronoun_reference
    use_when: "Pronouns, speaker shifts, addressee shifts, or Jew/Gentile/we/you/they distinctions affect the argument."
    non_authorization: "Participant tracking is evidence only and does not authorize theological identity, ecclesiology, speaker attribution, or chunk boundaries."
  - channel_id: sacramental_or_ecclesial_language
    use_when: "Baptism, table, body, church, conscience, or fellowship language may be implicated."
    non_authorization: "Sacramental and ecclesial language is evidence only and does not authorize confessional conclusions, graph edges, retrieval truth, or chunk boundaries."
