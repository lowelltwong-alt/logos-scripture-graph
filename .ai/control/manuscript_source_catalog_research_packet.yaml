placement_decision:
  owning_repo: logos-scripture-graph
  repo_scope: "Curated source metadata anchors and claim controls for canonical Scripture manuscript evidence only."
  boundary_repo_scope: "Church fathers, patristic citations, commentaries, early creed wording, non-biblical Qumran/DSS content, and reception history route to logos-boundary-literature."
  doctrine_repo_scope: "Doctrinal development, denominational lineage, theologian influence, and who built theology on whom route to future logos-doctrine-genealogy."
  split_rule: "Source metadata may reference Scripture coverage, manuscript identifiers, holding institutions, source methods, date ranges, discovery events, provenance, confidence, and review status; it must not store manuscript text, Bible text, commentary text, creed wording, or theologian writing."
source_family_taxonomy:
  - family_id: dss_biblical_witness_catalogs
    correct_repo: logos-scripture-graph
    description: "Official catalog and digital-library anchors for biblical Dead Sea Scrolls/Judean Desert witnesses."
    confirmed_fact_boundary: "Can confirm catalog/source existence, content category, identifier workflow, image/access context, discovery/publication source anchors, and biblical-vs-non-biblical routing signals."
    candidate_claim_boundary: "Witness-level date, coverage, material, and location claims require row-level official source review before population."
    routes_elsewhere: "Non-biblical Qumran/DSS compositions, sectarian writings, pesharim/commentary, parabiblical material, and reception interpretation route to Boundary Literature."
    required_cross_checks:
      - iaa_leon_levy_dss_digital_library
      - iaa_dss_archive_browser
      - iaa_dss_content_categories
    review_status: source_catalog_located
  - family_id: nt_manuscript_catalogs
    correct_repo: logos-scripture-graph
    description: "INTF/NTVMR/Liste and CSNTM anchors for Greek New Testament papyri, majuscules, minuscules, lectionaries, catalog identifiers, date ranges, material, language, and coverage metadata."
    confirmed_fact_boundary: "Can confirm catalog source, source record fields, and method context."
    candidate_claim_boundary: "No harmonized witness identity, exact date, or earliest-fragment claim is trusted until holding-institution and INTF/CSNTM claims are preserved separately."
    routes_elsewhere: "Patristic citations, commentary, reception arguments, and early creed wording route to Boundary Literature."
    required_cross_checks:
      - intf_ntvmr
      - intf_liste
      - csntm_manuscripts_catalog
    review_status: source_catalog_located
  - family_id: major_codex_project_catalogs
    correct_repo: logos-scripture-graph
    description: "Official project and holding-institution anchors for major codices such as Sinaiticus, Vaticanus, and Alexandrinus."
    confirmed_fact_boundary: "Can confirm official digital project/catalog anchors, holding institutions, source access, scope wording, and rights/access constraints."
    candidate_claim_boundary: "Completeness, canonical scope, date range, and contents must be source-scoped and cannot select a preferred text."
    routes_elsewhere: "Theological reception, use in doctrinal history, and commentary on codices route outside Scripture Graph."
    required_cross_checks:
      - codex_sinaiticus_project
      - vatican_library_codex_vaticanus
      - british_library_codex_alexandrinus
    review_status: source_catalog_located
  - family_id: holding_institution_catalogs
    correct_repo: logos-scripture-graph
    description: "Official repository and collection records used to cross-check shelfmark, rights, location, provenance, and source access claims."
