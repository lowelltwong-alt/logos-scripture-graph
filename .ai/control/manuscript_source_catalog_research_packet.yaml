      confidence: high
      provenance_note: "Observed on 2026-06-22 from IAA Explore the Archive page."
      review_status: source_catalog_located
    - claim_id: dss_confirmed_003
      claim: "The IAA content page distinguishes biblical compositions from non-biblical compositions and other content families."
      source_ids: [iaa_dss_content_categories]
      method: "Official content page opened; recorded source-family boundary."
      confidence: high
      provenance_note: "Observed on 2026-06-22 from IAA Scrolls Content page."
      review_status: source_catalog_located
    - claim_id: dss_confirmed_004
      claim: "The IAA content page states that DSS biblical compositions contain material now considered part of the Hebrew Bible and that every book except Esther is represented."
      source_ids: [iaa_dss_content_categories]
      method: "Official content page opened; preserved as source-scoped metadata, not canon-scope authority."
      confidence: high
      provenance_note: "Observed on 2026-06-22 from IAA Scrolls Content page."
