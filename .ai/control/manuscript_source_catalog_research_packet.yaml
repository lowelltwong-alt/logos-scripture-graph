    candidate_claim_boundary: "Institutional essays or interpretive claims remain metadata evidence and cannot become apologetic or textual-critical authority."
    routes_elsewhere: "Institutional interpretation, commentary, and reception history route to Boundary Literature when not strictly manuscript metadata."
