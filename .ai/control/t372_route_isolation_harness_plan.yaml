planned_harnesses:
  - harness_id: T372-HARN-001
    title: Parent-only gold scope denial check
    status: planned_for_future_implementation_pr
    purpose: "Fail future implementation if it treats the T371-A parent-only gold as child spans or as an output chunk boundary without T373 owner authorization."
    must_fail_if:
      - selected_children_not_empty_without_owner_authorization
      - parent_span_used_as_chunk_boundary_without_owner_authorization
      - argument_outline_used_as_child_boundary
      - paragraph_marker_used_as_chunk_boundary
  - harness_id: T372-HARN-002
    title: Route activation denial check
    status: planned_for_future_implementation_pr
    purpose: "Fail future implementation if an epistle argument route becomes active before the exact T373 owner authorization exists."
    must_fail_if:
      - route_behavior_changes_without_t373_owner_authorization
      - route_selection_applies_outside_1cor8_10_target
      - candidate_route_becomes_default_or_preferred
  - harness_id: T372-HARN-003
    title: Non-target identity proof
    status: planned_for_future_implementation_pr
    purpose: "Require future output-changing work to prove non-target chunks are byte-identical or explicitly stop."
    required_evidence:
      - baseline_chunk_count
      - baseline_chunk_sha256
      - candidate_chunk_count
      - candidate_chunk_sha256
      - list_of_changed_chunk_ids_or_spans
      - proof_that_changes_are_limited_to_owner_authorized_target
    must_fail_if:
      - non_target_output_diff_detected
      - generated_chunk_surface_missing_identity_report
      - identity_report_omits_baseline_commit_or_sha
  - harness_id: T372-HARN-004
    title: Same-baseline evaluation plan
    status: planned_for_future_implementation_pr
    purpose: "Require future implementation to compare against the same canonical-66 baseline before any improvement claim."
    required_evidence:
      - baseline_variant
      - evaluator_policy
      - baseline_composite_score
      - candidate_composite_score
      - explicit_statement_if_no_improvement_claim_is_made
    must_fail_if:
      - evaluator_formula_changes_inside_implementation_pr
      - improvement_claim_without_same_baseline
      - leaderboard_update_without_owner_authorization
  - harness_id: T372-HARN-005
    title: Source metadata authority denial check
    status: planned_for_future_implementation_pr
    purpose: "Keep internal cross-references, Strong's-style numbers, capitalization, footnotes, WJ markers, and formatting as evidence only."
    must_fail_if:
      - cross_reference_as_graph_edge
      - strong_number_as_lexical_truth
      - capitalization_as_divine_identity
      - footnote_or_variant_as_preferred_reading
      - source_metadata_as_chunk_boundary
  - harness_id: T372-HARN-006
    title: Owner gate check
    status: planned_for_t373_and_future_implementation_pr
    purpose: "Require T373 before any implementation or output-changing PR."
    required_before_t374:
      - exact_owner_implementation_authorization
      - selected_scope
      - whether_parent_span_can_be_output_boundary
      - whether_any_child_spans_are_selected
      - whether_route_behavior_change_is_authorized
      - whether_output_change_is_authorized
    must_fail_if:
      - t374_starts_without_t373_authorization
      - owner_authorization_is_ambiguous
      - authorization_conflicts_with_prior_decisions_for_target_text
t373_owner_gate:
  next_task_id: T373
  owner_decision_required: true
  owner_must_decide_before_any_implementation:
    - whether_to_authorize_exact_output_changing_implementation
    - whether_parent_span_may_be_used_as_output_chunk_boundary
    - whether_child_spans_remain_disallowed_or_are_separately_selected
    - whether_route_behavior_change_is_allowed_for_exact_target_only
