---
object_type: original_language_phrase_context_policy
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-19 during T381 after the maintainer asked whether Greek phrases matter more than isolated words and how to remember that when Greek words are included. Updated during T373 follow-up after the maintainer asked to save broader Greek/Hebrew chunking lessons for future discovery and use."
reason_for_inclusion: "Prevent Greek/Hebrew lemmas, Strong's-style tags, lexical rarity, grammar labels, roots, articles, Hebrew plural forms, LXX/NT quotation patterns, punctuation/capitalization, interlinear glosses, or discourse markers from becoming isolated-word theological authority; require phrase, clause, syntax, discourse, genre, textual, and canonical context in future original-language packets."
---
schema_version: original_language_phrase_context_policy.v1
policy_id: t381_original_language_phrase_context_policy
owner: Lowell Wong
status: active_non_output_changing_policy
research_assessment:
  short_answer: "Directionally true as a warning, but too blunt if stated absolutely."
  refined_rule: "A Greek or Hebrew word is meaningful evidence only inside its phrase, clause, syntax, discourse unit, author/book context, genre, and canonical context."
  why_this_matters: "Isolated word studies, lemma matches, Strong's-style numbers, lexical rarity, and grammar labels can smuggle theological conclusions if future packets do not preserve the phrase and discourse frame."
authority:
  records_original_language_phrase_context_policy: true
  may_surface_original_language_evidence_for_review: true
  authorizes_original_language_truth: false
  authorizes_lexical_truth: false
  authorizes_doctrinal_system: false
  authorizes_translation_preference: false
  authorizes_textual_critical_decision: false
  authorizes_canon_scope_change: false
  authorizes_boundary_import: false
  authorizes_nonorthodox_source_authority: false
  authorizes_extra_canonical_source_authority: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_chunk_output_change: false
scope:
  corpus_scope: canonical_66
  language_scope: [greek, hebrew]
  research_mode: non_output_changing
  relation_to_t359: "Strengthens the source-metadata atlas by requiring phrase/clause/discourse context before Greek/Hebrew word metadata can be used in review packets."
  relation_to_t377: "Strengthens the original-language pressure queue without authorizing source-language truth, translation preference, doctrine, chunk boundaries, graph/retrieval truth, route behavior, or output changes."
  relation_to_t373: "Parallel lesson memory only; does not supersede the T373 owner implementation authorization gate."
context_layers_required:
  - layer_id: surface_word_or_phrase
    required_when: "A packet includes a Greek/Hebrew word, phrase, Strong's-style number, lemma, or lexical rarity observation."
    must_record:
      - exact_surface_word_or_phrase
      - exact_passage_scope
      - source_surface_or_tag_path
    non_authorization: "Surface words and tags are evidence only and do not authorize lexical truth, doctrine, chunk boundaries, graph edges, retrieval truth, or output changes."
  - layer_id: lemma_and_morphology
    required_when: "A packet cites a lemma, parsing, morphology, article use, case, tense/aspect, participle, predicate nominative, construct phrase, or agreement pattern."
    must_record:
      - lemma_or_normalized_form_if_available
      - morphology_or_parsing_if_available
      - grammar_label_source_or_absence
    non_authorization: "Lemma and morphology evidence is evidence only; grammar labels do not by themselves authorize doctrine, graph edges, retrieval truth, chunk boundaries, reviewed gold, or output changes."
  - layer_id: phrase_clause_syntax
    required_when: "A packet uses original-language evidence for any boundary, review-packet, graph, retrieval, or theological-risk discussion."
    must_record:
      - phrase_or_clause_scope
      - syntax_role
      - modifying_or_governing_words
      - whether_the_claim_depends_on_the_phrase_not_only_the_word
    non_authorization: "Phrase and clause context is evidence only and required for review, but it still does not automatically authorize doctrine, graph edges, retrieval truth, chunk boundaries, reviewed gold, or output changes."
  - layer_id: discourse_and_argument_context
    required_when: "A packet touches a theological pressure passage, epistle argument, Gospel discourse, prophetic oracle, Revelation/apocalyptic unit, quotation chain, or difficult passage."
    must_record:
      - immediate_discourse_unit
      - surrounding_argument_or_narrative_flow
      - speaker_or_quotation_frame_if_relevant
      - risk_if_the_word_or_phrase_is_isolated
    non_authorization: "Discourse context is evidence only and protects against isolated proof-texting, but it does not authorize a route, boundary, graph edge, retrieval truth, reviewed gold, or output change."
  - layer_id: canonical_and_orthodox_context
    required_when: "A packet is used near LDS, Watch Tower/New World Translation, anti-Trinitarian, anti-supernatural, canon-sensitive, or liberal-critical pressure."
    must_record:
      - canonical_context_needed_to_avoid_prooftexting
      - orthodox_boundary_considered
      - non_orthodox_or_heterodox_assumptions_refused
      - orthodox_options_preserved
    non_authorization: "Canonical and orthodox context is evidence only and preserves review boundaries without authorizing one denomination's systematic theology as chunk authority."
handling_when_including_greek_words:
  - "Include the exact Greek word or phrase only with its passage scope, phrase/clause scope, and discourse context."
  - "Treat Strong's-style numbers and lemma tags as lookup evidence, not lexical truth or theological identity."
  - "Prefer phrase/clause observations over isolated glosses when a claim depends on syntax or discourse."
  - "Record whether the proposed claim depends on an exact phrase, a grammatical construction, a semantic domain, a discourse unit, or a broader canonical pattern."
  - "Preserve multiple orthodox interpretations when the grammar does not force one conclusion."
  - "Stop for owner review if a Greek/Hebrew observation would affect doctrine, reviewed gold, chunk boundary, route behavior, graph/retrieval truth, or output."
original_language_chunking_lessons:
  - lesson_id: phrase_before_word
    applies_to: [greek, hebrew]
    rule: "Words matter, but a word's review value is governed by phrase, clause, syntax, discourse, genre, author/book, and canonical context."
    use_when: "Any packet cites a Greek or Hebrew word, lemma, gloss, Strong's-style number, morphology, or lexical rarity."
    non_authorization: "An isolated word never authorizes doctrine, chunk boundaries, graph edges, retrieval truth, reviewed gold, route behavior, or output changes."
  - lesson_id: root_fallacy_guard
    applies_to: [greek, hebrew]
    rule: "Do not infer meaning from an etymological root unless the passage itself or governed evidence requires that relationship."
    use_when: "A packet mentions a Hebrew root, Greek root, etymology, name meaning, or family of related words."
    non_authorization: "Root or etymology claims do not authorize theology, intertext links, child spans, or chunk boundaries."
  - lesson_id: semantic_range_not_totality
    applies_to: [greek, hebrew]
    rule: "Record semantic range, but do not import every possible meaning of a word into one occurrence."
    use_when: "A packet lists glosses, semantic domains, lexicon summaries, or alternate translation possibilities."
    non_authorization: "Semantic range does not authorize totality transfer, doctrine selection, or output changes."
  - lesson_id: strongs_and_interlinear_metadata
    applies_to: [greek, hebrew]
    rule: "Strong's-style numbers, interlinear glosses, and lemma tags are lookup metadata; they are not lexical or theological authority."
    use_when: "Source data includes word numbers, interlinear-like glosses, lemma tags, morphology tags, or token alignments."
    non_authorization: "Metadata does not authorize meaning, speaker attribution, intertext truth, graph edges, child spans, or chunks."
  - lesson_id: grammar_labels_need_review
    applies_to: [greek, hebrew]
    rule: "Grammar labels matter, but case, article, tense/aspect, voice, mood, stem, construct, or agreement claims must be reviewed inside the phrase and discourse."
    use_when: "A packet cites Greek article use, predicate nominative, participle, genitive, tense/aspect, Hebrew stem, construct phrase, waw, or agreement."
    non_authorization: "A grammar label alone cannot authorize doctrine, boundary changes, route behavior, graph/retrieval truth, or output."
  - lesson_id: greek_article_predication_guard
    applies_to: [greek]
    rule: "Greek article presence or absence can matter, but it must be reviewed with syntax, predicate structure, discourse, and orthodox/canonical context."
    use_when: "A packet touches John 1:1-style or other article/predication pressure passages."
    non_authorization: "Article presence or absence does not authorize an automatic doctrinal rule or chunk boundary."
  - lesson_id: hebrew_plural_form_guard
    applies_to: [hebrew]
    rule: "Hebrew plural forms, divine names, and 'let us' language can be important evidence, but must be reviewed with grammar, context, and orthodox/canonical constraints."
    use_when: "A packet touches Elohim, divine plurality language, divine council language, plural pronouns, or anti-Trinitarian pressure passages."
    non_authorization: "A plural form alone is not automatic Trinity proof, anti-Trinity proof, graph truth, or chunk authority."
  - lesson_id: lxx_nt_quotation_guard
    applies_to: [greek, hebrew]
    rule: "New Testament use of the Old Testament may quote Hebrew, LXX, paraphrase, summarize, or allude; exact wording is evidence but not the only canonical connection."
    use_when: "A packet touches OT-in-NT quotation chains, fulfillment language, allusions, or intertext links."
    non_authorization: "LXX wording, exact-match absence, or editorial cross-reference cannot automatically authorize graph edges, fulfillment claims, or chunk boundaries."
  - lesson_id: textual_variant_gate
    applies_to: [greek, hebrew]
    rule: "If an original-language observation depends on a textual variant, source tradition, or disputed reading, it must stop for the textual-critical case policy."
    use_when: "A packet touches variant-sensitive readings, source-tradition differences, MT/LXX/DSS issues, or Greek textual-family differences."
    non_authorization: "Original-language evidence does not authorize silently choosing a preferred reading, source tradition, canon scope, reviewed gold, or output."
  - lesson_id: punctuation_capitalization_editorial_guard
    applies_to: [greek, hebrew]
    rule: "Modern punctuation, quotation marks, paragraphing, headings, and capitalization are translation/editorial evidence, not original-language authority."
    use_when: "A packet depends on punctuation, red letters, section headings, paragraph marks, capitalization, or quotation boundaries."
    non_authorization: "Editorial formatting does not authorize speaker boundaries, divine identity, chunk boundaries, graph truth, or output changes."
  - lesson_id: discourse_markers_and_poetry_need_context
    applies_to: [greek, hebrew]
    rule: "Conjunctions, particles, vocatives, imperatives, rhetorical questions, Hebrew clause chains, parallelism, refrains, inclusio, and acrostics can inform review only inside discourse and genre."
    use_when: "A packet uses discourse markers, Hebrew narrative connectors, poetic parallelism, inclusio, refrain, acrostic, or argument transitions."
    non_authorization: "A marker or poetic feature alone cannot authorize a chunk boundary, child span, route behavior, or output."
  - lesson_id: pressure_passage_extra_review
    applies_to: [greek, hebrew]
    rule: "Original-language pressure passages used by non-orthodox systems require extra grammar, phrase, discourse, textual, canonical, and orthodox review."
    use_when: "A packet touches John 1:1, Col 1:15-20, Heb 1, Gen 1:26, Isa 43-44, Ps 110, Dan 7, or similar LDS/Watch Tower/NWT/anti-Trinitarian pressure texts."
    non_authorization: "Pressure-passage review protects orthodoxy but does not authorize one denomination's systematic theology as chunk authority."
