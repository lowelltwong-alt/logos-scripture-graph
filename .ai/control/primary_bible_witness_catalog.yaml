  - data/candidate/source_catalog/primary_bible_witnesses/witness_passage_coverage.jsonl
  - data/candidate/source_catalog/primary_bible_witnesses/permission_request_queue.yaml
  - data/candidate/source_catalog/primary_bible_witnesses/removal_plan.yaml
  - data/candidate/source_catalog/primary_bible_witnesses/wave_0a_existing_source_inventory.yaml
