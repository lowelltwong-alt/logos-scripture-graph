variant_sensitive_trigger_examples:
  - passage: 1Cor.9.20
    surface: footnote
    issue: "NU addition note: though I myself am not under the law."
    t371_relevance: "Inside the proposed parent span; parent-boundary promotion must prove it does not depend on this wording or must wait."
  - passage: 1Cor.10.9
    surface: footnote
    issue: "NU reading note: the Lord instead of Christ."
    t371_relevance: "Inside the proposed parent span and potentially Christological; graph, retrieval, boundary, and reviewed-gold use must not imply a preferred reading."
owner_options:
  - option_id: TCP-T378-A
    title: Current canonical source only until case policy
    summary: "Use the current canonical eng-web source as the working data witness for non-variant-dependent chunk boundaries, while treating variant notes as evidence only and stopping before any variant-dependent promotion."
    upside: "Keeps work moving where boundaries do not depend on a variant and avoids importing external textual traditions."
    downside: "Could be overread as silently privileging the current source unless validators require variant-non-dependency proof."
    downstream_effect_if_selected: "T371 could proceed only if the parent-boundary promotion records that the 1Cor.8.1-1Cor.10.33 boundary does not depend on the 1Cor.9.20 or 1Cor.10.9 readings."
    non_authorizations: [preferred_reading, source_tradition_preference, canon_scope_change, graph_edge, retrieval_truth, output_change]
  - option_id: TCP-T378-B
    title: Case-by-case owner policy before each variant-sensitive promotion
    summary: "Require every variant-sensitive packet to record exact variants, prove whether the boundary or reviewed-gold claim depends on them, and receive owner confirmation before promotion."
    upside: "Most conservative while still allowing faithful progress; it refuses hidden source-tradition preference, liberal-critical default, and automatic current-source authority."
    downside: "Adds an owner gate for each variant-sensitive packet and may slow future work."
    downstream_effect_if_selected: "T371 could proceed only after an owner note records that the parent-only boundary is variant-non-dependent, or else the packet remains held."
    recommended_by_agent: true
    recommendation_rationale: "This best preserves canonical Scripture authority, textual humility, and orthodox boundaries without smuggling a current-source, denominational, or critical-text default."
    non_authorizations: [preferred_reading, source_tradition_preference, canon_scope_change, graph_edge, retrieval_truth, output_change]
  - option_id: TCP-T378-C
    title: Formal global textual policy before any variant-sensitive promotion
    summary: "Stop all variant-sensitive promotion until a later formal project-level textual policy chooses how to handle source traditions across the whole canon."
    upside: "Strong consistency and maximum auditability before any variant-sensitive gold is created."
    downside: "Likely stalls chunking and risks turning textual tradition selection into a broader denominational or scholarly-policy fight before boundary work can continue."
    downstream_effect_if_selected: "T371 remains blocked until that formal policy exists."
    non_authorizations: [preferred_reading_until_later_policy, canon_scope_change, graph_edge, retrieval_truth, output_change]
  - option_id: TCP-T378-D
    title: Hold all variant-sensitive packets
    summary: "Do not promote, implement, graph, retrieve, or use any packet containing a variant-sensitive verse until original-language and textual-critical research is complete."
    upside: "Maximum fail-closed safety."
    downside: "Blocks many important passages even when the proposed boundary does not depend on the variant."
    downstream_effect_if_selected: "T371 is held; agents must choose a non-variant-sensitive target or continue research only."
    non_authorizations: [reviewed_gold_promotion, implementation, graph_edge, retrieval_truth, output_change]
recommended_owner_path:
  option_id: TCP-T378-B
  recommendation: "Select case-by-case owner policy before each variant-sensitive promotion."
  why_more_faithful: "It protects canonical Scripture from hidden source-tradition preference and liberal-critical assumptions while avoiding a new denominational textual policy as chunk authority. It also lets non-variant-dependent boundaries move only after explicit owner confirmation."
minimum_future_policy_if_selected:
  - exact_variant_sensitive_refs
