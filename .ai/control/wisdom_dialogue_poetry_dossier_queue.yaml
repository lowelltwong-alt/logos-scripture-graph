object_type: wisdom_dialogue_poetry_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T364 as non-output-changing research prep after T363 narrative/legal covenant dossiers."
reason_for_inclusion: "Give future wisdom, dialogue, poetry, acrostic, speaker-boundary, graph, retrieval, review-packet, evaluator, and chunking agents a first-class dossier queue so poetic structure, dialogue cycles, refrains, speakers, and acrostics remain visible without becoming wisdom theology, speaker authority, reviewed gold, or chunk-boundary authority."
schema_version: wisdom_dialogue_poetry_dossier_queue.v1
queue_id: t364_wisdom_dialogue_poetry_dossier_queue
owner: Lowell Wong
authority:
  records_wisdom_dialogue_poetry_dossier_queue: true
  records_poetic_boundary_risks: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_wisdom_theology: false
  authorizes_speaker_attribution: false
  authorizes_speaker_boundary: false
  authorizes_liturgical_use: false
  authorizes_allegorical_or_literal_reading: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_boundary_import: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  lanes: [wisdom_dialogue, poetry_parallelism_stanza]
  research_mode: non_output_changing
  relation_to_t358: "Companion dossier queue for the poetry_parallelism_stanza dimension and wisdom/dialogue book lanes in the Bible-wide research registry."
  relation_to_t359: "Uses source metadata as evidence only; does not turn headings, poetry markers, acrostic formatting, cross-references, paragraph markers, or speaker labels into Scripture, graph, retrieval, or boundary authority."
  relation_to_t363: "Complements narrative/legal dossiers by covering poetic dialogue, wisdom argument, acrostic, and speaker-sensitive lyric structures without authorizing system selection."
preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to encode a disputed wisdom theology, theodicy system, allegorical/literal Song reading, speaker assignment, liturgical use, or poetic structure as a chunking default."
  preserved_review_options:
    - local_poem_review
    - parent_cycle_review
    - parent_with_child_stanza_review
    - dialogue_speech_cycle_review
    - acrostic_review
    - refrain_review
    - speaker_boundary_review
    - wisdom_argument_review
    - lament_unit_review
  not_selected_by_queue:
    - Job theodicy system
    - Song allegorical or literal-only reading
    - Song speaker assignment
    - Ecclesiastes pessimistic or optimistic frame
    - Proverbs wisdom taxonomy
    - Psalm liturgical use
    - acrostic-as-boundary rule
    - refrain-as-boundary rule
    - wisdom theology system
evidence_channels:
  - channel_id: poetic_parallelism
    use_when: "Parallel lines, couplets, triplets, or stanza-like structures appear relevant."
    non_authorization: "Poetic parallelism is evidence only and does not authorize chunk boundaries, wisdom theology, graph edges, retrieval truth, or output changes."
  - channel_id: dialogue_speech_frame
    use_when: "Dialogue cycles, speeches, replies, or narrator frames structure a wisdom or poetic book."
    non_authorization: "Dialogue frames are evidence only and do not authorize speaker attribution, speaker boundaries, reviewed gold, route behavior, or chunk boundaries."
  - channel_id: acrostic_or_alphabetic_structure
    use_when: "A passage has acrostic or alphabetic structure."
    non_authorization: "Acrostic structure is evidence only and does not authorize a chunk boundary rule, graph edge, retrieval truth, or output changes."
  - channel_id: refrain_or_repeated_formula
    use_when: "Repeated refrains, catchwords, mottoes, or formulae shape a unit."
    non_authorization: "Refrains and repeated formulae are evidence only and do not authorize theology, reviewed gold, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: wisdom_argument_review
    use_when: "A wisdom book or poem develops an argument through observations, instructions, objections, refrains, or frame statements."
    non_authorization: "Wisdom argument flow is evidence only and does not authorize wisdom theology, book-frame selection, graph edges, retrieval truth, reviewed gold, chunk boundaries, or output changes."
  - channel_id: speaker_label_or_voice_shift
    use_when: "Speaker labels, voice shifts, implied speakers, or lyric addressees may affect review."
    non_authorization: "Speaker labels and voice shifts are evidence only and do not authorize speaker attribution, speaker boundaries, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: source_metadata_formatting
    use_when: "Headings, paragraphing, poetry markers, cross-references, footnotes, punctuation, or formatting make a boundary seem obvious."
    non_authorization: "Source metadata and formatting are evidence only and do not authorize Scripture truth, speaker attribution, graph edges, retrieval truth, reviewed gold, chunk boundaries, or output changes."
  - channel_id: canonical_sequence_and_collection_context
    use_when: "Collection order, poem sequence, superscription-like material, or book-level composition affects review."
    non_authorization: "Canonical sequence and collection context are evidence only and do not authorize composition theory, liturgical use, retrieval truth, or chunk boundaries."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - primary_lane
  - evidence_channels
  - boundary_questions
  - review_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
dossier_queue:
  - dossier_id: JOB_DIALOGUE_CYCLES_AND_DIVINE_SPEECHES
    title: Job dialogue cycles and divine speeches
    status: research_packet_pending
    priority: 1
    exact_passage_scope: [Job.3-Job.42]
    primary_lane: wisdom_dialogue
    evidence_channels: [dialogue_speech_frame, poetic_parallelism, speaker_label_or_voice_shift, source_metadata_formatting]
    boundary_questions:
      - "How should Job's dialogue cycles, Elihu speeches, divine speeches, and restoration frame be reviewed without selecting a theodicy system?"
      - "Where do speaker turns need review before any child boundaries are trusted?"
    review_options_preserved: [dialogue_speech_cycle_review, parent_cycle_review, parent_with_child_stanza_review, speaker_boundary_review]
    theological_downstream_risks:
      - "Boundaries can bias theodicy, suffering, divine sovereignty, wisdom, righteousness, and speech-authority readings."
      - "Speaker labels can become retrieval truth before review."
    assumptions_avoided:
      - "No Job theodicy system is selected."
      - "No speaker cycle becomes reviewed gold."
      - "No divine speech child-boundary scheme is approved."
    reviewed_gold_dependency: "Requires future review packet, owner review, exact selected spans, reviewed gold or equivalent governed evidence, non-target identity proof, graph and retrieval denial checks, route denial checks, and validators/tests before output changes."
    non_authorizations: [speaker_attribution, speaker_boundary, chunk_boundary, reviewed_gold, output_change, route_behavior, graph_edge, retrieval_truth, wisdom_theology_system]
    validator_or_test_plan: "Future packet must preserve speaker-turn evidence and theodicy non-authorization."
    non_target_identity_plan: "Before implementation, compare all non-target Job and monolith fallback outputs for unchanged identity."
