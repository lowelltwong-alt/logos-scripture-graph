      wj_inventory_case: john3_wj_speaker_boundary
      wj_word_token_refs_count: 17
    evidence_channels: [wj_red_letter_metadata, speaker_formula_and_narrative_frame, discourse_connector_and_scene_flow, paragraph_heading_or_formatting_metadata]
    speaker_or_discourse_questions:
      - "Should John.3.1-John.3.36 be reviewed as a parent unit without deciding internal child spans?"
      - "Should John.3.9-John.3.21 be Jesus speech, narrator commentary, or unresolved for chunking?"
    review_options_preserved: [jesus_speech, narrator_commentary, unresolved_for_chunking, parent_only_discourse_review, parent_with_child_discourse_review]
    theological_downstream_risks:
      - "WJ markup can silently decide the disputed John 3 Jesus/narrator boundary."
      - "A child-boundary label can affect Christology, regeneration, judgment, and faith language retrieval."
    assumptions_avoided:
      - "No John 3 speaker boundary is selected."
      - "No parent or child span is approved."
      - "No WJ marker is treated as Jesus speaker authority."
    reviewed_gold_dependency: "Requires owner selection, human review, reviewed speaker/discourse gold or equivalent governed evidence, graph and retrieval denial checks, route denial checks, and non-target identity proof before output changes."
    non_authorizations: [speaker_attribution, speaker_boundary, discourse_boundary, reviewed_gold, chunk_boundary, route_behavior, graph_edge, retrieval_truth, output_change]
    validator_or_test_plan: "Keep John 3 owner-selection pending and fail if the docket or packet becomes authorizing without later owner review."
