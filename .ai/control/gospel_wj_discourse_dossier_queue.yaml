object_type: gospel_wj_discourse_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T362 as non-output-changing research prep after T354 WJ marker inventory, T355 WJ policy, T356 John 3 docket, and T361 epistle issue dossiers."
reason_for_inclusion: "Give future Gospel discourse, WJ/red-letter, speaker-boundary, graph, retrieval, review-packet, evaluator, and chunking agents a first-class dossier queue so red-letter/source metadata remains review evidence without becoming Jesus speaker attribution, discourse boundaries, reviewed gold, or chunk authority."
schema_version: gospel_wj_discourse_dossier_queue.v1
queue_id: t362_gospel_wj_discourse_dossier_queue
owner: Lowell Wong
authority:
  records_gospel_wj_dossier_queue: true
  records_wj_discourse_risks: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_jesus_speaker_attribution: false
  authorizes_speaker_boundary: false
  authorizes_discourse_boundary: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_boundary_import: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  lane: gospel_discourse_wj
  research_mode: non_output_changing
  relation_to_t354: "Companion dossier queue for the WJ marker inventory; observed WJ token runs are evidence only."
  relation_to_t355: "Companion dossier queue for the WJ speaker/discourse policy; it expands candidate targets without selecting speaker or discourse boundaries."
  relation_to_t356: "John 3 remains owner_selection_pending and is not promoted by this queue."
  relation_to_t358: "Companion dossier queue for the gospel_discourse_speaker_wj dimension of the Bible-wide research registry."
  relation_to_t360: "Olivet and Revelation WJ cases must preserve apocalyptic/prophetic hermeneutic neutrality and cannot import Revelation implementation authority."
observed_wj_metadata:
  source_inventory: .ai/control/wj_marker_inventory.yaml
  wj_word_tokens: 38094
  wj_token_runs: 675
  books_with_wj: [Matt, Mark, Luke, John, Acts, 1Cor, 2Cor, 1Tim, Rev]
  books_outside_four_gospels_with_wj: [Acts, 1Cor, 2Cor, 1Tim, Rev]
  warning: "WJ/red-letter source metadata is sparse and edition-scoped evidence only; presence is not Jesus speaker authority and absence is not narrator or non-Jesus authority."
existing_packet_state:
  packet_index: eval/chunking_gold/review_packets/review_packet_index.json
  required_pending_packets:
    - entry_id: packet_john3_wj_speaker_boundary_review
      case_id: john3_wj_speaker_boundary
      passage: John.3
    - entry_id: packet_matt5_7_wj_discourse_review
      case_id: matt5_7_sermon_on_mount_wj_discourse
      passage: Matt.5-Matt.7
    - entry_id: packet_john7_53_8_11_textual_variant_review
      case_id: john7_53_8_11_pericope_adulterae
      passage: John.7.53-John.8.11
  required_policy_cases:
    - entry_id: observed_john13_17_wj_farewell_discourse_marker_focus
      case_id: john13_17_wj_farewell_discourse_marker_focus
      status: speaker_review_required
    - entry_id: observed_synoptic_apocalyptic_wj_discourses
      case_id: synoptic_apocalyptic_wj_discourses
      status: speaker_review_required
wj_discourse_preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to infer speaker identity, discourse boundaries, Christological claims, or eschatological systems from red-letter/source metadata alone."
  preserved_review_options:
    - jesus_speech
    - narrator_commentary
    - unresolved_for_chunking
    - parent_only_discourse_review
    - parent_with_child_discourse_review
    - variant_policy_first
    - revelation_research_first
    - synoptic_parallel_review
    - dominical_quotation_review
  not_selected_by_queue:
    - John 3 Jesus/narrator boundary
    - Sermon on the Mount child boundaries
    - Farewell Discourse child boundaries
    - Olivet Discourse eschatological system
    - Pericope Adulterae textual-variant policy
    - Revelation voice identity
    - Acts or epistle dominical quotation authority
evidence_channels:
  - channel_id: wj_red_letter_metadata
    use_when: "A token run carries WJ/red-letter source metadata."
    non_authorization: "WJ/red-letter metadata is evidence only and does not authorize Jesus speaker attribution, speaker boundaries, discourse boundaries, chunk boundaries, graph edges, retrieval truth, or output changes."
  - channel_id: speaker_formula_and_narrative_frame
    use_when: "Canonical speaker formula, narrative frame, or quotation frame may identify who speaks."
    non_authorization: "Speaker formulas and narrative frame are evidence only until reviewed; they do not authorize route behavior, graph edges, reviewed gold, or output changes."
  - channel_id: discourse_connector_and_scene_flow
    use_when: "A Gospel discourse spans scenes, paragraphs, chapters, or teaching blocks."
    non_authorization: "Discourse flow is evidence only and does not authorize chunk boundaries, discourse boundaries, or reviewed gold."
  - channel_id: paragraph_heading_or_formatting_metadata
    use_when: "Paragraphing, headings, quotation marks, punctuation, or layout may affect perceived discourse boundaries."
    non_authorization: "Formatting metadata is evidence only and does not authorize speaker attribution, discourse boundaries, chunk boundaries, graph edges, or output changes."
  - channel_id: textual_variant_policy
    use_when: "WJ evidence occurs in a textual-variant-sensitive passage."
    non_authorization: "Variant-sensitive WJ evidence is evidence only and cannot authorize canonical preference, speaker boundaries, chunk boundaries, or output changes before variant policy review."
  - channel_id: synoptic_parallel_or_intertext_context
    use_when: "Parallel Gospel accounts, Olivet discourse links, or Revelation/apocalyptic voice-shift questions affect review."
    non_authorization: "Parallel or intertext context is evidence only and does not authorize harmonization, eschatological system selection, graph edges, retrieval truth, or chunk boundaries."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - existing_review_dependency
  - source_metadata_observed
  - evidence_channels
  - speaker_or_discourse_questions
  - review_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
dossier_queue:
