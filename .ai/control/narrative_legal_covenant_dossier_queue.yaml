    title: Genesis 1-11 primeval narrative and genealogy units
    status: research_packet_pending
    priority: 1
    exact_passage_scope: [Gen.1-Gen.11]
    primary_lane: narrative_pericope
    evidence_channels: [narrative_scene_markers, genealogy_list_formula, theological_motif_repetition, source_metadata_formatting]
    boundary_questions:
      - "How should creation, fall, flood, Babel, and genealogy units be reviewed without choosing a theology of origins or covenant continuity claim?"
      - "Where do genealogies function as list units versus narrative transitions?"
    review_options_preserved: [local_scene_review, parent_cycle_review, genealogy_or_list_review]
    theological_downstream_risks:
      - "Boundaries can bias creation theology, human nature, judgment, covenant, genealogy, and promise themes."
      - "A single parent/child scheme can overstate narrative causality or systematize early Genesis."
    assumptions_avoided:
      - "No creation-days or origins framework is selected."
      - "No genealogy unit becomes identity hierarchy or covenant-status authority."
      - "No source metadata heading becomes chunk-boundary authority."
    reviewed_gold_dependency: "Requires future review packet, owner review, exact selected spans, reviewed gold or equivalent governed evidence, non-target identity proof, graph and retrieval denial checks, route denial checks, and validators/tests before output changes."
    non_authorizations: [chunk_boundary, reviewed_gold, output_change, route_behavior, graph_edge, retrieval_truth, covenant_system_selection, typology, source_metadata_authority]
    validator_or_test_plan: "Future packet must keep origins, genealogy, and covenant assumptions explicit and non-authorizing."
    non_target_identity_plan: "Before implementation, compare all non-target Genesis and monolith fallback outputs for unchanged identity."
