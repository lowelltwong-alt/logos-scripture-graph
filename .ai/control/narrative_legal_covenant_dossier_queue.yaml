object_type: narrative_legal_covenant_dossier_queue
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-18 during T363 as non-output-changing research prep after T358 Bible-wide research registry and T362 Gospel/WJ discourse dossiers."
reason_for_inclusion: "Give future narrative, legal, covenant, genealogy/list, royal-annal, restoration-document, graph, retrieval, review-packet, evaluator, and chunking agents a first-class dossier queue so scene, law, covenant, list, document, and formula evidence remains visible without becoming covenant theology, typology, reviewed gold, or chunk-boundary authority."
schema_version: narrative_legal_covenant_dossier_queue.v1
queue_id: t363_narrative_legal_covenant_dossier_queue
owner: Lowell Wong
authority:
  records_narrative_legal_dossier_queue: true
  records_covenant_boundary_risks: true
  may_surface_for_review: true
  requires_owner_review_before_output: true
  authorizes_scripture_truth: false
  authorizes_covenant_theology: false
  authorizes_law_gospel_framework: false
  authorizes_typology: false
  authorizes_harmonization: false
  authorizes_source_critical_partition: false
  authorizes_chunk_boundaries: false
  authorizes_reviewed_gold: false
  authorizes_output_change: false
  authorizes_route_behavior: false
  authorizes_evaluator_change: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_source_metadata_truth: false
  authorizes_boundary_import: false
  authorizes_new_algorithm_work: false
scope:
  corpus_scope: canonical_66
  lanes: [narrative_pericope, legal_covenant_formulae]
  research_mode: non_output_changing
  relation_to_t358: "Companion dossier queue for the narrative_scene_pericope and legal_covenant_formulae dimensions of the Bible-wide research registry."
  relation_to_t359: "Uses source metadata as evidence only; does not turn headings, cross-references, Strong's-style numbers, paragraph markers, lists, or formatting into Scripture, covenant, graph, retrieval, or boundary authority."
  relation_to_t362: "Complements Gospel/WJ discourse dossiers by covering non-WJ narrative scenes, genealogies, and covenant/legal structures without authorizing Gospel harmonization or speaker boundaries."
preservation_policy:
  orthodox_boundary: "Use Nicene/Chalcedonian core as the broad orthodoxy boundary while refusing to encode a disputed covenant system, law/gospel framework, typological fulfillment claim, source-critical partition, chronology harmonization, or narrative causality claim as a chunking default."
  preserved_review_options:
    - local_scene_review
    - parent_cycle_review
    - parent_with_child_scene_review
    - genealogy_or_list_review
    - law_code_unit_review
    - covenant_speech_review
    - ritual_instruction_review
    - royal_annal_formula_review
    - embedded_document_or_decree_review
    - gospel_narrative_scene_review
  not_selected_by_queue:
    - covenant theology system
    - dispensational system
    - law/gospel framework
    - typological fulfillment boundary
    - source-critical composition theory
    - chronology harmonization
    - genealogy theological hierarchy
    - royal annal theological verdict
    - land promise fulfillment system
    - restoration identity boundary
evidence_channels:
  - channel_id: narrative_scene_markers
    use_when: "A passage moves through setting, action, travel, conflict, resolution, or episode boundaries."
    non_authorization: "Narrative scene evidence is evidence only and does not authorize chunk boundaries, causality claims, graph edges, retrieval truth, or output changes."
  - channel_id: speech_and_dialogue_frame
    use_when: "A narrative unit includes speeches, dialogue turns, prayer, blessing, curse, or covenant address."
    non_authorization: "Speech and dialogue frames are evidence only and do not authorize speaker boundaries, discourse boundaries, chunk boundaries, route behavior, or reviewed gold."
  - channel_id: genealogy_list_formula
    use_when: "A passage is structured by genealogy, census, allotment, name list, office list, or tribal/household formula."
    non_authorization: "Genealogy and list formulas are evidence only and do not authorize identity hierarchy, covenant status, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: legal_covenant_formula
    use_when: "A passage uses law-code, covenant, blessing/curse, stipulation, case-law, or treaty-like formulae."
    non_authorization: "Legal and covenant formulas are evidence only and do not authorize law/gospel conclusions, covenant system selection, typology, reviewed gold, or chunk boundaries."
  - channel_id: ritual_instruction_sequence
    use_when: "A passage contains sacrifice, purity, priesthood, tabernacle, temple, feast, or worship instructions."
    non_authorization: "Ritual instruction sequence is evidence only and does not authorize fulfillment claims, sacramental theology, graph edges, retrieval truth, or chunk boundaries."
  - channel_id: royal_annal_or_regnal_formula
    use_when: "A passage uses reign summaries, succession formulas, royal evaluation, temple/kingship frames, or prophetic court episodes."
    non_authorization: "Royal and regnal formulas are evidence only and do not authorize monarchy theology, covenant verdicts, chronology harmonization, graph edges, or chunk boundaries."
  - channel_id: embedded_document_or_decree
    use_when: "A narrative contains letters, decrees, lists, prayers, covenant renewals, memoir material, or official documents."
    non_authorization: "Embedded documents are evidence only and do not authorize document-source partition, boundary import, historical reconstruction, graph edges, or output changes."
  - channel_id: source_metadata_formatting
    use_when: "Headings, paragraphing, poetry markers, cross-references, footnotes, or formatting make a boundary seem obvious."
    non_authorization: "Source metadata and formatting are evidence only and do not authorize Scripture truth, graph edges, retrieval truth, reviewed gold, chunk boundaries, or output changes."
  - channel_id: canonical_sequence_and_parallel_accounts
    use_when: "Parallel accounts, repeated scenes, repeated laws, or canonical sequence may influence review."
    non_authorization: "Parallel accounts and canonical sequence are evidence only and do not authorize harmonization, contradiction resolution, typology, graph truth, or chunk boundaries."
  - channel_id: theological_motif_repetition
    use_when: "Motifs such as promise, blessing, land, exile, temple, priesthood, kingdom, remnant, creation, or covenant recur."
    non_authorization: "Repeated motifs are evidence only and do not authorize theological system selection, retrieval truth, graph edges, or chunk boundaries."
required_future_dossier_fields:
  - dossier_id
  - title
  - status
  - priority
  - exact_passage_scope
  - primary_lane
  - evidence_channels
  - boundary_questions
  - review_options_preserved
  - theological_downstream_risks
  - assumptions_avoided
  - reviewed_gold_dependency
  - non_authorizations
  - validator_or_test_plan
  - non_target_identity_plan
dossier_queue:
