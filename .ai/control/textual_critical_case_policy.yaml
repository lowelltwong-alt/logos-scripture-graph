  authorized_at: "2026-06-19"
  exact_authorization: "Authorize TCP-T378-B: case-by-case owner policy before each variant-sensitive promotion. Future variant-sensitive reviewed-gold promotion must record exact variants, boundary dependency or non-dependency, reviewed-gold dependency or non-dependency, owner confirmation, decision-register update, and validators/tests. This does not authorize preferred readings, source-tradition preference, canon-scope change, graph/retrieval truth, route/evaluator behavior, chunk output, or implementation."
authority:
