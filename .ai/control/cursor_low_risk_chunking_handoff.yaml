algorithms:
  preflight_algorithm:
    - run /chunking-preflight in Cursor Plan mode.
    - read every mandatory file listed in this contract.
    - record branch, base commit, target candidate id, target span, and requested outputs.
    - load .ai/control/test_runtime_preflight.yaml and choose recorded ceilings before long validation.
  eligibility_algorithm:
    - locate the target in .ai/control/whole_bible_low_complexity_chunking_candidate_queue.yaml.
    - require status ready_for_review_packet.
    - require an exact owner-or-Codex supplied target; Cursor must not choose from the queue.
    - reject every disallowed status or flag before any write.
    - confirm source metadata is evidence only and cannot become boundary, graph, retrieval, or theology authority.
  baseline_algorithm:
    - capture the current git commit and changed-file list.
    - if output simulation is explicitly authorized by a later task, regenerate baseline only under ignored build space and record hashes.
    - otherwise do not create, edit, or commit generated chunk output.
  candidate_prep_algorithm:
    - preserve raw, canonical, processed, derived, eval-gold, route, evaluator, registry, and retrieval files unchanged.
    - produce only review-only notes, candidate metrics, or a handoff in allowed task paths.
    - keep route metadata out of chunk records.
    - keep source metadata, Strong's tags, WJ markers, speaker labels, headings, footnotes, cross-references, and alternate readings as evidence only.
  route_isolation_algorithm:
    - use scripts/chunking/route_isolation_harness.py only for read-only proof or later explicitly authorized candidate-output simulation.
    - prove non-target byte identity before any future output-changing proposal can be reviewed.
    - fail on child spans, adjacent spillover, duplicate ids, non-target drift, or report-shape gaps.
  review_handoff_algorithm:
    - run /codex-review-packet in Cursor Agent mode only after focused validation.
    - list files read, files changed, commands run, validations, target id/span, hashes if any, stop conditions checked, and exact Codex questions.
