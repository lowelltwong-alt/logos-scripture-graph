object_type: chunking_lesson_index
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-20 during T382 after the maintainer asked whether lessons learned are always saved into the appropriate preflight and whether there should be a tagged lesson table-of-contents/graph. Updated 2026-06-21 during T376 to add the research-autonomy-not-authority-autonomy lesson."
