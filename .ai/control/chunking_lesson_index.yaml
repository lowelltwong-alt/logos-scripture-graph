update_policy:
  status: required
  rule: "Every reusable chunking, source-metadata, theological-risk, workflow, validator, audit, or agent-handoff lesson must either update this index and the appropriate preflight/workflow/register surface, or the task handoff must record an explicit no-change rationale."
  required_action_before_task_close:
    - update_chunking_lesson_index_if_lesson_relationship_or_tags_change
    - update_preflight_if_future_agents_must_read_it_first
    - update_decision_register_if_it_has_possible_theological_downstream_effect
    - update_validator_or_test_if_machine_checkable
    - record_no_change_rationale_in_handoff_if_no_surface_changed
  changed_path_gate_enabled: true
  update_required_when_paths_change:
    - .ai/control/chunking_agent_preflight.yaml
    - docs/methodology/WORKFLOW_LESSONS.md
    - docs/methodology/LOGOS_CHUNKING_WORKFLOW_RULES_REGISTRY.md
    - docs/methodology/CHUNKING_SKILL_SUPPLY_CHAIN.md
    - .ai/control/chunking_theological_decision_register.yaml
    - .ai/control/bible_chunking_readiness_map.yaml
    - .ai/control/*_dossier_queue.yaml
    - .ai/control/*_policy*.yaml
    - .ai/control/*_inventory.yaml
    - .ai/control/*_review*.yaml
    - .ai/audits/reports/
    - AI_TABLE_OF_CONTENTS.md
    - docs/roadmap/AI_ROADMAP_TABLE_OF_CONTENTS.md
  validator: scripts/validate_chunking_lesson_index.py
category_taxonomy:
  - category_id: source_metadata
    use_when: "Source formatting, internal cross-references, Strong's-style tags, red-letter/WJ markers, headings, footnotes, or capitalization appear relevant."
  - category_id: original_language
    use_when: "Greek/Hebrew words, lemmas, morphology, grammar labels, roots, LXX/NT quotation links, or phrase/context claims are used."
  - category_id: theological_risk
    use_when: "A lesson could affect doctrine-facing boundaries, speaker attribution, intertexts, eschatology, canon/source-tradition, or theology-risk review."
  - category_id: owner_decision
    use_when: "A prior owner pattern, new owner gate, option/repercussion presentation, or conflict stop may control the next step."
  - category_id: auditability
    use_when: "A no-context reviewer, red-team agent, A/B checker, or future maintainer needs to reconstruct why a change happened."
  - category_id: workflow_governance
    use_when: "A lesson affects preflight, midflight, postflight, handoff, validator, TOC, task scope, or methodology behavior."
  - category_id: graph_retrieval_vector
    use_when: "Work could create graph edges, retrieval truth, vector/embedding output, or allow evidence labels to become truth-bearing."
  - category_id: contextual_reading
    use_when: "A passage, verse, phrase, review packet, boundary, intertext, historical background note, or source-metadata observation needs local, book, canonical, language, or historical context."
