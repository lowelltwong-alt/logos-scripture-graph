source_trust_rules:
  - rule_id: official_holding_institution_over_secondary
    rule: "Prefer official holding-institution catalog metadata over secondary summaries when they conflict, while preserving the conflict and source of each claim."
  - rule_id: catalog_identifier_required
    rule: "No witness row may be populated without a catalog identifier, shelfmark, siglum, or source-system identifier plus source URL."
  - rule_id: date_range_not_point_date
    rule: "Dates must be stored as ranges with precision, method, basis, confidence, and dissent; no exact date is inferred from a century label."
  - rule_id: coverage_claim_requires_source_scope
    rule: "Coverage claims require scoped book/passage fields and a source reference; never infer coverage from the witness label alone."
  - rule_id: conflicting_catalog_claims_preserved
    rule: "Conflicting catalog claims remain separate rows until reviewed; do not silently merge to the most apologetically useful claim."
  - rule_id: no_transcription_text
    rule: "No manuscript transcription, Bible text, creed wording, or quotation text is stored in this metadata plan."
  - rule_id: no_preferred_reading_from_catalog
    rule: "Catalog metadata, witness age, or copy abundance cannot select a preferred reading or source-tradition priority."
  - rule_id: rights_status_before_ingest
    rule: "Future population must record rights/access status before storing images, derived metadata, or source excerpts beyond minimal citation metadata."
  - rule_id: biblical_dss_only_in_scripture_graph
    rule: "Only biblical DSS witness metadata may be planned here; non-biblical Qumran/DSS content routes to Boundary Literature."
anti_guessing_rules:
  - "Do not claim oldest, earliest, complete, unchanged, original, or reliable without a source, scope, method, confidence, dissent check, and review status."
  - "Do not infer date, language, script, material, coverage, location, or shelfmark from model memory."
  - "Do not turn copy abundance into proof without recording variant units, witness distribution, and unresolved variation."
  - "Do not turn discovery timing into apologetic victory; record what became knowable and what still required publication, collation, or review."
  - "Do not store Scripture text, manuscript transcription, patristic quotation text, creed wording, commentary text, or theologian writing in this plan."
  - "Do not mix boundary/commentary/theologian data into scripture_* tables or any canonical_* table/view."
  - "Do not use a source catalog to authorize graph edges, retrieval truth, vector truth, chunk output, reviewed gold, preferred readings, source-tradition priority, canon-scope changes, or apologetic conclusions as truth."
review_status_values:
  - unreviewed_candidate
  - source_catalog_located
  - holding_institution_confirmed
  - rights_reviewed
  - metadata_reviewed
  - method_reviewed
  - owner_review_required
  - deprecated
future_goal_prompts:
  - goal_id: T391_DSS_BIBLICAL_SOURCE_CATALOG_POPULATION
    prompt: "In logos-scripture-graph, start from live origin/main and read AI_FRONT_DOOR, MASTER_CONTEXT read-only, PROJECT_STATUS, DATA_MAP, T387 scaffold, and T390 source catalog plan. Create the first metadata-only SQLite/source rows for biblical DSS witnesses from official DSS/Israel Museum source catalogs. No transcription text, non-biblical Qumran content, preferred readings, graph edges, chunks, vectors, or apologetic conclusions may be stored or authorized. Add validation proving every row has source URL, provenance, date range, confidence, and review status."
  - goal_id: T392_NT_PAPYRI_AND_MAJOR_CODICES_SOURCE_CATALOG_POPULATION
    prompt: "In logos-scripture-graph, after T391 or with a separate clean branch, populate metadata-only source catalog rows for NT papyri and major codices from INTF/NTVMR, CSNTM, holding institutions, and official codex projects. Preserve conflicting date/coverage claims as separate sourced rows. Do not import manuscript text or select preferred readings."
  - goal_id: T393_VARIANT_AND_COPY_ABUNDANCE_METHOD_PROFILE
    prompt: "Build evidence_source_catalog_method_profile records that explain what copy abundance, variant detection, witness distribution, and catalog coverage can and cannot prove. Keep the work evidence-only and non-authorizing for textual-critical decisions, source-tradition preference, canon scope, graph, retrieval, vectors, chunks, and apologetic conclusions."
  - goal_id: T394_DISCOVERY_TIMELINE_WHAT_WAS_KNOWN_WHEN
    prompt: "Build a discovery/publication/digitization timeline for DSS and NT manuscript witnesses showing what became knowable when, what remained uncertain, and which debates were affected. Use source-catalog metadata only and do not treat discovery timing as proof."
  - goal_id: BOUNDARY_PATRISTIC_RECEPTION_RECONSTRUCTION
    prompt: "In logos-boundary-literature, create the church fathers/commentary/reception source plan for patristic citations and reconstruction evidence. Store Scripture references only, not Scripture text. Require trust level, tradition/profile scope, source/provenance, attribution/forgery status, confidence, and review status. Join to Scripture Graph only through labeled evidence_* derived reports."
  - goal_id: DOCTRINE_GENEALOGY_THEOLOGIAN_LINEAGE
    prompt: "In future logos-doctrine-genealogy, create the theologian and denomination lineage plan consuming Scripture references from Scripture Graph and reception references from Boundary Literature. Track who built on whom, where traditions align or diverge, and scope every claim by tradition/profile."
