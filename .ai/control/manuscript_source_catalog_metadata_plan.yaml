object_type: manuscript_source_catalog_metadata_plan
trust_zone: canonical
lifecycle_status: active
provenance_note: "Created 2026-06-22 during T390 as the Scripture Graph source-catalog metadata plan following the T387 manuscript witness reliability scaffold."
reason_for_inclusion: "Define the SQLite-ready source catalog metadata plan for biblical DSS witnesses, New Testament papyri, major codices, variants, discovery timeline, provenance, confidence, and review status before any manuscript text import or database population occurs."
schema_version: manuscript_source_catalog_metadata_plan.v1
plan_id: t390_manuscript_source_catalog_metadata_plan
task_id: T390
owner: Lowell Wong
status: active_planning_only
authority:
  records_source_catalog_metadata_plan: true
  refines_t387_scaffold: true
  may_define_sqlite_table_candidates: true
  may_define_source_trust_rules: true
  may_define_future_population_goals: true
  authorizes_sqlite_database_creation: false
  authorizes_metadata_row_population: false
  authorizes_source_text_import: false
  authorizes_transcription_storage: false
  authorizes_canonical_bible_text_change: false
  authorizes_canonical_passage_record_change: false
  authorizes_chunk_output_change: false
  authorizes_reviewed_gold_promotion: false
  authorizes_textual_critical_decision: false
  authorizes_preferred_reading: false
  authorizes_source_tradition_preference: false
  authorizes_canon_scope_change: false
  authorizes_boundary_import: false
  authorizes_commentary_or_patristic_import: false
  authorizes_doctrine_genealogy_import: false
  authorizes_graph_edges: false
  authorizes_retrieval_truth: false
  authorizes_embedding_or_vector_work: false
  authorizes_doctrinal_system: false
  authorizes_apologetic_conclusion_as_truth: false
placement_decision:
  owning_repo: logos-scripture-graph
  repo_scope: "Canonical Scripture manuscript source-catalog metadata only: biblical DSS witnesses, New Testament papyri, major codices, holding institutions, catalog identifiers, date claims, material claims, coverage claims, discovery timeline, source trust, provenance, confidence, and review status."
  boundary_repo_scope: "Church fathers, patristic citations, commentaries, theologian writings, reception history, early creed wording, non-biblical Qumran/DSS texts, and noncanonical corpus content route to logos-boundary-literature."
  doctrine_repo_scope: "Who built theology on whose ideas, denominational development, doctrinal alignment/divergence, and theologian lineage route to future logos-doctrine-genealogy."
  governance_repo_scope: "Cross-repo authority, trust-zone changes, repository registry changes, and routing policy changes remain in logos-governance-architecture."
  split_rule: "Store Scripture references and source catalog metadata here; never store commentary, patristic, theologian, creed, non-biblical Qumran, or doctrine-lineage content in Scripture Graph canonical records."
  implementation_mode: planning_only_no_database_no_import
data_boundary:
  allowed_prefixes:
    - scripture_
    - evidence_
  forbidden_prefixes:
    - canonical_
    - boundary_
    - doctrine_
  forbidden_table_or_view_rule: "Never create a canonical_* table or view that includes manuscript reliability, commentary, patristic, theologian, doctrine, or boundary data."
  unified_report_rule: "Unified apologetic or research reports may use evidence_* derived joins only when every source row remains labeled by namespace, source repo, trust level, provenance, confidence, and review status."
sqlite_entity_plan:
  tables:
    - table_name: scripture_source_catalog
      purpose: "Catalog official digital libraries, manuscript catalogs, holding-institution catalogs, source projects, and method-profile sources before any witness row is trusted."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - catalog_id
        - catalog_name
        - source_family
        - authority_tier
        - maintainer_or_institution
        - base_url
        - access_model
        - rights_statement
        - citation_policy
        - last_checked_date
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_holding_institution
      purpose: "Record the institution or collection that holds or publishes the witness metadata without duplicating source text."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - institution_id
        - institution_name
        - country_or_region
        - collection_name
        - official_catalog_url
        - shelfmark_policy
        - rights_contact
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_catalog_witness_record
      purpose: "Represent a catalog's record for a biblical witness, including identifiers and source URL, before creating any harmonized witness identity."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - catalog_record_id
        - catalog_id
        - witness_id_candidate
        - siglum
        - alternate_identifiers
        - shelfmark
        - holding_institution_id
        - source_url
        - record_accessed_at
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_witness_identifier
      purpose: "Preserve multiple sigla, Gregory-Aland numbers, DSS designations, shelfmarks, and project IDs as identifiers with source scope, not as merged facts by default."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - identifier_id
        - witness_id_candidate
        - identifier_value
        - identifier_system
        - identifier_scope
        - source_catalog_ref
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_witness_date_claim
      purpose: "Store sourced date ranges, dating methods, precision, and dissent without converting a range into a false exact date."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - date_claim_id
        - witness_id_candidate
        - date_earliest
        - date_latest
        - date_display
        - dating_method
        - dating_basis
        - date_precision
        - dissenting_date_note
        - source_ref
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_witness_material_claim
      purpose: "Store language, script, material, format, and physical description as sourced catalog claims."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - material_claim_id
        - witness_id_candidate
        - language
        - script
        - material
        - format
        - physical_description_summary
        - source_ref
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_witness_coverage_claim
      purpose: "Store what biblical books/passages a witness is said to cover while preserving claim precision and avoiding stored transcriptions."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - coverage_claim_id
        - witness_id_candidate
        - scripture_scope_type
        - osis_scope
        - book_scope
        - chapter_verse_scope
        - coverage_precision
        - coverage_source_ref
        - stores_text
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: scripture_witness_discovery_event
      purpose: "Record discovery, publication, cataloging, digitization, image access, or scholarly-access events with what became knowable and what remained uncertain."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - event_id
        - event_date_earliest
        - event_date_latest
        - event_type
        - witness_or_catalog_ref
        - what_became_known
        - what_remained_unknown
        - reliability_relevance_scope
        - source_ref
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: evidence_source_catalog_method_profile
      purpose: "Explain what a catalog or method source can and cannot prove for reliability, copy abundance, variants, dating, and discovery timeline claims."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - method_profile_id
        - source_family
        - method_scope
        - proves
        - does_not_prove
        - required_cross_checks
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: evidence_source_trust_rule
      purpose: "Make source-ranking and conflict-handling rules queryable so future population does not depend on memory or vibes."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - trust_rule_id
        - applies_to_source_family
        - rule
        - failure_mode
        - required_action
        - source_url
        - provenance_note
        - confidence
        - review_status
    - table_name: evidence_catalog_review_queue
      purpose: "Track which witness groups are ready for metadata population and which still need source, rights, method, or owner review."
      stores_scripture_text: false
      stores_transcription_text: false
      stores_boundary_text: false
      required_fields:
        - queue_id
        - witness_group
        - source_family
        - priority
        - blocker
        - required_reviewer
        - next_action
        - source_url
        - provenance_note
        - confidence
        - review_status
source_families:
  - family_id: dss_biblical_witness_catalogs
    correct_repo: logos-scripture-graph
    allowed_scope: "Biblical DSS/Judean Desert witness catalog metadata only."
    routes_elsewhere: "Non-biblical Qumran/DSS community texts, sectarian texts, parabiblical texts, and reception interpretation route to logos-boundary-literature."
  - family_id: nt_manuscript_catalogs
    correct_repo: logos-scripture-graph
    allowed_scope: "Greek New Testament papyri, majuscules, minuscules, lectionaries, catalog identifiers, images/access metadata, date ranges, materials, and coverage metadata."
    routes_elsewhere: "Patristic citation reconstruction, commentary, and reception evidence route to logos-boundary-literature."
  - family_id: major_codex_project_catalogs
    correct_repo: logos-scripture-graph
    allowed_scope: "Major codex catalog and holding-institution metadata such as Sinaiticus, Vaticanus, and Alexandrinus."
    routes_elsewhere: "Theological reception, doctrinal use, and church-history commentary route outside this repo."
  - family_id: holding_institution_catalogs
    correct_repo: logos-scripture-graph
    allowed_scope: "Shelfmarks, repositories, collection records, image/access rights, and catalog provenance."
    routes_elsewhere: "Institutional essays, interpretive commentary, and secondary apologetic claims remain evidence only or route to Boundary Literature."
  - family_id: critical_apparatus_method_profiles
    correct_repo: logos-scripture-graph
    allowed_scope: "Method profiles for catalog coverage, collation, variant detection, and what witness distribution can or cannot prove."
    routes_elsewhere: "Preferred-reading decisions, edition selection, and source-tradition preference require later owner review and may not be decided by this plan."
