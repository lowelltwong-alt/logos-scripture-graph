  rust_continuation_gate:
    default: python_only
    outcomes: [python_only, reuse_existing_rust_leaf, hold_and_defer_rust]
    new_rust_or_dependency_in_T475: forbidden
    correctness_required: [explicit_python_oracle, full_parity_green, fail_closed_exit, deterministic_repeated_runs, no_authority_leakage]
    balanced_value_requires_one:
      - reproducible_wall_clock_or_memory_improvement
      - simpler_or_safer_deployment
      - stronger_fail_closed_correctness
      - better_failure_isolation_and_diagnostics
      - materially_lower_repeated_compute_cost
    benchmark:
      pinned_inputs: true
      repetitions_minimum: 3
      median_reported: true
      environment_recorded: true
      warmup_policy_recorded: true
    performance_alone_may_advance: false
    independent_audit_required: true
  quality_first_context_policy:
    priority: [correctness, completeness, independence, reproducibility, latency, token_cost]
    minimum_sufficient_context_per_role: true
    silent_sampling_or_truncation: forbidden
    summaries_do_not_replace_machine_readable_ledgers: true
    context_pressure_action: checkpoint_artifacts_then_resume_or_hold
    token_exhaustion_may_produce_pass: false
  independent_audit:
    roster_alias: Claude
    prompt: .ai/prompts/t475_independent_audit_prompt.md
    separate_invocation_and_context: true
    frozen_inputs_only: true
    blind_until_first_verdict: [working_notes, prior_verdicts, reconciliation_commentary]
    may_edit_or_regenerate: false
    findings_require_new_revision_and_new_audit: true
    verdicts: [PASS, HOLD_WITH_FINDINGS, ESCALATE_OWNER]
