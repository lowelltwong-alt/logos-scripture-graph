  expected_input_size_or_record_count: "Two importer revisions over the canonical 66 WEB corpus; approximately 847,000 JSONL rows and 700 MB per shadow output family."
  expected_runtime_or_memory_pressure: "High sequential I/O with bounded per-file streaming; repeated trials require a long ceiling but must not retain all trial roots."
  rust_trigger_match: [high_resource_deterministic_jsonl_scan, parity_measurement_before_any_new_rust_buildout]
  chosen_language: defer_rust_until_measurement
  expected_rust_time_saved_or_reason_not_applicable: "Unknown until T475 measures exact file families and comparison cost. Existing Rust validators may be reused, but no new Rust or dependency is allowed in this evidence task."
  interop_boundary: "Python owns source snapshot orchestration and semantic delta evidence; existing Rust validators remain optional leaf checks behind Python wrappers."
  python_fallback_or_wrapper_plan: "The T475 comparison is a streaming Python oracle. Any later Rust accelerator must reproduce its manifests and verdicts exactly."
  maintenance_tradeoffs: "A one-task Python oracle avoids building a premature Rust keyed-delta engine while producing the measurements needed for a balanced continuation decision."
  validation_plan: "Run overlay and T475 validators, focused tests, three pinned shadow trials, task scope, handoffs, validate_all with at least 900000 ms, full pytest with the recorded long ceiling, data-map check, and diff check."
acceptance_criteria:
  - "Sol, Terra, Luna, and Claude are task-local aliases only; durable model routing remains vendor- and model-agnostic."
  - "Terra and Luna cannot resolve architecture or semantic ambiguity; Sol cannot self-certify the independent audit."
  - "Pre-T474 and T474 importer revisions run against identical pinned raw/config inputs in distinct ignored roots."
  - "At least three measured trials record deterministic output manifests, medians, environment, and warmup policy."
  - "Every importer output has byte, row-count, whole-file hash, and stable-key delta evidence without exposing Scripture text."
  - "Witness, token, USFM-event, boundary-claim, section-heading, and downstream input-impact deltas are separately visible."
  - "No chunker is run and no chunk output is emitted; only affected refs and input-hash impact are reported."
  - "No committed data, reviewed gold, route/evaluator behavior, graph/retrieval/vector truth, canon, source tradition, or theology authority changes."
  - "Independent audit is required before T475 can claim evidence ready for T476."
  - "CI candidate regeneration must match all frozen stable-key semantic digests before exactly seven pre-T474 generated-baseline validators may be deferred."
