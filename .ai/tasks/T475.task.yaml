  authority:
    architecture_owner: [freeze_inputs, define_acceptance, reconcile_or_hold, recommend_T476]
    shadow_regenerator_and_parity_specialist: [write_ignored_shadow_roots, emit_run_and_parity_manifests, record_performance_and_deployment_evidence]
    bounded_delta_verifier: [read_frozen_roots, emit_exact_inventory, challenge_manifest, escalate_ambiguity]
