  expected_input_size_or_record_count: Small synthetic fixtures and metadata-only benchmark or source manifests; no manuscript or benchmark payload processing is authorized.
  expected_runtime_or_memory_pressure: Candidate validation should complete in seconds. A future full InduOCR run would exceed 800 MB compressed and must receive a separate measured execution design.
  rust_trigger_match:
    - future_large_benchmark_scan
    - future_high_volume_character_comparison
  chosen_language: python_only_below_threshold
  expected_rust_time_saved_or_reason_not_applicable: Python matches the bounded orchestration and validation work. A streaming or Rust worker must be evaluated before any authorized full battery if profiling shows a material hot path.
  interop_boundary: Provider-neutral Python contracts emit deterministic JSON manifests and review artifacts; OCR engines and benchmark evaluators remain replaceable runtime adapters.
  python_fallback_or_wrapper_plan: Python is the reference control plane. Expensive benchmark execution may be delegated to Cursor, local scripts, or a lower-cost worker without changing authority contracts.
  validation_plan: Synthetic Unicode and routing fixtures, negative authority tests, focused pytest, aggregate validation, and independent read-only review.
  maintenance_tradeoffs: A small dependency-light package is portable and inspectable; engine binaries, models, datasets, and source images remain external and separately governed.
