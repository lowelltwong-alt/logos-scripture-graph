acceptance_criteria:
  - "Every emitted line-marker event receives an explicit anchor kind, anchor ref, neighboring refs, body disposition, and resolved flag."
  - "Empty paragraph/poetry/list starts bind to the following verse while body-bearing content lines remain on the active verse."
  - "Descriptive/section headings and speaker labels are editorial-only and cannot enter TranslationWitness text or canonical WordTokens."
  - "Blank-line and no-break markers preserve prior/next relations; terminal blank lines retain a null next ref without guessing."
  - "Inline qs/Selah remains inline content and never becomes a line-level BoundaryClaim."
  - "Unknown or malformed marker ownership emits unresolved/null anchor evidence and performs no canonical text/token mutation."
  - "Schema additions remain optional until owner-approved generated-data migration."
