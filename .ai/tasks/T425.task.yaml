  task_kind: non_authorizing_validation_hardening
  hardens_dad_lesson_slot_references: true
  hardens_dad_context_map_references: true
  enforces_runtime_language_preflight_for_future_heavy_tasks: true
  keeps_python_pytest_as_governance_orchestrator: true
  adds_rust_validator_behavior: false
  cursor_may_select_target: false
  promotes_reviewed_gold: false
  implements_chunk_output: false
  adds_child_spans: false
  changes_route_behavior: false
  changes_evaluator_behavior: false
  creates_graph_or_retrieval_truth: false
  runs_embeddings_or_builds_indexes: false
  imports_boundary_material: false
  chooses_backend: false
  promotes_retrieval_profile: false
  selects_preferred_reading_or_source_tradition: false
  changes_canon_scope: false
  authorizes_source_or_manuscript_rows: false
  authorizes_theology_authority: false
runtime_language_preflight:
  task_id: T425
  touched_paths:
    - scripts/validate_dad_outbox.py
    - scripts/validate_task_scope.py
    - scripts/validate_coding_runtime_language_preflight.py
    - tests/test_dad_outbox.py
    - tests/test_task_scope_validator.py
    - tests/test_coding_runtime_language_preflight.py
  expected_input_size_or_record_count: "Small control-plane files and test fixtures; no large corpus scan."
  expected_runtime_or_memory_pressure: "Below Rust thresholds; focused validators run in seconds."
  rust_trigger_match:
    - repeated_gate_or_ci_hot_path
  chosen_language: python_only_due_to_semantic_policy_complexity
  expected_rust_time_saved_or_reason_not_applicable: "No meaningful Rust speedup expected because this slice validates YAML/JSON governance semantics and task contracts rather than streaming large data."
  interop_boundary: "Python remains the governance/task/DAD validator; Rust fast validators remain deterministic leaf tools from T424."
  python_fallback_or_wrapper_plan: "Not applicable; no Rust leaf worker is added in T425."
  validation_plan:
    - python scripts/validate_dad_outbox.py
    - python scripts/validate_coding_runtime_language_preflight.py
    - python scripts/validate_task_scope.py --task-id T425
    - python -m pytest tests/test_dad_outbox.py tests/test_task_scope_validator.py tests/test_coding_runtime_language_preflight.py -q
    - python scripts/validate_all.py
  maintenance_tradeoffs: "Centralizing the preflight enforcement in validate_task_scope.py prevents future heavy validators from bypassing Rust consideration while avoiding a Rust rewrite of policy-heavy control-plane checks."
deliverables:
  dad_context_map: .digital-asset/context-map.json
  dad_lesson_slots:
    - .digital-asset/lessons/t423_multi_model_whole_bible_chunking_fork.yaml
    - .digital-asset/lessons/t424_rust_validation_layer.yaml
    - .digital-asset/lessons/t425_dad_lesson_slot_integrity.yaml
  dad_outbox_validator: scripts/validate_dad_outbox.py
  task_scope_runtime_preflight_gate: scripts/validate_task_scope.py
  coding_runtime_preflight_validator: scripts/validate_coding_runtime_language_preflight.py
  handoff: .ai/handoffs/T425/handoff.md
acceptance_criteria:
  - "DAD outbox rows with lesson_learned_slot fail if the local lesson slot is missing, unsafe, stale, or authority-leaking."
  - "DAD outbox rows with context_map_entry fail if the local context-map entry is missing, stale, or authority-leaking."
  - "Post-T424 task contracts that edit validator/scanner/Rust/hot-path surfaces fail without runtime_language_preflight."
  - "T425 records DAD candidate-only lesson/context slots without granting DAD authority over local governance."
  - "No chunk output, reviewed gold, child spans, route/evaluator behavior, graph/retrieval/vector truth, source rows, canon changes, or theology authority are authorized."
validations:
  - python scripts/validate_dad_outbox.py
  - python scripts/validate_coding_runtime_language_preflight.py
  - python scripts/validate_task_scope.py --task-id T425
  - python scripts/agent/validate_handoffs.py
  - python -m pytest tests/test_dad_outbox.py tests/test_task_scope_validator.py tests/test_coding_runtime_language_preflight.py -q
  - python scripts/validate_all.py
  - python -m pytest -q
  - python scripts/generate_data_map.py --check
  - git diff --check
handoff_required: .ai/handoffs/T425/handoff.md
