acceptance_criteria:
  - "T410 defines a nine-step research-to-output ladder from Cursor research through post-pilot review."
  - "Phase 1 completion is deterministic across all 66 canonical books as implemented, pending, or deferred."
  - "Cursor prompt packs require audit logs, source-size manifests, confidence registers, claim traceability, and cursor_notes_to_codex.md."
  - "T410 defines one-task/one-branch/one-worktree safety, clean-status preflight, merge-state preflight, cross-task artifact stop conditions, and serialized shared control-file edits."
  - "T410 includes a live parallel-execution safety validator that can require a clean task branch before Cursor starts and can allow only current-task scoped dirty paths while Codex is editing."
  - "T410 defines machine-readable validation tiers for research, control-plane/schema, data-pipeline, output-changing, and merge/release work."
  - "Book/literature hints cover all 66 canonical books and are explicit routing hints, not memory or boundary authority."
  - "Frontier escalation is mandatory for prophecy, apocalyptic, dense epistle argument, WJ/speaker boundaries, textual variants, doxologies, doctrinal pressure, and low confidence."
  - "No chunk output, reviewed gold, child spans, route/evaluator behavior, graph/retrieval/vector truth, embeddings/indexes, backend/profile choices, source rows, canon changes, or theology authority are authorized by T410."
validations:
