  python_fallback_or_wrapper_plan: "No Rust wrapper is introduced."
  maintenance_tradeoffs: "Keeping this in Python keeps theological, textual-critical, and research-transparency guardrails readable to future agents."
  validation_plan: "Run validate_t470_transparent_chunking_research_evidence_rubric.py, focused pytest, task scope, handoffs, decision register, lesson index, validate_all.py, full pytest, data-map check, and git diff --check."
acceptance_criteria:
  - "Well-supported and debated chunking research claims are separated in a machine-validated rubric."
  - "Every recorded claim names how the conclusion was reached, source references, downstream chunking implications, and limits."
  - "Model agreement, discourse analysis, editorial markers, textual variants, and faithfulness principles are all labeled with their proper support level."
  - "WindowDiff or near-boundary comparison is recorded as a recommended improvement before over-escalating every exact-boundary mismatch."
  - "No T470 artifact authorizes target selection, reviewed gold, chunk output, child spans, route/evaluator behavior, graph/retrieval/vector truth, canon change, source-tradition preference, variant/inspiration decision, DAD reporting success gate, or theology authority."
validations:
