runtime_language_preflight:
  task_id: T462
  touched_paths:
    - tools/logos_fast_validators/
  expected_input_size_or_record_count: "The target is the existing Rust fast-validator crate for large deterministic JSONL/corpus/chunk-map checks that can hit hundreds of thousands of rows in normal repo use."
  expected_runtime_or_memory_pressure: "Combined deterministic validation should be fast without becoming opaque; the work is specifically to keep Rust hot-path checks modular and diagnosable."
  rust_trigger_match:
    - large_jsonl_scan
    - repeated_gate_or_ci_hot_path
    - deterministic_streaming_parse_hash_or_compare
    - rust_validator_modularity_hardening
  chosen_language: rust_fast_path_with_python_wrapper
  expected_rust_time_saved_or_reason_not_applicable: "Rust is already the selected fast path for these deterministic validators; this task improves maintainability and failure locality without moving governance semantics into Rust."
  interop_boundary: "Rust emits non-authorizing CheckReport and JSON summaries. Python wrappers remain stable repo entry points and preserve fallback/parity orchestration."
  python_fallback_or_wrapper_plan: "Existing Python wrappers are preserved. The new bundle command is not wired into validate_all.py until a separate lifecycle/parity decision authorizes it."
  validation_plan:
    - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
    - python -m pytest tests/test_t424_rust_fast_validators.py -q
    - python scripts/validate_dad_outbox.py
    - python scripts/validate_task_scope.py --task-id T462
    - python scripts/agent/validate_handoffs.py
    - git diff --check
  maintenance_tradeoffs: "The split keeps a temporary legacy.rs compatibility module; future tasks should migrate internals into named modules one validator at a time while preserving wrapper behavior."
acceptance_criteria:
  - "main.rs only parses command arguments and dispatches to modules."
  - "Each Rust validator command has a named module exposing run_check(input) -> CheckReport."
  - "The bundle command emits one aggregate summary while preserving per-check names, timings, and failure messages."
  - "Existing Python wrapper ergonomics and command names remain stable."
  - "DAD receives a candidate-only reusable lesson/asset report."
  - "No output, reviewed gold, child spans, route/evaluator, graph/retrieval/vector, canon, source-tradition, or theology authority is created."
validations:
  - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
  - python -m pytest tests/test_t424_rust_fast_validators.py -q
  - python scripts/validate_dad_outbox.py
  - python scripts/validate_task_scope.py --task-id T462
  - python scripts/agent/validate_handoffs.py
  - git diff --check
