  authorizes_theology_authority: false
deliverables:
  rust_cli: tools/logos_fast_validators/
  jsonl_wrapper: scripts/validate_fast_jsonl.py
  canonical_scope_wrapper: scripts/validate_fast_canonical_scope.py
  validate_all_integration: scripts/validate_all.py
  roadmap_doc: docs/roadmap/T424_RUST_ACCELERATED_VALIDATION_LAYER.md
  tests:
    - tests/test_t424_rust_fast_validators.py
  handoff: .ai/handoffs/T424/handoff.md
acceptance_criteria:
  - "Rust `jsonl-scan` matches the existing validate_jsonl.py contract on focused fixtures."
  - "Rust `canonical-scope` matches validate_canonical_66_scope.py verdicts on focused fixtures."
  - "Python wrappers expose explicit Rust requirement, Python fallback, and parity-check modes."
  - "validate_all.py uses the wrappers only for proven deterministic data scans; semantic canonical QA remains Python."
  - "No reviewed gold, chunk output, child spans, route/evaluator behavior, graph/retrieval/vector truth, source rows, canon-scope change, or theology authority are authorized."
validations:
  - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
  - python scripts/validate_fast_jsonl.py --require-rust --compare-python --require-canon <fixture>
  - python scripts/validate_fast_canonical_scope.py --require-rust --compare-python <fixture>
  - python -m pytest tests/test_t424_rust_fast_validators.py -q
  - python scripts/validate_task_scope.py --task-id T424
  - python scripts/agent/validate_handoffs.py
  - python scripts/validate_all.py
  - python -m pytest -q
