acceptance_criteria:
  - A new contributor can distinguish the project mission, repository family, current capabilities, planned capabilities, and authority boundaries from the first entry page.
  - The entry surface states that the present MCP contract is local, stdio, and read-only; remote MCP and write tools are not implemented or enabled.
  - Release Bronze, Silver, and Gold are defined separately from reviewed-gold chunk evidence.
  - M7, M8, and PR 194 are identified as research candidates with explicit publication boundaries; M7/M8 content convergence waits for M8 completion.
  - M7 documentation identifies the recorded Sol control/campaign roles, specialist packs, all-66-book strategy coverage, case-by-case review mesh, evidence graph, and same-model independence limitation.
  - Blind Sol design A and B reports plus their architecture-convergence record are committed as public, privacy-safe evidence without claiming provider diversity or M7/M8 convergence.
  - Required validation, task-scope, handoff, privacy, and independent-review gates pass before publication.
