acceptance_criteria:
  - "run_command fails closed (returncode 127) with the message 'command not found: <tool>' when git/gh is missing, instead of raising an uncaught traceback; text and JSON reports stay clean and the exit code is nonzero."
  - "--skip-pytest is surfaced explicitly: the text report prints 'pytest: SKIPPED via --skip-pytest' plus a WARNING, and the JSON report carries pytest_skipped: true, so a PASS verdict cannot silently hide that the test gate was not run."
  - "--next-task detection prefers exact .ai/tasks/<id>.task.yaml, .ai/handoffs/<id>/handoff.md, and roadmap-state id matches, falls back to token-bounded prose mentions (T340 must not match T340B), reports found/ambiguous/not_found, never changes the verdict, and never authorizes implementation."
  - "Behavioral tests simulate missing gh/git, unmerged PR, unreachable expected commit, dirty working tree, failing validation command, missing merge commit, skipped pytest, and next-task status taxonomy, asserting FAIL verdict and nonzero exit where applicable."
  - "Workflow doc and templates state the hardened behavior: visible skip, fail-closed missing tools, report-only next-task detection, and that verification PASS does not authorize the next task."
  - "No public flag or output behavior is removed; the verification model is not weakened, only hardened."
  - "No raw/canonical/generated/chunk/evaluator/leaderboard/scorecard/boundary-import/T327G/Revelation-implementation/skill-lifecycle work occurs."
