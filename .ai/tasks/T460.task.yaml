runtime_language_preflight:
  task_id: T460
  touched_paths:
    - tools/logos_fast_validators/
    - scripts/validate_test_runtime_preflight.py
    - scripts/validate_fast_canonical_qa.py
    - scripts/validate_ai_agnostic_rust_subagents.py
    - scripts/validate_fast_word_token_signals.py
    - scripts/validate_validation_gate_lifecycle.py
    - scripts/validate_all.py
  expected_input_size_or_record_count: "Mixed stack: small control-plane policy files plus Rust leaf validators for large canonical QA and word-token evidence-signal scans."
  expected_runtime_or_memory_pressure: "The stack adds two deterministic Rust-backed hot-path validators while keeping semantic governance checks in Python."
  rust_trigger_match:
    - large_jsonl_scan
    - repeated_gate_or_ci_hot_path
    - deterministic_streaming_parse_hash_or_compare
    - python_rust_parity_or_shadow_mode
  chosen_language: python_orchestration_with_rust_leaf_worker
  expected_rust_time_saved_or_reason_not_applicable: "Rust handles high-volume canonical and word-token scans; Python remains the integration, DAD, task-scope, and governance orchestrator."
  interop_boundary: "T460 does not add a new Rust authority layer. It integrates prior Rust leaf validators and routes validate_all to the explicit integration task scope."
  python_fallback_or_wrapper_plan: "Existing wrappers keep --python-fallback, --require-rust, and compare modes. Rust validation failures do not silently fall back to Python."
  validation_plan:
    - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
    - python scripts/validate_dad_outbox.py
    - python scripts/validate_test_runtime_preflight.py
    - python scripts/validate_ai_agnostic_rust_subagents.py
    - python scripts/validate_validation_gate_lifecycle.py
    - python scripts/validate_fast_canonical_qa.py --python-fallback
    - python scripts/validate_fast_word_token_signals.py --python-fallback <word_tokens-if-present>
    - python scripts/validate_task_scope.py --task-id T460
    - python scripts/agent/validate_handoffs.py
    - python scripts/validate_all.py
  maintenance_tradeoffs: "The integration task adds one validate_all routing helper for explicit stacked-task integration branches. Individual task scopes remain strict."
