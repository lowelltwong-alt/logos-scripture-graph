  reason: "This is a semantic pilot over three verses; Rust should follow after the Hebrew row contract is proven."
acceptance_criteria:
  - "UXLC and OSHB Jonah source-view observations cover 48 verses each and 688 token-shape rows each without storing Hebrew wording."
  - "UXLC/OSHB per-verse refs and token counts match while exact token hashes may differ by source formatting."
  - "OSHB morphology and lemma attributes are counted by presence/hash only; values are not stored and do not authorize Strong's, lexical truth, or production lemma rows."
  - "The OSHB lemma-attribute flag drift is recorded and blocks Rust expansion until fixed or explicitly policy-covered."
  - "Editorial/metadata rows label chaptering, versification, maqqef, sof-pasuq, vowel/accent presence, notes, and nested-token edge cases as source-view/editorial evidence, not autograph certainty."
  - "Production candidate roots remain unopened until a later owner-gated population task."
  - "No Rust scanner expansion occurs until T436 semantics and metadata-flag drift are reviewed."
