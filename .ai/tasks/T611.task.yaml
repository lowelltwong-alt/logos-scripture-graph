summary: >-
  Publish a small, honest, metadata-only M7 candidate surface from immutable Git
  objects. Preserve the Sol role architecture, book strategies, evidence graph,
  learning-loop failures, holds, appeals, dissent, and exact content hashes while
  withholding bulky payloads that lack file-level privacy and license clearance.
