runtime_language_preflight:
  task_id: T611
  touched_paths:
    - scripts/build_candidate_publication.py
    - scripts/validate_candidate_publication.py
    - scripts/validate_all.py
    - tests/test_candidate_publication.py
    - tests/fixtures/scripture_first_biblical_chunking_family/negative/release.owner_ready_fake_validation.json
  expected_input_size_or_record_count: "279 immutable metadata pointers plus a 1,178-row candidate-map count check."
  expected_runtime_or_memory_pressure: "Low for focused checks; repository-wide gates retain their recorded long timeout."
  rust_trigger_match:
    - none_bounded_metadata_and_hashing
  chosen_language: python_only_below_threshold
  expected_rust_time_saved_or_reason_not_applicable: "No meaningful Rust saving is expected at this bounded size; a second implementation would add more verification and maintenance cost than runtime benefit."
  interop_boundary: "Python reads immutable Git objects and validates JSON. No source payload is copied into the package."
  python_fallback_or_wrapper_plan: "Python is the primary deterministic implementation; no Rust worker or fallback is required."
  maintenance_tradeoffs: "The small Python implementation keeps the publication contract auditable while binding all mutable state to commit, tree, blob, and SHA-256 identifiers."
  validation_plan:
    - python scripts/validate_candidate_publication.py
    - python -m pytest -q tests/test_candidate_publication.py
    - python scripts/validate_task_scope.py --task-id T611
    - python scripts/validate_all.py
    - python -m pytest -q
acceptance_criteria:
  - The publication is reconstructed only from immutable M7 commit eaf31a940d3166b49c38ca26eb279392e0a3b25b.
  - Book-strategy coverage, candidate-map coverage, corrective rereview, replay qualification, and release qualification are reported separately.
  - The public surface documents Sol roles, formal specialist packs, campaign roles and aliases without overstating model independence.
  - Job is a detailed held example and Psalm defects, repairs, appeals, and active holds remain visible.
  - The generated package contains metadata, hashes, and documentation only, with zero selected M7 payload bytes.
  - M8 is not accessed or modified and M7/M8 comparison remains blocked on a separately frozen M8 publication.
  - Focused, aggregate, handoff, task-scope, privacy, and independent-review gates pass before GitHub publication.
validation:
  - python scripts/validate_candidate_publication.py
  - python -m pytest -q tests/test_candidate_publication.py
  - python scripts/validate_task_scope.py --task-id T611
  - python scripts/agent/validate_handoffs.py
  - python scripts/validate_all.py
  - python -m pytest -q
