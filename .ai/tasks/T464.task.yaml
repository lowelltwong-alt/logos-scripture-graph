  expected_runtime_or_memory_pressure: "The full comparison is a long offline Python orchestration pass; routine validation should check generated artifacts and focused invariants rather than rerun every expensive compare."
  rust_trigger_match:
    - deterministic large JSONL scanning
    - canonical span/ref shape checks
    - generated chunk-map structural checks
  chosen_language: python_only_due_to_semantic_policy_complexity
  expected_rust_time_saved_or_reason_not_applicable: "T464 routing depends on semantic governance policy, non-authority checks, M4/M6 evidence posture, frontier escalation, and owner docket grouping. Existing Rust leaf validators remain available for structural scans, but the decision docket stays in Python."
  interop_boundary: "Python reads the scratch/model artifacts, applies governance routing, and emits non-authorizing ledgers. Rust is not a source of chunk, theology, source-tradition, reviewed-gold, or owner-decision authority."
  python_fallback_or_wrapper_plan: "No new Rust wrapper is introduced for T464; existing Python commands remain the stable agent interface and existing Rust validators are exercised through their current wrappers."
  validation_plan: "Run validate_t464_multi_model_decision_docket.py, focused pytest, validate_task_scope.py --task-id T464, validate_all.py, full pytest, generate_data_map.py --check, and git diff --check."
  maintenance_tradeoffs: "Keeping T464 in Python avoids hiding governance routing in a fast binary; later Rust acceleration should target deterministic leaf checks only after parity and lifecycle records exist."
acceptance_criteria:
  - "All six active model folders are present, complete, and auditable."
  - "Both compare entrypoints work."
  - "Agreement rows are non-authorizing and include stable IDs, confidence rollups, risk flags, and sidecar references."
  - "Every disagreement delta has a docket route."
  - "M4/M6 alignment is marked as a preferred evidence lens but never as authority."
  - "High-risk or low-confidence rows route to frontier review before owner decisions."
  - "Known textual-variant/source-tradition hot zones cannot remain easy consensus even if all six models agree."
  - "No reviewed gold, output, child-span, route/evaluator, graph/retrieval/vector, source-tradition, canon, or theology authority is created."
