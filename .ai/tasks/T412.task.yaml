acceptance_criteria:
  - "T412 creates an isolated Rust CLI contract for deterministic no-text observation ledgers under build/observation_substrate/current."
  - "Python validators enforce generated-artifact shape, canonical 66 coverage, no-text rows, and non-authorizing authority fields."
  - "validate_all.py runs only the fast T412 contract check and does not run the full Rust Bible scan."
  - "T411 Cursor execution remains frozen until the Rust substrate validates and Cursor consumes compressed ledger packs by default."
  - "No embeddings, vector indexes, graph edges, boundary imports, reviewed gold, chunk output, child spans, route/evaluator changes, source rows, canon changes, or theology authority are authorized."
