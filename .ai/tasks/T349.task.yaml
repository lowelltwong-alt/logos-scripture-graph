    - "Create a first-class machine-readable register for chunking theological decisions and a deterministic validator wired into validate_all."
  explicit_non_authorizations:
    - "No chunk output changes."
    - "No chunking algorithm or route behavior changes."
    - "No reviewed-gold promotion."
    - "No evaluator formula change."
    - "No leaderboard or scorecard update."
    - "No boundary import, T327G, Revelation implementation, embedding run, index build, or graph-edge generation."
acceptance_criteria:
  - "The register records owner decisions, affected books/passages/routes, downstream risk, avoided theological assumptions, reviewed-gold dependencies, non-authorizations, validators, and supersession/deprecation fields."
  - "Seed decisions include canonical 66 scope, Psalm 78 parent/child, Psalm 89 Option C, WJ marker limits, Revelation non-implementation, Psalm candidate non-promotion, and vector/edge never-truth."
  - "Full historical backfill coverage is represented by decision entries or no-impact markers for relevant chunking/governance tasks through T348."
  - "Validator fails closed if required metadata, seed decisions, backfill coverage, or changed-path register updates are missing."
validation:
  - python scripts/validate_chunking_theological_decision_register.py
  - python -m pytest -q tests/test_chunking_theological_decision_register.py
  - python scripts/validate_all.py
  - python -m pytest -q
handoff: .ai/handoffs/T349/handoff.md
