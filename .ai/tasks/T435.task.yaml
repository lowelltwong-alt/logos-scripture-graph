acceptance_criteria:
  - "Rust scanner consumes only the T431 SBLGNT canonical source view and included-files ledger, not raw archives directly."
  - "Generated ledgers stay ignored under build/original_language_observation/T435-A/sblgnt and emit no source wording."
  - "Generated rows record observed source-view shape only and keep all authority flags false."
  - "T433 Phlm.1.1-Phlm.1.3 shadow parity passes for 41 source-token shapes and 7 editorial shapes."
  - "SBLGNT Strong's, lemma, and morphology fields remain null/false because the source view does not provide them."
  - "Production candidate roots remain unopened until a later owner-gated population task."
  - "validate_all.py runs only the fast T435 contract validator, not the full Rust scan."
