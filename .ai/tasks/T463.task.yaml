runtime_language_preflight:
  task_id: T463
  touched_paths:
    - scripts/
    - tests/
    - tools/original_language_observation_scanner/
  expected_input_size_or_record_count: "The branch integrates original-language raw/source-view validators plus whole-Bible chunk-map validation surfaces that can run over full canonical-book model outputs and large no-text evidence ledgers."
  expected_runtime_or_memory_pressure: "Most governance checks stay in Python; deterministic chunk-map validation now uses the existing Rust fast path by default behind the stable Python command."
  rust_trigger_match:
    - repeated_gate_or_ci_hot_path
    - deterministic_streaming_parse_hash_or_compare
    - large_chunk_map_or_model_output_comparison
    - python_rust_parity_or_shadow_mode
  chosen_language: python_orchestration_with_rust_leaf_worker
  expected_rust_time_saved_or_reason_not_applicable: "Expected savings apply when multi-model whole-Bible chunk maps are validated repeatedly; the legacy Python command delegates to the Rust-backed wrapper while keeping --python-only for parity/debugging."
  interop_boundary: "Rust validates deterministic record/span/map structure only. Python remains the governance/task/DAD/theology-policy orchestrator and owns owner-gated meaning."
  python_fallback_or_wrapper_plan: "scripts/validate_whole_bible_chunk_map.py delegates to scripts/validate_fast_chunk_map.py unless --python-only is supplied. Wrappers preserve --python-fallback, --require-rust, and --compare-python behavior."
  validation_plan:
    - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
    - python scripts/validate_ai_pr_lifecycle_policy.py
    - python scripts/validate_coding_runtime_language_preflight.py
    - python scripts/validate_dad_outbox.py
    - python scripts/validate_task_scope.py --task-id T463
    - python scripts/agent/validate_handoffs.py
    - python scripts/validate_all.py
    - python -m pytest -q
    - python scripts/generate_data_map.py --check
    - git diff --check
  maintenance_tradeoffs: "Keeping stable Python commands avoids retraining agents and preserves policy wrappers; Rust acceleration is limited to deterministic leaf checks and must retain CheckReport-style failure locality."
acceptance_criteria:
  - "T431-T442 original-language stack is replayed on current main without conflict markers."
  - "AI-created drafts are governed by an explicit PR/visible-exit lifecycle policy and validator."
  - "Whole-Bible chunk-map validation uses the Rust-backed fast path by default while retaining --python-only parity/debugging."
  - "DAD receives a candidate-only lesson/asset report for PR lifecycle and Rust validator migration."
  - "No chunk output, reviewed gold, child spans, route/evaluator behavior, graph/retrieval/vector truth, source-tradition choice, canon change, DAD override, or theology authority is authorized."
validations:
  - cargo test --manifest-path tools/logos_fast_validators/Cargo.toml
