acceptance_criteria:
  - "Create a SQLite schema shell using only scripture_* and evidence_* tables."
  - "Seed only scripture_source_family, scripture_source_catalog, evidence_source_catalog_method_profile, and evidence_source_trust_rule rows from T391 official source anchors."
  - "Keep witness, identifier, date, material, coverage, discovery, holding-institution, and review-queue tables empty."
  - "Require source URL, method, confidence, provenance, review status, source family, rights/access status, and non-authorizing scope label on every seed row."
  - "Prove no canonical_* table or view includes source-catalog, boundary, commentary, patristic, theologian, doctrine, or apologetic data."
  - "Add validation/tests that build the schema in in-memory SQLite and reject forbidden namespaces, witness rows, missing provenance, or source URLs outside T391."
