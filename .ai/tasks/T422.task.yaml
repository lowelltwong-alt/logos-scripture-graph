  records_scratch_lane_policy: true
  authorizes_reviewed_gold_promotion: false
  authorizes_chunk_output_change: false
acceptance_criteria:
  - "scratch_lane_policy.yaml defines scratch and promotion lanes."
  - "validate_scratch_scope.py enforces branch prefix and allowed paths."
  - "validate_promotion_packet.py enforces submission packet shape."
  - "Codex promotion packet review prompt exists."
validations:
  - python scripts/validate_scratch_lane_policy.py
  - python scripts/validate_scratch_scope.py --branch scratch/test --file .ai/scratch/vendor/.gitkeep
  - python scripts/validate_promotion_packet.py --packet .ai/scratch/submissions/_template/promotion_packet.yaml --allow-template
  - python scripts/validate_all.py
