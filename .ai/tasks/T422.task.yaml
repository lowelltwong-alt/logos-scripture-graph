    - .ai/prompts/codex_daily_prep_review_prompt.md
    - .ai/handoffs/AGENT_ROUTING_GUIDE.md
    - .ai/control/autonomous_corpus_processor.yaml
    - .ai/control/multi_agent_review_cadence.yaml
    - .ai/control/chunking_lesson_index.yaml
    - .ai/control/chunking_theological_decision_register.yaml
    - .ai/control/PROJECT_STATUS.md
    - .ai/control/current_focus.yaml
    - AI_FRONT_DOOR.md
    - AI_TABLE_OF_CONTENTS.md
    - docs/roadmap/T422_SCRATCH_LANE.md
    - scripts/validate_scratch_lane_policy.py
    - scripts/validate_scratch_scope.py
    - scripts/validate_promotion_packet.py
    - scripts/validate_all.py
    - tests/test_scratch_lane_policy.py
    - tests/test_scratch_scope.py
    - tests/test_promotion_packet.py
  forbidden_paths:
    - data/raw/
    - data/canonical/
    - eval/chunking_gold/
