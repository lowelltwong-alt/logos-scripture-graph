    - scripts/validate_all.py
    - tests/test_t457_fast_canonical_qa.py
    - tests/test_t424_rust_fast_validators.py
  forbidden_paths:
    - data/raw/
    - data/canonical/
    - data/processed/
    - data/derived/
    - data/candidate/chunks/
    - data/candidate/connections/
    - .ai/scratch/
    - pipelines/chunking/
    - registry/chunking/
    - eval/chunking_gold/
    - eval/chunking_runs/
    - eval/LEADERBOARD.md
    - config/retrieval/
