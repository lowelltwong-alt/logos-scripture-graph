summary: Implicit parser-current-state anchoring can shift forward-declaring structural metadata backward, contaminate canonical
  text/tokens, and then become institutionalized in reviewed gold, tests, and baseline hashes.
extra_context: T473 began as a semantic multi-model pilot. Raw-source preflight found that a Psalm 119 d heading before verse
  9 was attached to verse 8 because the importer read state.current before the next verse started. Marker body text was appended
  to the previous canonical witness, speaker labels entered Song witnesses, and two heading word tags became bogus canonical
  WordTokens. A read-only scan characterized 15,303 next-bound claims; 13,977 point backward and 1,326 are null. The defect
  escaped because tests asserted marker presence but not anchor ownership, canonical-text exclusion, or source-order parity;
  reviewed gold and a baseline hash then protected the same generated error.
root_causes:
- category: implicit_state
  observed_failure: Between-verse markers inherited the previously open verse.
  likely_mechanism: record_usfm_event derived ownership from state.current rather than an explicit resolved anchor.
  prevention: Require anchor_kind plus prior_osis_ref and next_osis_ref; queue start-bound markers until lookahead resolves
    ownership.
- category: layer_contamination
  observed_failure: Heading and speaker-label text entered canonical witnesses and word tokens.
  likely_mechanism: Structural marker bodies were appended and parsed as verse content.
  prevention: Separate editorial labels from canonical text and token streams; add forbidden-label leakage validators.
- category: gold_feedback_loop
  observed_failure: Wrong generated boundaries became reviewed gold, fail-closed guardrails, tests, and baseline hashes.
  likely_mechanism: Gold was reviewed against output from the same flawed importer without an independent raw-order oracle.
  prevention: Validate raw source order independently before gold promotion; require provenance diversity and contradiction
    stops.
- category: test_semantics
  observed_failure: Fixtures checked that a marker existed but not which side of a boundary it owned.
  likely_mechanism: Shape and count assertions omitted semantic anchor direction and canonical-text exclusion.
  prevention: Add opening/interior/terminal/body-bearing/empty/ambiguous fixture matrices and mutation tests.
