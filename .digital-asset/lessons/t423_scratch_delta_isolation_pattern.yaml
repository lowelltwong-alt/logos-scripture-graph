lesson_candidate:
  pattern: "Run independent model scratch passes with identical evidence contracts, then use agreement/delta only to prioritize governed review."
  use_when: "A large corpus needs many candidate boundaries or classifications, and independent AI outputs can reduce search space before human/frontier decisions."
  avoid_when: "The task is promoting reviewed gold, creating canonical output, choosing a source tradition, deciding theology, or replacing owner/frontier review."
