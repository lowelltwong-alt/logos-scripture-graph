summary: "Use isolated multi-model scratch outputs to turn agreement into triage evidence and disagreement into a focused review queue."
extra_context: "This lesson comes from the T423/T464 whole-Bible chunking fork. Multiple models used the same schema, rules, literature hints, Strong's/WJ/source-metadata cautions, and non-authorizations, but each wrote to its own scratch folder and made independent boundary judgments. The comparison layer treats low-delta regions as prioritization evidence only and routes disagreement, low confidence, textual variants, prophecy/apocalyptic, poetry/lament/doxology, WJ/speaker pressure, original-language pressure, and theological pressure to Codex/frontier/owner review. Template sameness must standardize evidence logging, not force identical decisions or hide theology."
