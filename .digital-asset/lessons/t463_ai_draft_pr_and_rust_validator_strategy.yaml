summary: "AI-created drafts should reach PR or an owner-visible exit state, and deterministic validator hot paths should use stable Python commands backed by modular Rust leaf checks when the runtime preflight says Rust is worth it."
extra_context: "This combines two recurring cleanup costs observed in logos-scripture-graph: AI agents leaving drafts/branches/PRs stranded below owner-visible decision state, and repeated long deterministic Python validation work that can be accelerated without moving governance into Rust. The source repo now records an AI PR lifecycle policy plus a Rust validator migration pattern: keep Python command names stable, delegate expensive scans to validate_fast_* wrappers, preserve --python-only for parity/debugging, fail closed on Rust validation failures, and require named Rust modules returning CheckReport so bundled checks remain troubleshootable."
