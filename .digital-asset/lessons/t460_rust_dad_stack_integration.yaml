summary: "When several Rust/DAD PRs append to shared DAD outbox and context-map files, integrate them in dependency order and resolve conflicts as a validated union of all candidate lessons."
extra_context: "T460 integrated T456 runtime preflight, T457 canonical QA, T458 Rust subagent charter, and T459 word-token signal scanning. Each branch was valid alone, but the shared DAD append files conflicted when stacked. The reusable DAD lesson is that source repos should keep local outbox/context rows append-only, validate every referenced lesson slot, and use an explicit integration task rather than cleaning central DAD or weakening per-task scopes. This also preserves the owner's requirement that many repos can report messy Rust/tooling lessons in parallel without losing context."
