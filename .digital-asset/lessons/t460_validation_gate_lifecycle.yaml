summary: "Repos need a lifecycle registry for validation gates and other operational contracts so slow, generated-data-dependent, superseded, or retired checks are cleaned up deliberately instead of skipped ad hoc."
extra_context: "The issue surfaced when validate_all worked correctly but clean isolated worktrees lacked ignored generated canonical sidecars required by older semantic validators. Rust fast validators supersede some structural checks, but not semantic/theological inventory checks. The fix is a lifecycle registry with states such as active, active_generated_data, shadow, superseded, and retired; every retirement needs replacement/parity/owner evidence. External lifecycle patterns reviewed as analogies: Kubernetes deprecation policy and OpenTelemetry versioning/stability. DAD should export this beyond validators to generated artifacts, prompt packs, scratch outputs, Rust leaf tools, data sources/downloads, schemas/contracts, agent roles, KG predicates, retrieval/indexes, and DAD mail/lessons."
