summary: "Sandboxed validator failures from temp directories or Cargo target locks should be classified separately from code failures and routed through writable repo-local temp paths before verdicts are reported."
extra_context: "This came from repeated Windows/Codex desktop work where long pytest, validate_all, and Rust-backed validator runs can hit WinError 5 or permission-denied failures around AppData Local Temp, pytest temp/cache directories, Python TemporaryDirectory outputs, or Cargo target/build locks. Many repos are now deploying Rust validators and reporting DAD lessons in parallel, so DAD should provide a reusable runtime-environment preflight asset with minimum structured requirements plus an extra_context field for messy observations."
