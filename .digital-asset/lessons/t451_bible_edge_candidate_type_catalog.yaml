object_type: dad_lesson_learned_slot
schema_version: dad_lesson_learned_slot.v0.1
source_repo: logos-scripture-graph
task_id: T451
source_outbox_message_id: msg-20260705-t451-bible-edge-candidate-type-catalog
context_map_entry: ctx-t451-bible-edge-candidate-type-catalog
trust_zone: candidate
local_adoption_required: true
title: "Bible edge candidate types must be cataloged before graph generation"
summary: >
  Bible knowledge graphs need a staged candidate edge-type catalog before any
  predicate registry expansion or edge generation. The reusable pattern is to
  separate deterministic structure/metadata edges, reviewed semantic edges,
  and model-inferred candidates, while adding evidence floors, escalation
  triggers, and never-auto-create rules for theology, prophecy, variants,
  original-language, apologetic, and polemic claims.
extra_context: >
  The owner wants many models to help discover Bible-appropriate edges for
  conservative/credal theology, apologetics, polemics, history, linguistics,
  prophecy, Revelation/Daniel, covenant, sacrifice, calendar, wisdom,
  literary form, and manuscript evidence. This source repo must keep Strong's,
  WJ/red-letter, editorial crossrefs, headings, manuscript age, source
  traditions, and model agreement as evidence only until later owner-gated
  graph work.
candidate_assets:
  - bible_edge_candidate_type_catalog
  - edge_evidence_floor_pattern
  - frontier_escalation_before_predicate_registration
  - never_auto_create_guardrail_list
use_when:
  - "A repo wants to build semantic graph edges over a sacred, legal, medical, financial, or otherwise high-authority corpus."
  - "Multiple AI models propose edge types before a registry or graph database exists."
  - "A project needs to avoid model-generated claims becoming graph truth."
avoid_when:
  - "The task already has an owner-approved exact predicate schema and reviewed edge source."
  - "The task is purely deterministic file/reference validation with no semantic claims."
non_authorizations:
  - dad_override_local_authority
  - predicate_registry_expansion
  - graph_edge_generation
  - candidate_edge_population
  - retrieval_or_vector_truth
  - theology_authority
  - apologetic_conclusion_as_truth
