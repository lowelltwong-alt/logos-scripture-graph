summary: "Rust fast validators should use one CLI entry point, named modules, typed inputs, and per-check reports so bundled validation stays fast and troubleshootable."
extra_context: "The owner asked whether many deterministic Python tests that always run in sequence can become a combined Rust validator without becoming harder to debug. T462 implements the preferred shape: main.rs only dispatches; modules such as jsonl_scan, canonical_scope, span_parse, chunk_map, and word_tokens expose run_check(input) -> CheckReport; bundle emits a single aggregate JSON summary with named per-check timing and failures. This gives agents one way in and one way out while preserving module-level troubleshooting."
