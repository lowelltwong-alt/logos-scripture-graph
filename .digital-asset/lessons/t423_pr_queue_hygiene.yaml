summary: "When AI agents create staged work, branches, or PRs, the queue needs explicit next-action state and escalation before stale branches pile up."
extra_context: "During T423 integration, many related PRs and scratch branches existed at once. The owner identified the reusable lesson: if staged work or a PR does not get merged, reviewed, held, or closed promptly, it should escalate to a human/integrator instead of silently becoming part of a large future cleanup. This is especially important for repos with multiple AI agents, Rust rollouts, generated artifacts, and long validation cycles."
