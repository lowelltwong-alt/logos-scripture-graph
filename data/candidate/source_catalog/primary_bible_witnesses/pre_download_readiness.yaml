object_type: primary_witness_pre_download_readiness
task_id: T484
status: ready_for_storage_and_rights_gates_only
binary_acquisition_authorized: false
global_prerequisites:
  - LOGOS_EXTERNAL_ASSET_ROOT exists outside Git, OneDrive, workspace, and temp paths
  - external root has at least 50 GB free
  - validate_external_asset_root.py passes
  - per-source license snapshot, URL, expected size, and SHA-256 are recorded before download
  - guard_primary_witness_acquisition.py passes for each unit
  - every artifact remains outside Git and all canonical/graph/retrieval/vector paths
quarantine_layout:
  root: LOGOS_EXTERNAL_ASSET_ROOT/primary_witnesses/
  metadata_journal: acquisition_journal.jsonl
  per_asset_required: [asset_id, source_id, original_url, retrieval_timestamp, byte_size, sha256, rights_status, license_snapshot, removal_owner]
