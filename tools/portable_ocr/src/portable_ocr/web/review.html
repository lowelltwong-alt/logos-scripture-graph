<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portable OCR Review</title><style>
:root{font-family:system-ui,sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.shell{max-width:1400px;margin:auto;padding:20px}.notice{padding:12px;background:#fff3cd;border:1px solid #dbbd45;border-radius:9px}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:16px}.card{background:#fff;border:1px solid #d6dde5;border-radius:13px;padding:17px}img{width:100%;max-height:75vh;object-fit:contain}.candidate{white-space:pre-wrap;border-left:4px solid #315fc4;padding:9px;margin:9px 0;background:#f6f8ff}textarea{width:100%;min-height:90px;padding:9px;font:inherit}button{padding:9px 13px;margin:8px 5px 0 0;border:0;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:#176b51;color:#fff}.danger{background:#8b2d38;color:#fff}.hidden{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}.shell{padding:10px}}
</style></head><body><main class="shell"><h1>OCR human review</h1><p class="notice"><strong>Review evidence, not a machine verdict.</strong> Agreement is not truth. This page works offline and cannot promote text.</p><div class="grid"><section class="card"><h2>Source page</h2><img id="page" alt="Page being reviewed"></section><section class="card"><h2>Blind candidates</h2><div id="candidates"></div><h3 id="question"></h3><p id="examples"></p><label for="answer"><strong>Answer in your own words</strong></label><textarea id="answer" placeholder="Candidate A is right; it says…; I cannot read it"></textarea><div><button class="primary" id="submit">Answer</button><button id="context">Show context</button><button class="danger" id="unreadable">Unreadable</button></div><p id="status" role="status" aria-live="polite"></p><div id="exportBox" class="hidden"><label><input id="attest" type="checkbox"> I visually inspected the displayed source.</label><br><button class="primary" id="export" disabled>Export review record</button></div><details><summary>Review history</summary><ol id="events"></ol></details></section></div></main>
<script>
const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__REVIEW_PAYLOAD_B64__'),c=>c.charCodeAt(0)))),run=payload.run,$=x=>document.getElementById(x);$('page').src=payload.imageUri;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('candidates').innerHTML=run.candidates.map(c=>`<div class="candidate"><strong>${esc(c.blind_label)}</strong><br>${esc(c.text)}</div>`).join('');
let s={schema:'portable_ocr_review_session.v1',run_id:run.run_id,state:'ask_readability',events:[],decision:null};
function ask(q,e=[]){$('question').textContent=q;$('examples').textContent=e.length?'Examples: '+e.join(' · '):'';$('answer').value='';$('answer').focus()}
function parse(t){let l=t.trim().toLowerCase();if(/cannot read|can't read|unreadable|illegible/.test(l))return['cannot_read'];if(/no text|blank page|nothing to read|image only/.test(l))return['no_text_by_design'];if(/context|not sure|unsure/.test(l))return['request_context'];for(const c of run.candidates){let x=c.blind_label.toLowerCase(),z=x.replace('candidate ','');if([x,z,x+' is right',z+' is right'].includes(l))return['choose_candidate',c.blind_label]}let m=t.match(/(?:text is|it says|it reads|should (?:say|read|be))\s*[:\-]?\s*(.+)$/i);if(m)return['supply_text',m[1].trim()];if(/^(yes|correct|readable|that's right)$/i.test(l))return['confirm'];if(/^(no|wrong|not right)$/i.test(l))return['reject'];return['unclear']}
function record(a,p){s.events.push({sequence:s.events.length+1,question_state:s.state,answer:a,interpreted_intent:p[0],interpreted_value:p[1]??null});$('events').innerHTML=s.events.map(e=>`<li>${esc(e.answer)}</li>`).join('')}
function confirm(i,v){s.state='confirm_interpretation';s.pending={intent:i,value:v};ask(`I understood: ${v}. Is that correct?`,['Yes','No'])}
function handle(a){let p=parse(a);record(a,p);if(s.state==='confirm_interpretation'){if(p[0]==='confirm'){let d=s.pending.intent==='disposition'?s.pending.value:s.pending.intent==='choose_candidate'?'selected_engine_candidate':'verified_with_corrections';s.decision={disposition:d,value:s.pending.intent==='disposition'?null:s.pending.value,human_confirmed:true,automatic_promotion_performed:false};s.state='complete';ask('Recorded. Nothing was promoted.');$('exportBox').classList.remove('hidden');$('submit').disabled=true;return}if(p[0]==='reject'){s.state='ask_reading';return ask('Please name the candidate or type the exact text.')}return ask('Please answer yes or no.')}
if(p[0]==='cannot_read')return confirm('disposition','needs_second_review');if(p[0]==='no_text_by_design')return confirm('disposition','no_extractable_text_by_design');if(p[0]==='request_context'){s.state='ask_reading';return ask('Look at nearby lines. What does the highlighted text say?')}if(['choose_candidate','supply_text'].includes(p[0]))return confirm(p[0],p[1]);if(s.state==='ask_readability'&&p[0]==='confirm'){s.state='ask_reading';return ask('Which candidate matches, or what is the exact text?',run.candidates.map(c=>c.blind_label))}ask('I did not understand. Name a candidate, type the text, or say unreadable.')}
$('submit').onclick=()=>handle($('answer').value);$('context').onclick=()=>handle('I need more context');$('unreadable').onclick=()=>handle('I cannot read it');$('attest').onchange=()=>$('export').disabled=!$('attest').checked;$('export').onclick=()=>{let a={...s,source_sha256:run.source.sha256,candidate_hashes:run.candidates.map(c=>({candidate_id:c.candidate_id,text_sha256:c.text_sha256})),reviewer_attestation:true,not_source_truth:true};let b=new Blob([JSON.stringify(a,null,2)+'\n'],{type:'application/json'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download=`ocr-review-${run.run_id}.json`;x.click();URL.revokeObjectURL(x.href)};ask('Can you clearly read this page?',['Readable','Unreadable','I need more context']);
</script></body></html>
