[project]
name = "logos-scripture-graph"
version = "0.1.0"
description = "Governed Bible graph, chunking, and concordance substrate"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Dependency-light by default; these enable richer validation in CI.
validate = ["jsonschema>=4.18", "pyyaml>=6.0"]
test = ["pytest>=7.0"]

# This repo runs scripts directly (python pipelines/..., python -m pytest) and is
# not imported as an installed package — pipelines put repo root on sys.path
# themselves. Tell setuptools there is nothing to build so `pip install -e .`
# (used in CI to pull the extras) does not trip flat-layout auto-discovery.
[tool.setuptools]
py-modules = []

[tool.logos]
raw_source_root = "data/raw"
chunking_policy = "config/chunking/chunking_policy.yaml"
roadmap_state = "ROADMAP_STATE.yaml"
