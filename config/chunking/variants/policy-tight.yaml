# A/B variant policy: tighter budgets (smaller chunks) for retrieval-precision testing.
# Used by the chunker via --policy. See docs/chunking/EXECUTION_PLAN.md.
version: chunk-policy-v0.1.0-tight
budgets:
  target_tokens: 350
  soft_max_tokens: 550
  hard_max_tokens: 800
  emergency_split_allowed: true
