version: 0.1.0
roles:
  source_ingestor:
    purpose: "Receive raw files, create manifests, verify checksums, run importers."
    allowed_paths:
      - data/raw/
      - data/processed/
      - pipelines/ingest/
      - pipelines/validate/
    forbidden_actions:
      - "edit raw source content"
      - "change chunking policy"
    required_outputs:
      - source_manifest
      - validation_report
      - handoff
  chunking_architect:
    purpose: "Design and maintain chunking rules, boundary scoring, and validation tests."
    allowed_paths:
      - docs/chunking/
      - config/chunking/
      - schemas/chunk.schema.json
      - pipelines/chunking/
      - tests/
    required_outputs:
      - chunking_policy_change_note
      - tests_or_test_plan
      - handoff
  biblical_literature_reviewer:
    purpose: "Review literary unit policies for Psalms, wisdom, prophecy, Gospels, epistles, and apocalyptic literature."
    allowed_paths:
      - docs/chunking/
      - data/derived/review/
      - .ai/handoffs/
    required_outputs:
      - review_notes
      - boundary_disagreement_log
  hebrew_reviewer:
    purpose: "Review Hebrew Bible source-language boundary implications."
    allowed_paths:
      - docs/chunking/
      - config/sources/
      - data/raw/bible/hebrew-wlc/
      - .ai/handoffs/
    required_outputs:
      - hebrew_boundary_notes
  greek_reviewer:
    purpose: "Review Greek NT/LXX boundary implications."
    allowed_paths:
      - docs/chunking/
      - config/sources/
      - data/raw/bible/greek-nt/
      - data/raw/bible/lxx-swete/
      - .ai/handoffs/
    required_outputs:
      - greek_boundary_notes
  graph_modeler:
    purpose: "Maintain relationship object schemas and graph contracts."
    allowed_paths:
      - schemas/
      - docs/architecture/
      - config/governance/
      - data/canonical/
    required_outputs:
      - schema_change_note
      - handoff
  provenance_validator:
    purpose: "Ensure all source, chunk, and relationship artifacts have provenance and license metadata."
    allowed_paths:
      - schemas/
      - config/sources/
      - data/canonical/
      - data/derived/
      - pipelines/validate/
    required_outputs:
      - validation_report
      - handoff
  roadmap_steward:
    purpose: "Maintain roadmap, task state, event log, and handoff compliance."
    allowed_paths:
      - ROADMAP.md
      - ROADMAP_STATE.yaml
      - .ai/
      - scripts/agent/
    required_outputs:
      - roadmap_event
      - handoff_validation
  prep_agent:
    purpose: "Cursor long-running autonomous prep: draft review packets and claim traceability until backlog empty."
    operational_alias_for: cursor
    canonical_cadence: .ai/control/multi_agent_review_cadence.yaml
    allowed_paths:
      - .ai/context/agent_work/
      - .ai/handoffs/
    forbidden_actions:
      - "promote drafts to eval/chunking_gold without owner authorization"
      - "implement chunk output or reviewed gold"
      - "merge prep branch to main without codex daily review"
    required_outputs:
      - review_packet_drafts
      - claim_traceability
      - handoff_progress_update
  daily_integrator:
    purpose: "Codex daily integrator review of Cursor prep branches; APPROVE_PREP or HOLD_WITH_FINDINGS."
    operational_alias_for: codex
    canonical_cadence: .ai/control/multi_agent_review_cadence.yaml
    prompt_template: .ai/prompts/codex_daily_prep_review_prompt.md
    allowed_paths:
      - .ai/handoffs/
      - .ai/control/agent_review_ledger.jsonl
      - .ai/audits/
      - scripts/
      - tests/
    forbidden_actions:
      - "authorize reviewed gold or chunk output"
      - "clear variant or theology holds"
    required_outputs:
      - ledger_append
      - daily_verdict
      - handoff_update
  weekly_architecture_auditor:
    purpose: "Claude Opus weekly architecture and chunking-error audit; rollup of Cursor prep and Codex daily verdicts."
    operational_alias_for: claude
    canonical_cadence: .ai/control/multi_agent_review_cadence.yaml
    prompt_template: .ai/prompts/claude_weekly_architecture_chunking_audit_prompt.md
    preferred_model: claude-opus-4.8
    allowed_paths:
      - .ai/handoffs/
      - .ai/control/agent_review_ledger.jsonl
      - .ai/audits/reports/weekly/
      - .ai/context/agent_work/
    forbidden_actions:
      - "authorize reviewed gold or chunk output"
      - "make owner decisions"
    required_outputs:
      - weekly_audit_report
      - ledger_append
      - architecture_findings
  rust_architecture_reviewer:
    purpose: "Review Rust architecture, Python/Rust boundaries, parity contracts, no-text guarantees, and governance leakage risk before implementation."
    ai_agnostic: true
    capability_profile: reasoner
    canonical_cadence: .ai/control/ai_agnostic_rust_subagent_charter.yaml
    allowed_paths:
      - .ai/audits/
      - .ai/context/agent_work/
      - .ai/handoffs/
      - docs/architecture/
      - docs/roadmap/
      - .ai/control/*rust*.yaml
      - tools/*/Cargo.toml
      - scripts/validate_*rust*.py
      - tests/test_*rust*.py
    forbidden_actions:
      - "implement production Rust code"
      - "approve semantic authority from Rust output"
      - "weaken Python governance orchestration"
      - "choose a vendor or model name"
    required_outputs:
      - architecture_review_report
      - rust_fit_decision
      - parity_contract_findings
      - handoff
    non_authorizations:
      - rust_validator_as_governance_authority
      - chunk_output_change
      - reviewed_gold_promotion
      - graph_retrieval_or_vector_truth
      - theology_authority
  outside_rust_research_scout:
    purpose: "Gather official Rust documentation and established aligned GitHub examples for hard Rust problems as candidate research only."
    ai_agnostic: true
    capability_profile: reasoner
    canonical_cadence: .ai/control/ai_agnostic_rust_subagent_charter.yaml
    allowed_paths:
      - .ai/context/agent_work/
      - .ai/handoffs/
      - .digital-asset/mail/
    forbidden_actions:
      - "edit tools/"
      - "edit scripts/"
      - "edit .ai/control/"
      - "recommend unpinned or unreviewed dependencies as adopted"
      - "copy large external code"
      - "choose a vendor or model name"
    required_outputs:
      - research_brief
      - source_refs
      - applicability_limits
      - license_or_copy_risk_notes
      - handoff
    non_authorizations:
      - dependency_adoption
      - architecture_decision_authority
      - dad_override_local_authority
  rust_engineer:
    purpose: "Implement narrowly scoped Rust CLIs or libraries behind Python wrappers, fixtures, parity gates, and fail-closed contracts."
    ai_agnostic: true
    capability_profile: executor
    canonical_cadence: .ai/control/ai_agnostic_rust_subagent_charter.yaml
    allowed_paths:
      - tools/usfm_observation_scanner/
      - tools/logos_fast_validators/
      - tools/chunk_observation_scanner/
      - scripts/validate_fast_*.py
      - scripts/validate_*rust*.py
      - tests/test_*rust*.py
      - docs/roadmap/
      - .ai/handoffs/
    forbidden_actions:
      - "write data/raw/"
      - "write data/canonical/"
      - "write eval/chunking_gold/"
      - "create chunk output"
      - "make Rust the sole governance authority"
      - "choose a vendor or model name"
    required_outputs:
      - rust_code
      - python_wrapper_or_contract
      - focused_tests
      - parity_report
      - handoff
    non_authorizations:
      - rust_validator_as_governance_authority
      - chunk_output_change
      - reviewed_gold_promotion
      - graph_retrieval_or_vector_truth
      - theology_authority
  rust_qa_tester:
    purpose: "Verify Rust/Python parity, fallback behavior, generated-output no-text constraints, fail-closed exits, and performance claims."
    ai_agnostic: true
    capability_profile: executor
    canonical_cadence: .ai/control/ai_agnostic_rust_subagent_charter.yaml
    allowed_paths:
      - tests/
      - scripts/validate_*rust*.py
      - scripts/validate_fast_*.py
      - .ai/audits/
      - .ai/context/agent_work/
      - .ai/handoffs/
    forbidden_actions:
      - "fix implementation while claiming independent QA"
      - "bless mismatches without owner or Codex review"
      - "promote benchmark speed as semantic correctness"
      - "choose a vendor or model name"
    required_outputs:
      - qa_report
      - parity_result
      - mismatch_ledger_if_any
      - validation_commands
      - handoff
    non_authorizations:
      - semantic_correctness_from_speed
      - chunk_output_change
      - reviewed_gold_promotion
      - graph_retrieval_or_vector_truth
      - theology_authority
  dad_lesson_reporter:
    purpose: "Report reusable Rust workflow, tool-failure, scout, and coordination lessons to DAD as candidate-only mail and lesson slots."
    ai_agnostic: true
    capability_profile: orchestrator
    canonical_cadence: .ai/control/ai_agnostic_rust_subagent_charter.yaml
    allowed_paths:
      - .digital-asset/mail/
      - .digital-asset/context-map.json
      - .digital-asset/lessons/
      - .ai/handoffs/
    forbidden_actions:
      - "treat DAD response as local authority"
      - "edit canon/chunking/control truth from DAD mail"
      - "clean unrelated DAD work"
      - "publish private/internal details without human release"
      - "choose a vendor or model name"
    required_outputs:
      - outbox_jsonl_line
      - context_map_entry
      - lesson_slot_update_or_no_change_rationale
      - handoff
    non_authorizations:
      - dad_override_local_authority
      - adopt_candidate_lessons_without_review
      - clean_unrelated_dad_work
      - theology_authority
  connection_discoverer:
    purpose: "Find NEW connections we have not curated (intertextual, lexical, thematic, extra-biblical) and emit them as CANDIDATE claims with evidence — never auto-promote. See .ai/handoffs/CONNECTION_DISCOVERY_AGENT.md."
    allowed_paths:
      - data/derived/
      - data/candidate/
      - .ai/handoffs/
    forbidden_actions:
      - "write to data/canonical/ or data/raw/"
      - "promote a candidate edge to asserted/canonical (human-gated)"
      - "emit an edge without evidence_refs + provenance + confidence"
      - "promote editorial \\x crossrefs to theological predicates"
    required_outputs:
      - candidate_relationship_objects
      - discovery_report
      - handoff

compatibility_aliases:
  chunking_architect:
    target_family: scripture-first-biblical-chunking
    target_profile: scripture_first_family_architect
    legacy_role_retained: true
    adapter_mode: candidate_review_only
  biblical_literature_reviewer:
    target_family: scripture-first-biblical-chunking
    target_profile: scripture_first_text_structure_observer
    legacy_role_retained: true
    adapter_mode: candidate_review_only
  hebrew_reviewer:
    target_family: scripture-first-biblical-chunking
    target_profile: scripture_first_hebrew_structure_specialist
    legacy_role_retained: true
    adapter_mode: evidence_only
  greek_reviewer:
    target_family: scripture-first-biblical-chunking
    target_profile: scripture_first_greek_structure_specialist
    legacy_role_retained: true
    adapter_mode: evidence_only
  shared_non_authorizations:
    - chunk_output_change
    - reviewed_gold_promotion
    - preferred_reading_or_translation_selection
    - doctrine_or_theology_authority
    - legacy_role_deletion_or_replacement
