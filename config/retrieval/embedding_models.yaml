# Embedding model registry (T348 — planning-only skeleton).
#
# Every embedding model ever used must be registered here BEFORE use and must
# conform to schemas/embedding_model.schema.json. Records are never deleted:
# retired models keep their entry so old index manifests stay interpretable.
#
# While .ai/control/scripture_vectorization_plan.yaml has
# embedding_runs_allowed: false, no entry may have status approved.
# Approval requires an owner decision recorded in owner_decision_ref.

registry_id: logos-scripture-graph-embedding-models
schema_ref: schemas/embedding_model.schema.json
plan_ref: .ai/control/scripture_vectorization_plan.yaml
contract_metadata:
  task_id: T348
  contract_scope: planning_only
  governance_authority: false
  authority_note: "Planning metadata only; not governance authority and not authorization to run embeddings, build indexes, generate graph edges, import boundary corpora, choose a backend, or promote retrieval profiles."
  non_authorized_actions:
    - embedding_runs
    - vector_index_builds
    - graph_edge_generation
    - boundary_imports
    - backend_selection
    - retrieval_profile_promotion

models: []
